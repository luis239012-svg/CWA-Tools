<style>
/* Layout: one-column field tool in the CWA house style — navy brand bar with logo, sticky search + filters, results list; a note opens full-screen */
:root{
  --bg:#F3F6FA; --surface:#FFFFFF; --fg:#0B2545; --muted:#5A6F88; --line:#D3DEEA;
  --brand:#0B2545; --brand-sub:#B8D4F8; --accent:#F4511E; --link:#1C4E8A;
  --chip-on:#0B2545; --chip-on-fg:#FFFFFF; --code-bg:#FDE6DD; --code-fg:#B53A12; --mark:#FFD9C9;
  --font-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --font-ui:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#060E1E; --surface:#0E1A30; --fg:#E6EEF8; --muted:#8FA6C2; --line:#203352;
  --brand:#08142A; --brand-sub:#B8D4F8; --accent:#FF6A3D; --link:#7AABDD;
  --chip-on:#3476B8; --chip-on-fg:#FFFFFF; --code-bg:#3A1A10; --code-fg:#FF9B78; --mark:#5A2614; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#060E1E; --surface:#0E1A30; --fg:#E6EEF8; --muted:#8FA6C2; --line:#203352;
  --brand:#08142A; --brand-sub:#B8D4F8; --accent:#FF6A3D; --link:#7AABDD;
  --chip-on:#3476B8; --chip-on-fg:#FFFFFF; --code-bg:#3A1A10; --code-fg:#FF9B78; --mark:#5A2614; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-ui);margin:0;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.brandbar{background:var(--brand);color:#fff}
.brandbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.logo{height:40px;width:auto;display:block;flex:none}
.logo .hub{fill:var(--brand)}
.app-name{font-family:var(--font-display);font-weight:600;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--brand-sub);text-align:right;line-height:1.1;font-variant-numeric:tabular-nums}
.app-name b{display:block;color:#fff;font-size:19px;font-weight:700;letter-spacing:.04em}
#ctl{padding-block:12px 10px;display:grid;gap:10px}
.search{position:relative}
.search input{width:100%;height:50px;font:500 17px var(--font-ui);padding:0 44px 0 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg)}
.search input:focus{outline:none;border-color:var(--link)}
.search button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);font-size:22px;width:38px;height:38px;cursor:pointer}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;font:500 13px var(--font-ui);cursor:pointer;white-space:nowrap}
.chip b{font-weight:500;font-size:11px;color:var(--muted);margin-left:5px;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--chip-on);border-color:var(--chip-on);color:var(--chip-on-fg)}
.chip[aria-pressed="true"] b{color:inherit;opacity:.75}
select{font:inherit;font-size:13px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);max-width:100%}
.row2{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.row2 small{color:var(--muted);font-size:12px}
main .wrap{padding-block:8px 40px}
.list{list-style:none;margin:0;padding:0;display:grid}
.item{border-bottom:1px solid var(--line)}
.item a{display:grid;gap:3px;padding:12px 2px;color:inherit;text-decoration:none}
.item a:active{background:var(--surface)}
.t{font-weight:600;font-size:15.5px;display:flex;gap:8px;align-items:baseline;min-width:0}
.t .tt{min-width:0;overflow-wrap:anywhere}
.code{flex:none;font-family:var(--font-mono);font-size:13px;font-weight:600;background:var(--code-bg);color:var(--code-fg);padding:1px 6px;border-radius:5px}
.meta{font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap}
.meta .pic::before{content:"▣ "}
.snip{font-size:13.5px;color:var(--muted);overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
mark{background:var(--mark);color:inherit;border-radius:2px}
.group{font-family:var(--font-display);font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--link);padding:16px 2px 4px;font-weight:700}
.empty{padding:40px 4px;color:var(--muted);text-align:center}
.more{display:block;margin:16px auto;font:inherit;padding:10px 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
#detail .top{display:flex;gap:10px;align-items:center;padding-block:12px 4px}
.back{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:8px 14px;cursor:pointer}
#detail h2{font-size:21px;line-height:1.3;margin:6px 0 4px;text-wrap:balance;overflow-wrap:anywhere}
.dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:13px;color:var(--muted);margin:8px 0 14px}
.dl dt{font-weight:600}.dl dd{margin:0;overflow-wrap:anywhere}
.body{white-space:pre-wrap;font-family:var(--font-ui);overflow-wrap:anywhere;font-size:15px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin:0}
.body:empty{display:none}
h3{font-family:var(--font-display);font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--link);margin:22px 0 8px}
.shots{display:grid;gap:12px}
.shots img{width:100%;height:auto;border:1px solid var(--line);border-radius:8px;background:#fff;display:block}
details{margin-top:16px}
summary{cursor:pointer;color:var(--link);font-size:14px}
details pre{white-space:pre-wrap;overflow-wrap:anywhere;font-family:var(--font-mono);font-size:12px;color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>

:212 or 25:62), check the bridge between X6:2 and X6:3 on the 'MotorControl' PCB (see TSS no. 1837).\nDefective temperature switch (thermistor)\nBroken (interrupted) thermistor power supply cable\nTSS NO.1837:\nJcurrent status:\nJstatus = :\nJlevel= 1013@ ID= 52\nJYaw Inverter 2\n> | : | + | Quit |\nThis is an “error message”. If the software is running on the masterboard, status 25:115 is planned for rectifier overtemperature. If the software is\nrunning on the slave board, this status may not appear. However, if this status occurs, check the bridge X2:2 - X2:3 on plug X2 on “motor control”\nboard (slave). If this bridge is alright, the board itself is defective and has to be replaced. The same applies for status 25:112 and 25:212. Check here\nthe bridge on plug 6:2 — 6:3 on slave board.","im":["shared_fault_info_1_007"],"k":"25:212"},{"i":6,"c":"Faults","s":"0-49","t":"22:11 Yaw lock by yaw inverter.","d":"08 January 2021","f":"shared fault info 1.pdf","p":[8],"r":"","b":"The bits are counted from right to left:\nBit 0: Inverter not ready\nBit 1: obsolete, no longer used\nBit 2: 1 = no inverter temperature, 0 = overtemperature (either inverter heat sink\nor motors, no further differentiation)\nBit 3: Motors with 3000min-1 detected (CS44/48 only)\nBit 4: from version 3.40 brake released\nBit 5: from version 3.40 fast brake active\nBit 6 and 7 are not used.","o":"22:11 Yaw lock by yaw inverter.\n08 January 2021 14:27\nThe following menu under \"Yaw data\" shows the control bits transmitted to the I/O board by the yaw inverters:\nFig.: 12_MEN_AZI UMR_BITS\nThe bits are counted from right to left:\nBit 0: Inverter not ready\nBit 1: obsolete, no longer used\nBit 2: 1 = no inverter temperature, 0 = overtemperature (either inverter heat sink\nor motors, no further differentiation)\nBit 3: Motors with 3000min-1 detected (CS44/48 only)\nBit 4: from version 3.40 brake released\nBit 5: from version 3.40 fast brake active\nBit 6 and 7 are not used.","im":["shared_fault_info_1 ed by the temperature sensor of each motor.\nFor example, the temp. sensor of motor 2 blade B has an defective, in that case the software detect only one\ninstalled pitch motor on this blade, but via parameter P2013 are adjusted two pitch drives per blade. This lead to\nstatus 42:233","o":"42:x33 (Wrong pitch drive blade X)\n05 January 2021 12:03\nThe status 42:x33 is generated during commissoning or during WEC operation. Not yet applicable for the UK.\nThe status message 42:x33 is generated if the actually installed number of pitch drives per blade doesn ‘t match\nwith the number of pitch drives per blade set on the IO Board 1 control cabinet.\nno. of pitch drives\nper blade:\nP2013= 2\nThe actually installed number of pitch drives per blade is detected by the temperature sensor of each motor.\nFor example, the temp. sensor of motor 2 blade B has an defective, in that case the software detect only one\ninstalled pitch motor on this blade, but via parameter P2013 are adjusted two pitch drives per blade. This lead to\nstatus 42:233","im":["shared_fault_info_1_017"],"k":"42:x33"},{"i":16,"c":"Faults","s":"0-49","t":"42:X38 Motor current too high","d":"01 May 2018","f":"shared fault info 1.pdf","p":[18,19],"r":"","b":"    Please see x2 emails at bottom from Germany on recommendations for this fault.                            S42.x38\n                                                                                                             Motor cur...\n\nWe have experienced this in the past where the adaptor cable has altered the connections of the\nexcitation circuit. In the drawing below you can see two pairs (1&2 + 3&4). These are shorted in the slip\nring.\nIf you measure the resistance of the connections you will have two pairs with a dead short and a\nresistance of around 100 ohm between the two pairs (The resistance of the rotor).\nUsing the drawing below can you identify the two pairs at the rotor sub and trace them through the SRU\nand on two the excitation controller. This should leave you with just changing the connections in the\nadaptor cable but if you need any further help let me know.\n\nBlade A motor is constantly changing speed but the set angle does not change. This is happening at\napprox 2.5 degrees. This can occur when when the teeth are worn.\n\nRecommend measuring the backlash on the blade, this should be done with the blade at 0 degree as is\nthe best position to carry out once the grease pan is dismantled. please also note if ware is showing on\nthe teeth.\n\nIf wear does show it is possible to turbine the blade flange bearing and the pinion to ise an unused tooth\non the pinion.\n\nPlease see TSI: td-esc-07-ger-eng-11-025\n\n    Subject   E82 >>> check insistent fault cumulation >>> long therm aim is to reduce service cost (GB)\n    From      Hartmut Beckering\n    To        Benjamin Arndt; Marc Dewing\n    Sent      04 September 2018 13:23\n\n    Hello Benjamin & Marc,\n\n    it follows some Information to a noticeable Turbine in your region with some insistent cumulation of\n    status messages around blade control (Status.: 42)\n\n    Our developer checked this Turbines in front, and gave us some additional Information and\n    a recommendation (look below to the list) what we could do as next to solve the problem.\n\n    Please organize to carry out the recommendation and gave us feedback for further analysis , it\n    will be helpful if we could get a short info in front which time date roughly you will plan this\n    activity.\n\nNote.:\n  • Measure the backlash (blade on 0°). The position for measurement is good reachable if the\n     grease pan is dismantled.\n  • If you discover wearing , it is possible to turn the blade flange bearing and the pinion to use\n     finally unused tooth of the pinion.\n\nRegards Hartmut.\n==================================\nHartmut Beckering\nESC Technical Department\n-Electrical Engineering-\n\nENERCON Service Center\nDieselstr. 2\n26607 Aurich / Germany\nPhon shared_fault_info_1_029"],"k":"45:xxx"},{"i":22,"c":"Faults","s":"0-49","t":"46:X01 Fault capacitor test Blade X","d":"12 October 2017","f":"shared fault info 1.pdf","p":[30,31,32,33,34,35],"r":"","b":"       TSS report 2903:\n\n45:X11 No trickle charge 175V capacitor\nFriday, June 24, 2016   10:22 AM\n\nFirst check Fuses F02, F03 and F05 within the relay box\nMost common cause of this issue is the - Battery charger PCB.\n    Other causes for this issue could be - Pitch motor, bitch brake, wiring to these\n                                         - Relay box issues\n                                         - wiring between capacitor box relay box and pitch box.\n\n                                                                                                                                                                                                  Previous investigations found.\n47:10 Fault security system-Main security circuit                                                                                                                                                 Carry out checks of blade motors, angle encoders, pitch and relay boxes.\nThursday, June 02, 2016    9:19 AM                                                                   When sending SID details add                                                                 ………………………………………………………………………………………………………………...\n                                                                                                                                                                                                  .blade A rubber mat protection has worn at pass through hole on blade\n                                                                                                     in also fault code 043/001                                                                   hub, cables ok. Reset WEC and check pitch control ok test run WEC - ok.\nMain cause to the 47:10 fault.                                                                                                                                                                    ……………………………………………………………………………………………………………...\nThis contactor is installed in the turbine many cabinets. it is installed not only for the ventilation control (K03) in the inverter cabinets (=006) but also in the rotor sub-distribution box   Sticking pitch motor brake.\nfor the MSC control (K01) and BSC (K02). But this contactor is very easy to stuck when the power supply turned off the connection between 1-2, 3-4, 5-6 are still connecting. It caused\nthe fan keeping running in the inverter cabinets, and the wrong test result during the main security test then appeared the status 47:10 on pitch system. After replacing the new parts\n(SAP15685) everything is fine again.\nCould it possible to replace to another type of contactor??\n\nHello Robert\nPlease see the report 4054 In this report stands, you can installing another contactor (Siemens) in the rotor sub-distribution (K01). SAP 53569\n\nReport 4054\nThe cause is the Moeller / Eaton contactors in the rotor sub-distribution K01 ( 47:10 ) and in the Journal of relay cabinets K11 ( 47 : 1,2,3 )\nThe Moeller contactors are not suitable for Eibau location on the rotor and must be replaced by Siemens contactors .\n( Contactor does not switch fast enough )\n\nHow to trigger the Main security circuit manually. (the WEC\nwill need to be running with fully charged capacitors.","o":"46:X01 Fault capacitor test Blade X\n12 October 2017 09:08\n046 Fault capacitor test\n101 Blade A\npossible reason: -\nretrofit K15, see tss-report 2903 |\nThe batteries are tested before each start-up and at intervals of 48 hours while the converter is in operation. During the\nstandby battery test, in contrast to the no-load voltage, the recorded battery voltage falls by about 20 V to 35 V according\nto the temperature and condition of the standby batteries. If, during the standby battery test, the measured difference in\nvoltage between idling and load is less than 10 V, the blade control detects a fault in the standby battery test and\ngenerates status 46 with secondary status depending on which blade the fault has appeared in. Until the final\nshut-down, the converter attempts two restarts during which the standby battery test is repeated on each occasion.\nTSS report 2903:\nDescription, Remarks: (English) IE\n[These faults occuring from beginning establish of Sankaya windfarm.\nEnclosed, there is a list about overview of this faults and turbines. We have\nichanged some parts for test to 782465 serial numbered turbine. Before\nImaking any changing, in scada fault seem 46:201, but when we check from\n/O board all three blade was giving this for this turbine. First we have changed\nlcapasitor box(old one serial : 10-6653, new one 10-8084)of blade B, the faults\ncontinued. after changing pitch box(old serial :11-4690 , new one 524) of blade\nIB, fault seem in scada 46:301, but in I/O board 46:201 and 46:301. last we\nlhave changed relay box of Blade B(old serial: 10-3346, new 11-3871). fault\nseem in scada 46:301, but we have seen 46:101, 46:201, 46:301 in /O\nboard. These faults are usually occuring , if the wind is over than 8 m/s and\nurbine was procuding energy. For this turbine I/O control cabinet 2,81, pitch\nsoftware 2,78, I/O | nacelle 2.56, I/O 2 nacelle 2,66, and all these pcbs have\nlbootblock 3,14 version. All these 46:X01 faults cleared by reset. is there any\nest or controls which we can do for finding problem?\nMr. G. Eden from the development departrment informed about the following possibility:\nPlease can you check, if there's a time relay -K15 installed in the relay box, because it could be the reason for the status 46:101/201/301.\nWot ty\natin?\nee\n=UD+AY Jas ee \\\n1 & I!\n= i 2\nspect sis ; Fe |\nIt 1 !\njag CE !\n1 i\n| ea |\nKondensatertast\na —\njor tes!\nited A\nIf yes, it is necessary to install a thermal (temperature) fuse (-F06) instead of the time relay -K15_\nPlease see the detailed informations according to the retrofitting and the material in the attach:\n5.1. Reason for change:\n1. The Finder time relay -K15 in the blade relay box is subjected to high stress due to rotational movement.\nVibrations cause the time relay contact to burn out. To safely switch off the capacitor test, a thermal\n(temperature) fuse (-F06) replaces the time relay on the capacitor test resistor.\n§.2. Extent of change:\n1. Replace the Finder time relay -K15 (SAP 37160) in blade relay box CS82 (SAP 57325) with thermal fuse\n(SAP 1712). Mount the thermal fuse (-F06) on the capacitor test resistor -RO1 - see Fig. 1 and 2.\nThe following items are required to mount the thermal fuse:\nSAP 923 Cable tie PAN-STEEL 127mm 4.6mm 4 units\nSAP 1712 Temperature (thermal) fuse 121°C SF-119-E1-10A 1 unit\nSAP 1818 Glass fibre hose F/GS D= 5mm 017m\nSAP 4301 Glass fibre hose F/GS D= 10mm 0.17m\nSAP 12544 Connector notch- 0.5-1.5mm? 2 units\nWe have changed thermal fuses instead of time relays at 6 turbines After this work, We didn't take any capasitor test error fault at this turbines. yet. it\nseems it works, and we will change the other turbines which give this fault and have time relays. Problems solved.\n§.2. Extent of change:\n1. Replace the Finder time relay -K15 (SAP 37160) in blade relay box CS82 (SAP 57325) with thermal fuse\n(SAP 1712). Mount the thermal fuse (-F06) on the capacitor test resistor -RO1 - see Fig. 1 and 2.\nThe following items are required to mount the thermal fuse:\nSAP 923 Cable tie PAN-STEEL 127mm 4.6mm 4 units\nSAP 1712 Temperature (thermal) fuse 121°C SF-119-E1-10A 1 unit\nSAP 1818 Glass fibre hose F/GS D= 5mm 017m\nSAP 4301 Glass fibre hose F/GS D= 10mm 0.17m\nSAP 12544 Connector notch- 0.5-1.5mm? 2 units\nWe have changed thermal fuses instead of time relays at 6 turbines After this work, We didn't take any capasitor test error fault at this turbines. yet. it\nseems it works, and we will change the other turbines which give this fault and have time relays. Problems solved.\n45:X11 No trickle charge 175V capacitor\nFriday, June 24, 2016 10:22 AM\nFirst check Fuses FO2, FO3 and FOS within the relay box\nMost common cause of this issue is the - Battery charger PCB.\nOther causes for this issue could be - Pitch motor, bitch brake, wiring to these\n- Relay box issues\n- wiring between capacitor box relay box and pitch box.\n. . “Mai Ba aie i Previous investigations found.\n47:10 Fault security system-Main security circuit Wh ding SID details add Carry out checks of blade motors, angle encoders, pitch and relay boxes.\nThursday, June 02,2016 9:19 AM en sending letails a\ni blade A rubber mat protection has worn at pass through hole on blade\nin also fault code 043/001 hub, cables ok. Reset WEC and check pitch control ok test run WEC - ok.\nThis contactor is installed in the turbine many cabinets. it is installed not only for the ventilation control (KO3) in the inverter cabinets (=006) but also in the rotor sub- Sticking pitch motor brake.\nfor the MSC control (KO1) and BSC (KO2). But this contactor is very easy to stuck when the power supply turned off the connection between 1-2, 3-4, 5-6 are still connecting. It caused\nthe fan keeping running in the inverter cabinets, and the wrong test result during the main security test then appeared the status 47:10 on pitch system. After replacing the new parts\n(SAP15685) everything is fine again.\nCould it possible to replace to another type of contactor??\nHello Robert\nPlease see the report 4054 In th\nreport stands, you can installing another contactor (Siemens) in the rotor sub-distribution (KO1). SAP 53569\nReport 4054\nThe cause is the Moeller / Eaton contactors in the rotor sub-distribution K01 ( 47:10 ) and in the Journal of relay cabinets K11 ( 47 : 1,2,3)\nThe Moeller contactors are not suitable for Eibau location on the rotor and must be replaced by Siemens contactors .\n(Contactor does not switch fast enough )\nHow to trigg l noises from motor or gear?\n      • Check motor currents.\n 2. Ensure that fuse cable -FC01 is intact. (Blade relay box)\n 3. Ensure that the charging circuit series resistor in the blade relay box is functioning.\n 4. Ensure capacitors charged while the rotor blade is at 92°\n 5. Ensure that the safety circuit contactor is functioning. ( Rotor sub K01. If this is a Moller Eator breaker, possible require ment to replace with Siemens: SAP 53569)\n 6. Ensure that the compact limit switch is working properly\n 7. Ensure that the coupling and rod actuator are secure\n 8. Ensure that the connections between the capacitor and blade relay box are undamaged.\n 9. Ensure that the capacitor box is free from defects.\n10. Ensure that the mechanical connection of the pitch motor and pitch gear is OK.\n11. Ensure that the wiring and connections between the blade relay box and the pitch motor are undamaged.","o":"","im":[],"k":"47:1x"},{"i":24,"c":"Faults","s":"0-49","t":"47:100","d":"20 January 2019","f":"shared fault info 1.pdf","p":[37,38],"r":"","b":"47:100, “Fault safety system: Emergency stop speed too low”\n\n48:9 Speed sensor Error.\nMonday, September 12, 2016     10:00 AM\n\nCarry out checks of the cabling, These are no routed in the best manner.   The E92 speed sensor issue is most likely to be down to an Aluminium support bracket.\nCheck the SRU for defects and check the torque arm.                        This can be replaced with a steel part under SAP 601630. On the face of it, you can mistake it for being\nCheck the mounting face of the SRU for any anomalies.                      the wrong size to fit (Hole alignment) but the bearing cap has extra holes to accommodate this.\nSupport for SRU\nSRU coupling                                                               Also the SRU for an E92 have been known to go stiff. Please replace if this can not be rotated by hand.\nSRU components                                                             SAP 544010\nTorque Support\nFastners front of spinner.                                                 reset speed sensor fault. Spoke with Marc and decided to investigate\n                                                                           the low currents on the generator phase W1 and V2 to see if an\n                                                                           imbalance on the generator was causing the speed sensor fault. Sapped\n                                                                           U2 and V2 rectifier blocks and no change. Then swapped the shunt\n                                                                           interface PCB which I can only now presume is where the currents are\n                                                                           monitored, as the low current reading moved with the PCB. Suspect that\n                                                                           this PCB is the cause of low current readings on W1 and V2. New PCB\n                                                                           60033 on order. I don't suspect that this is related to the speed\n                                                                           sensor fault as it appears the generator is balanced it just is not\n                                                                           being read correctly but I cannot be sure this doesn't affect how the\n                                                                           rectifier operates etc.\n\n                                                                           Please carry out inspection of all the Generator stator tails, These have been found either loose or badly\n                                                                           crimped leading to heat damage.","o":"","im":[],"k":"47:100"},{"i":25,"c":"Faults","s":"0-49","t":"49: X05 Load control","d":"04 March 2018","f":"shared fault info 1.pdf","p":[39,40,41],"r":"","b Bladeheating: No temperature rise blade x” (V5.53):\nIn the past it has happened time and time again that blade heating systems\nwere switched on but did not heat because the heating element power supply\nwas interrupted somewhere. Until now this fault merely meant the blade\nheating system would not work. As a remedy for this, the power consumption\nof the blade heating system will be monitored indirectly in future.\nWarning message 55:31, “Error Bladeheating: No temperature rise blade A – C”\nis generated if a temperature rise of less than 5 °C is measured for all blades.\nWarning message 55:131 is generated if a temperature rise of less than 5 °C is\nmeasured for blade A. Accordingly warning messages 55:231 and 55:331 are\ngenerated for blade B and C. The blade heating system is deactivated in such\ncases for at least one hour.","o":"","im":[],"k":"55:x31"},{"i":30,"c":"Faults","s":"50-99","t":"60:1 Mains failure : Monitoring electric supply company","d":"23 July 2020","f":"shared fault info 1.pdf","p":[46,47],"r":"","b":"                                                                                                                                 TSI document to download the\nThe 60:1 fault is hard to diagnose till we can download the setup file from the G59. I will then have to look how the G59        file from the G59. A USB printer\nis setup and if it is tripping because of gird faults or because it is not setup correctly.\n                                                                                                                                 cable required to connect to the\nThe G59 once installed will be connected to a tripping circuit inside the turbine to simultaneously disconnect all power\ncabinets from the grid via the main contactor (K01).\n                                                                                                                                 G59\n\nAs show below the tripping circuit is connected to the normally close ":[60,61],"r":"","b":"Please see document TDESC-01-GER-ENG-11-048 for the adjustment of the DC link\n\nStatus / Warning 62:1201-1214:Info from software discription FACTS Power Control CPU1 1.0 V3.17.\n\nThe reason for this is the resistance drift issue on the DC Link Interface board, This\nissue results in measured power value shifts and therefore in power analysis error\nmessages in case of major deviations of the resistance values. The great number of\naffected PCBs has caused a DC-Link Interface supply bottleneck at the warehouses.\nFor this reason, a manual detection function has been programmed into Inverter\nControl. An information flag is sent to Power Control after detection has been carried\nout. To determine the exact number of faulty PCBs and their locations, this\ninformation is forwarded to Service as a warning message through the SCADA\nsystem. 62 (Feeding fault) is output as main information. The additional information\nindicates the number of PCBs for which manual detection has been carried out.\nMain information 62 P symm. out of tolerance\nAddt’l. information 1201 to 1214 The last two digits indicate the number of\nDC-Link Interface boards for which manual\ndetection has been carried out.\n\n62:7XX feeding fault overload chopper\nFriday, September 02, 2016   9:47 AM","o":"62:120X URF/UDC-Link calibration\n07 January 2021 09:34\nPlease see document TDESC-01-GER-ENG-11-048 for the adjustment of the DC link\nStatus / Warning 62:1201-1214:Info from software discription FACTS Power Control CPU1 1.0 V3.17.\nThe reason for this is the resistance drift issue on the DC Link Interface board, This\nissue results in measured power value shifts and therefore in power analysis error\nmessages in case of major deviations of the resistance values. The great number of\naffected PCBs has caused a DC-Link Interface supply bottleneck at the warehouses.\nFor this reason, a manual detection function has been programmed into Inverter\nControl. An information flag is sent to Power Control after detection has been carried\nout. To determine the exact number of faulty PCBs and their locations, this\ninformation is forwarded to Service as a warning message through the SCADA\nsystem. 62 (Feeding fault) is output as main information. The additional information\nindicates the number of PCBs for which manual detection has been carried out.\nMain information 62 P symm. out of tolerance\nAddt’l. information 1201 to 1214 The last two digits indicate the number of\nDC-Link Interface boards for which manual\ndetection has been carried out.\n62:7XX feeding fault overload chopper\nFriday, September 02,2016 9:47 AM\n1. As soon as the LV voltage increases above the maximum allowed value of 110% the FACTS triggers OVAT (Over Volt Ride Through)\n2. The FACTS then activates the UPS cabinet but due to the fault lasting more than 60 seconds the UPS stops operating.\n3. Due to the UPS stop operating. The excess power is sent to the choppers which in turn overheat due to the extended use.\nTurbine in operation 1 014504\nTurbine starting 1 00:01:20\nTuchine. 1 000217\nFeeding fault : Overload chopper inverter 1 6 0000.5\n6 000300\n3. 6 00:00:30\n6 00:00:30\n162..703__ Feeding fault : Overload chopper inverter 3) $\n192: 201 _ Fault UPS : Timeout three-phase operation > 3 6\nHaving a look at the voltages L2 does creep above 250V once the power is more that 480Kw.\nStatus 0:0 Turbine in operation\nInformation 9110 Informations / Wamings\nOperating values Total ‘Nacelle Grid data\nWind s 107 m/s 5 BR Energy prod. 113,567 kWh Wind vane 13 left a\n0 0 ope —-. —\n—- 9522500 1: Ww Phase angle a\n2940 Yimin (Op. hours: Nacelle pos.\no 2» «0 Nacelle rotations 0.73 Right Frequency m00 te\nPower Lame, 497 ew B10): | ¢ Comatatentag ——— - a\n70 430 Date 73/16 Temperature 150 *¢ Seem Gees\na u mS 85\nReact. power La 43 ber Totalhours 14300329 :\n00 b rm) us\nB “7 846\nFrom the attached commissioning report there has been a history of loose cables so itis possible that one or more have been missed and this is causing the voltages to increase at a higher Kw level.\n‘We will have to arrange a SAP for two days to recheck the connections of the power cabinets and transformer. Having a look at the surrounding area and the fact that the voltages increase at the SO0Kw level! am confident that this issue is not caused by a high grid voltage.","im":["shared_fault_info_1_060","shared_fault_info_1_061"],"k":"62:120X"},{"i":38,"c":"Faults","s":"50-99","t":"62:91X Feeding external shut down","d":"16 October 2020","f":"shared fault info 1.pdf","p":[62],"r":"","b":"Facts 2.0 turbine? Power cabinet disabled? Then check the bridging of FO Cables.\nSee Deactivating Power cabinets","o":"","im":[],"k":"62:91X"},{"i":39,"c":"Faults","s":"50-99","t":"64:XX Inverter overcurrent","d":"06 August 2021","f":"shared fault info 1.pdf","p":[63],"r":"","b":"Template instructions to send to team.\n\nTemplate -\n64.xx Ove...","o":"","im":[],"k":"64:XX"},{"i":40,"c":"Faults","s":"50-99","t":"66:XX Fault rectifier","d":"18 September 2020","f":"shared fault info 1.pdf","p":[64,65],"r":"","b":"                                                                       Template instructions to send to team.\nIsometers react with leakage current >30mA\n2 min after WEC start, Isometers check (if grid coupling successful)\n\n                                                                       Template -\n                                                                       66.4X Rec...\n\nPossible cause\nRectifier\nGenerator defect or wet\nDefect board\n\nPossible repair method\nGenerator repair\nGenerator heating/drying\nRectifier repair\nTemperature trigger\n\nPossible impact\nGenerator damage / Wet","o":"66:XX Fault rectifier\n18 September 2020 13:27\nTemplate instructions to send to team.\nIsometers react with leakage current >30mA\n2 min after WEC start, Isometers check (if grid coupling successful)\nba\nSystem1 Template -\n66.4X Rec...\n—\n+4 -\n3 _Uisometer-4 5 ULtso
