sh M20x25 Korrex\n34239 4 PC clamping bolt capacitor 3008079-0\n34240 4 PC clamping bolt pitch box 3008087-0\n56852 2 PC base frame 3008147-0\n56853 2 PC holder capacitor box | 3008148-0\n56854 2 PC holder capacitor box II 3008149-0\n54795 3 PC spinner girder 3007133-0","im":["shared_fault_info_1_245","shared_fault_info_1_246"],"k":""},{"i":175,"c":"Faults","s":"E33","t":"Yaw system","d":"30 April 2020","f":"shared fault info 1.pdf","p":[247],"r":"","b":"","o":"Yaw system\n30 April 2020 08:30\ncontactor plate SAP 88763\ncontactor\nSAP “#024.\n67649\n097\non\nasa\nco\nIb b Js hh is q\n“3 Y-4 AOKI) 4342 1-F “mat\n335\nawl]\nWOe\nser\n2006\nHot\nany\nHetocichutzachatte Azinteator 1 Asinatmator 2 190 Mater 1 re Motor 2 Sener oar\n‘Senden Ververyam tamed ver sparring ree ete ‘mw? rio mer | Friie tor 2 Sonttone\nserrate sot ‘eely yaw terse —_— ileal oer vm ae","im":["shared_fault_info_1_247"],"k":""},{"i":176,"c":"Faults","s":"E33","t":"46/1(2)(3)","d":"20 January 2017","f":"shared fault info 1.pdf","p":[248],"r":"","b":"Carried out voltage and continuity checks which proved =11- F03B and C\ndefective.\nReplaced =11 - F03A/B/C.\nCarried out capacitor, charging and blade functional test OK.\n\nAlso see (capacitor testing)","o":"","im":[],"k":""},{"i":177,"c":"Faults","s":"E66","t":"E66 Blade flange bearing connections","d":"07 January 2021","f":"shared fault info 1.pdf","p":[249,250],"r":"","b":"Most probable cause:\nPerforming various calculations has shown that a lack of preload force can lead to fatigue failure of\nthe joint. Insufficient preload force of the bolts leads to higher stress oscillations. Over a large\nnumber of load cycles, this results in a crack and finally in fatigue failure. The failure of individual\nbolts causes increased stress on adjacent bolts. A reduced pretensioning force is therefore seen as\nthe trigger for fatigue fracture.\n\nThere can be many reasons for the insufficient preload force, e.g:\n\n-bolts not correctly tightened during assembly (incorrectly calibrated tool, error of the fitter)\n\n-friction coefficients during assembly impermissibly high\n\n-Long-term set effects, e.g. due to (too) thick paint layers in the clamp connection\n\n-After replacement of defective screws no 300-hour maintenance performed\n\n-hole pattern shift between the components (screw shaft lies against the casting; superimposed\nbending stress)\n\n-Insufficient strength of the screws, overloading of the screw due to failure of the Adjacent screw\n\nPrecautionary measures:\nThe 24-hour remote monitoring (ENERCON SCADA), which monitors all electrical and\nmechanical assemblies, together with scheduled maintenance, already represents\nthe most effective part of the preventive measures. In addition to this, the following\nmeasures were developed and implemented:\n\n-immediate action (loosening + tightening) of all screws on the blade bearing in the\nsystems that have already had screws replaced. (TD-esc-01-xx-xx-20-042)\n\n-monitoring of the 50:13 messages and checking for defective screws if necessary.\n\n-Rerouting the central lubrication hoses so that screws can fall out of the bore hole\nfreely after breakage (for systems with central lubrication unit) (TD-esc-xx-\nxx-20-088)\n\n-screws are only replaced if necessary (breakage), plus a total of ten adjacent\nscrews to the left and right of the broken screws (limit value list)\n\n-Defective screws are only replaced by threaded bolts, since threaded bolts have a\nconstant stiffness on the clamping length due to the continuous thread and a higher\nelasticity than shank screws. (TD-esc-xx-xx-15-028)\n\n-The final concept will rely heavily on better detection of screw breakage.\n- Recalibration of the spinner sensor (all systems)\n- Introduction of a torque control instead of the previous visual inspection and sound\ntest at too future maintenance.\n- Installation of an additional hub sensor (all systems)\n\nOperational safety of the E-66 systems:\n\n-The above precautionary measures ensure that a sufficient pretensioning force is\n\n-The above precautionary measures ensure that a sufficient pretensioning force is\navailable for continued operation.\n-Defective screws will be reliably detected and replaced in the future.\n\nAre other systems affected?\n\nOther types of systems are not noticeable with an insufficient pretensioning force.\nThe flange connections differ in design (e.g. E-70 larger bolt diameter) from the\nflange connection concerned.","o":"","im":[],"k":""},{"i":178,"c":"Faults","s":"EP3","t":"80:2","d":"03 March 2022","f":"shared fault info 1.pdf","p":[251],"r":"","b":"Status message S80:2 for control system\ntype EP3-CS-02\nContacting problems may occur between the\nTower Monitoring –AF02 PCB and the connected\nplug –X2. The reason for this is the test procedure\nin production. While the RUV is being tested in the\ntest field, the –X2 plug must be disconnected from\nthe Tower Monitoring –AF02 PCB and fitted with\ntwo bridges (1 and 2, 4 and 5).\nThe plug contacts (Harting control contacts) of the\nbridge were too large, so that the spring contacts\ninside the Phoenix plugs were damaged. This was\nfollowed by unreliable contacting at the\nTower Monitoring PCB and for generating the\nstatus message S80:2 during operation of the\nWEC.\nThe problem affects WECs commissioned from\nDecember 2021 onwards. For these WECs, the          Fig.: Plug –X2 on the Tower Monitoring\nplug –X2 on the Tower Monitoring –AF02 PCB          PCB\nshould be replaced in the course of troubleshooting\nwith the status message S80:2.","o":"80:2\n03 March 2022 10:48\nStatus message S80:2 for control system\ntype EP3-CS-02\nContacting problems may occur between the\nTower Monitoring -AF02 PCB and the connected\nplug —X2. The reason for this is the test procedure\nin production. While the RUV is being tested in the\ntest field, the —X2 plug must be disconnected from\nthe Tower Monitoring -AF02 PCB and fitted with Polradiberwactung\ntwo bridges (1 and 2, 4 and 5). iittala\nThe plug contacts (Harting control contacts) of the —-aFe2 toner monitoring\nbridge were too large, so that the spring contacts > 1 ln\ninside the Phoenix plugs were damaged. This was Foot fT\nfollowed by unreliable contacting at the\nTower Monitoring PCB and for generating the\nstatus message S80:2 during operation of the\nWEC.\nThe problem affects WECs commissioned from hceeienaiiens |\nDecember 2021 onwards. For these WECs, the\nplug —X2 on the Tower Monitoring -AF02 PCB\nshould be replaced in the course of troubleshooting\nwith the status message S80:2.\nFig.: Plug —X2 on the Tower Monitoring","im":["shared_fault_info_1_251"],"k":"80:2"},{"i":179,"c":"Faults","s":"EP3","t":"90:362","d":"05 March 2021","f":"shared fault info 1.pdf","p":[252],"r":"","b":"Problem:\nDue to an error of the software of FACTS Power Control V2.0 an incorrect warning message is generated when a mains filter fuse in the power cabinet trips.\n\nThe substatus for the mains filter warning is permanently increased by a factor of 10 so that when the mains filter fuse of converter 3 trips, the message “90:653\nmains filter converter 13” instead of “90:353 mains filter converter 3” is generated.\n\nSolution:\nThe FACTS Power Control CPU1 2.0 < V1.23 lead to this problem, this problem is solved with software FACTS Power Control CPU1 2.0 V1.23","o":"","im":[],"k":"90:362"},{"i":180,"c":"Faults","s":"EP3","t":"Anemometer support - weld seams","d":"11 May 2021","f":"shared fault info 1.pdf","p":[253],"r":"","b":"   FW               ESC_HSE\nHSE-Notic...       Notice_P...","o":"","im":[],"k":""},{"i":181,"c":"Faults","s":"EP3","t":"Arc fault hazard on EP3-EM-5D busbar system","d":"18 January 2022","f":"shared fault info 1.pdf","p":[254],"r":"","b":"GCCS_HSE\nwarning_...\n\n   FW\nHSE-Warn...","o":"","im":[],"k":""},{"i":182,"c":"Faults","s":"EP3","t":"braking of one blade","d":"25 October 2021","f":"shared fault info 1.pdf","p":[255],"r":"","b":"WIND_GRC\n_RM_Te...","o":"","im":[],"k":""},{"i":183,"c":"Faults","s":"EP3","t":"Compact limit switches on the E-115 EP3 E3 - Incorrect setting","d":"03 June 2021","f":"shared fault info 1.pdf","p":[256],"r":"","b":"The compact limit switches are set in the production. Incorrect settings were made\nfor the E-115 EP3 E3 turbine type. During commissioning of the turbine type E-115\nEP3 E3, the compact limit switches must be set as follows according to the\ncommissioning instructions:\n   • Limit switch 95°\n   • Limit switch 96°\n   • Parking position 97°","o":"","im":[],"k":""},{"i":184,"c":"Faults","s":"EP3","t":"Defect on floor hatch due to torn-out rivets","d":"11 October 2021","f":"shared fault info 1.pdf","p":[257],"r":"","b":" Safety\nWarning ...","o":"","im":[],"k":""},{"i":185,"c":"Faults","s":"EP3","t":"EP3 Changes to power curves","d":"28 January 2022","f":"shared fault info 1.pdf","p":[258],"r":"","b":"   Neue\nLeistungs...","o":"","im":[],"k":""},{"i":186,"c":"Faults","s":"EP3","t":"Hailo Globallift R4+ shutter door didn't open","d":"08 October 2021","f":"shared fault info 1.pdf","p":[259],"r":"","b":" ENERCON\nHSE Notic...","o":"","im":[],"k":""},{"i":187,"c":"Faults","s":"EP3","t":"pitch motors - Loose screws on the E-126 EP3 and E-138 EP3 (E1)","d":"02 March 2021","f":"shared fault info 1.pdf","p":[260],"r":"","b":"In the case of SAP 200615 pitch motors from the manufacturer Ruckh, total motor failure may occur.\nOn the affected motors, the screws of the resistors in the motor are not glued.\nThe screws can loosen directly during commissioning and destroy the motor.\nIn the worst case, this can lead to a total failure of the blade pitch.\nThe affected motors must be checked before commissioning and the screws must be re-glued. Approx. 4 hours per\nplant must be planned for this.\nIf a pitch motor is lost, the delay can be several days.\n\nPhoto 1 Blade pitch motor Inspection door Entrance Resistance\n\nThe following plants must be retrofit immediately:\n\nProject Number     Manufacturer Serialnumber Short description\nS-04187-003        1380344                       ES Frankfurt - Oder\nS-05657-007        1250164                       ES Konin\nS-05657-008        1250165                       ES Konin\nS-05657-009        1250166                       ES Konin\nS-05657-010        1250167                       ES Konin\nS-10818-003        1250318                       ES AT-Gols\nS-11318-005        1380325                       ES Gerbrunn\nS-11644-001        1250324                       ES Goes\nS-11644-002        1250325                       ES Goes\nS-11670-003        1250217                       ES Stößen\nS-11717-006        1250253                       ES Itzehoe\nS-11717-008        1250255                       ES Itzehoe\nS-11717-011        1250258                       ES Itzehoe\nS-11730-001        1380376                       ES Uddevalla\nS-11730-003        1380378                       ES Uddevalla\nS-11835-001        1250294                       ES Evia\nS-11835-002        1250295                       ES Evia\nS-11873-001        1250354                       ES Schleswig\nS-11886-001        1380347                       ES Aalen\nS-11907-001        1250313                       ES Izmir South\n\nNote: Plants marked in red are already being processed.\n\nA Service product ( 215684 Retrofit Ruckh\nblade pitch motors EP3 ) has already been created for these plants. If you have any questions about gluing the screws, pleas\ne submit an ESC ticket to the Electrical Systems Service Department / Electrical Machines Service Group.\n\nFurther affected plants will be retrofitted during the next maintenance.\nThe instructions for retrofitting are currently being processed. The list of all affected systems can be found in the appendix:\nPlants equipped with motors SAP 200615","o":"","im":[],"k":""},{"i":188,"c":"Faults","s":"EP3","t":"Preparation for EP3 Platform","d":"05 March 2021","f":"shared fault info 1.pdf","p":[261],"r":"","b":"Copy of EP3\nIntegratio...","o":"","im":[],"k":""},{"i":189,"c":"Faults","s":"EP3","t":"status 25:XXX Gear rim damage","d":"17 March 2021","f":"shared fault info 1.pdf","p":[262,263],"r":"","b":"If the status message 25:xxx: Fault yaw inverter : brake x: Gradient to high (hot) a \"remote reset\" is prohibited:\n\n         - E-126 EP3 status message 25:151 - 156 & 25:251 - 256.\n         - E-138 EP3 status message 25:401 - 406 & 25:501 - 506\n\nIt is mandatory to check the yaw system on site in the nacelle to ensure that there is no damage to the brake or teeth of the yaw motors / gearboxes.\n\nESA Guides S25:xxx and technical Instruction TD-esc-01-ger-eng-12-033 Checking the yaw motor brakes should be used for this purpose.\n\nCurrently a new software Yaw Inverter V20.07 is being distributed which locks the message 25:xxx for \"remote reset\".\n\nAt the moment we suspect that we have a problem with a combination of motor and brake:\n\nSAP number Azimuth motor: 141741 (Azimuth motor Ruckh® E115 m.WE MK115003-0).\nSAP number brake: 202354 (brake 45Nm KEB® 05.38.11H-0757)\n\nWith this brake / motor combination the brake is not adjustable and the Socket head screws (fastening) have come loose on some units. It is therefore\nessential to check the brake setting.\n\nIf the Socket head screws (fastening) on the brake have loosened on an affected system or if the brake air gap of the brake is no longer correct, the office\nservice must be notified immediately and the office service must create an ESC ticket -> Service Electrics -> Electrical Machines group.\n\nSpecial information for the brake SAP 202354:\n\nThe air gap of the brake should be between 0.15mm and 0.25mm.\nThe fastening Allen screws must be tightened with a torque of 10 Nm.\n\nIf the brakes are not checked, irreparable damage can be caused to the azimuth gear rim:\n\nStatus: 17.03.2021","o":"status 25:XXX Gear rim damage\n17 March 2021 09:54\nIf the status message 25:xxx: Fault yaw inverter : brake x: Gradient to high (hot) a \"remote reset\" is prohibited:\n- E-126 EP3 status message 25:151 - 156 & 25:251 - 256.\n- E-138 EP3 status message 25:401 - 406 & 25:501 - 506\nIt is mandatory to check the yaw system on site in the nacelle to ensure that there is no damage to the brake or teeth of the yaw motors / gearboxes.\nESA Guides S25:xxx and technical Instruction TD-esc-01-ger-eng-12-033 Checking the yaw motor brakes should be used for this purpose.\nCurrently a new software Yaw Inverter V20.07 is being distributed which locks the message 25:xxx for \"remote reset\".\nAt the moment we suspect that we have a problem with a combination of motor and brake:\nSAP number Azimuth motor: 141741 (Azimuth motor Ruckh® E115 m.WE MK115003-0).\nSAP number brake: 202354 (brake 45Nm KEB® 05.38.11H-0757)\nWith this brake / motor combination the brake is not adjustable and the Socket head screws (fastening) have come loose on some units. It is therefore\nessential to check the brake setting.\nIf the Socket head screws (fastening) on the brake have loosened on an affected system or if the brake air gap of the brake is no longer correct, the office\nservice must be notified immediately and the office service must create an ESC ticket -> Service Electrics -> Electrical Machines group.\nSpecial information for the brake SAP 202354:\nFig. 1: Example: sectional drawing of INTORQ BFK458 (Lenze)\n1 Socket head screws 6 Hub\n(fastening) 7 Shaft\n2 Magnet piece 8 Pressure plate\n3. Pressure spring 9 Flange\n4 Air gap 10 Sleeved bolt\n5 Disc with brake pad\nThe air gap of the brake should be between 0.15mm and 0.25mm.\nThe fastening Allen screws must be tightened with a torque of 10 Nm.\nIf the brakes are not checked, irreparable damage can be caused to the azimuth gear rim:\nStatus: 17.03.2021","im":["shared_fault_info_1_262","shared_fault_info_1_263"],"k":""},{"i":190,"c":"Faults","s":"EP3","t":"E-138 EP3 Safety ladder C rail","d":"14 July 2021","f":"shared fault info 1.pdf","p":[264],"r":"","b":"D02421815\n_0.0 Prod...","o":"","im":[],"k":""},{"i":191,"c":"Faults","s":"EP3","t":"Replacement shaft seal ring rear rotor bearing EP3","d":"29 September 2021","f":"shared fault info 1.pdf","p":[265],"r":"","b":"Related to WEC types: E-115 EP3 E3, E-138 EP3 E2\n\nAt a strong grease leakage at the rear rotor bearing (grease is leaving the grease\npan and contaminates the generator rotor), the instruction TD-esc-01-de-\nxx-19-053 is usable for the exchange of the shaft seal ring, although the named\nWEC types are not listed there.\n\nThe material SAP 709496 (pressure ring) and 712375 (levelling plate)\nis not requested at the WEC types E-115 EP3 E3, E-138 EP3 E2!\n\nFor a ideal function of the new shaft seal ring the work steps of chapter 3.4 and\n3.5.1 need to get done very careful and according to the instruction.\n\nDocument TD-esc-01-de-xx-19-053 will get part of the repair instruction for\nbearings soon.","o":"","im":[],"k":""},{"i":192,"c":"Faults","s":"EP3","t":"Uncontrolled pitching","d":"05 October 2021","f":"shared fault info 1.pdf","p":[266],"r":"","b":" Safety\nWarning ...","o":"","im":[],"k":""},{"i":193,"c":"Faults","s":"FACTS 2.0","t":"Deactivating Power cabinets","d":"05 July 2019","f":"shared fault info 1.pdf","p":[267],"r":"","b":"Ticket - 70000844\n\n- Remove semiconductor fuses\n- Depending on the option, switch off the circuit breaker in the circuit breaker or remove\nfuses in the LV distribution board\n- Disconnect the Ethernet cable at the Inverter Control\n- Power supply for the inverter control remains\n\nIn the scenario where the Inverter Control board has suffered complete damage or the\nexternal shutdown fiber optic connections have been damaged, establish a fiber optic\nbridge between the previous and following LS for the External Shutdown signal. This\ncircumstance is considered with low probability.\nA revision of the instruction \"deactivation of power cabinets\" is not provided, because, as\nmentioned, a software-level adaptation should take place.","o":"","im":[],"k":""},{"i":194,"c":"Faults","s":"FACTS 2.0","t":"Dial into Inverter control","d":"14 May 2020","f":"shared fault info 1.pdf","p":[268],"r":"","b":"Remote Display to Power Control > Ethernet > Ethernet RM-Display > Choose Inverter no. with Up\nand Down.","o":"Dial into Inverter control\n14 May 2020 ~—08:37\nRemote Display to Power Control > Ethernet > Ethernet RM-Display > Choose Inverter no. with Up\nand Down.\n( 3 82677 Sea)\nEthernet RM-Disp1]aRM\nIP: 10. 10. 10. |5\nSTART\n< > v a Enter\n< > v Aa\n< > v a\nMenu Td. [X:Y] | s#\nValue Set\n™M) Suppress status query\nXY","im":["shared_fault_info_1_268"],"k":""},{"i":195,"c":"Faults","s":"FACTS 2.0","t":"Self Supply","d":"12 October 2017","f":"shared fault info 1.pdf","p":[269],"r":"","b":"Self-supply on FACTS 2.0\n1.    It is necessary that the power control and decoupling protection shows status 0:0 an display.\n2.    Set the maximum power to 15 kW (P2100)\n3.    Set the parameter P1306 to the maximum installed inverter\n4.    Switch the self supply mode on the IO Board to “on”\n5.    Check the power control and the decoupling protection, the following display must be shown\non both PCBs\n\n6.   Start the WEC\n7.   You have to check if the releases of all step up choppers are given. (On the power control\n\nNote Mark Greeves is an expert.\n\n FW Self\nSupply M...\n\n FW Self\nSupply M...","o":"Self Supply\n12 October 2017 15:26\nSelf-supply on FACTS 2.0\nIt is necessary that the power control and decoupling protection shows status 0:0 an display.\nSet the maximum power to 15 kW (P2100)\nSet the parameter P1306 to the maximum installed inverter\nSwitch the self supply mode on the IO Board to “on\n. Check the power control and the decoupling protection, the following display must be shown\non both PCBs\nWPWNR\n6. Start the WEC\n7. You have to check if the releases of all step up choppers are given. (On the power control\nNote Mark Greeves is an expert.\nFW Self\nSupply M...\nFW Self\nSupply M..  are also best carried out as a 3 man team. As a 3 man team it is possible to complete a repair in 3 days\n\n1 day is required to remove all the guards\n1 day to replace pole shoe\n1 day to rebuild.\n\nPole shoe temperature wiring:\nPT100 - Red/White\nPCT 140 - blue/white\nPTC 150 - black/black\nPTC 160 - Blue / Red\n\nStator arm removal at 7 o'clock position\n17 January 2019\n\nhttps://srv-crm01.enercon.de/sap/bc/bsp/sap/crm_ui_start/default.htm?sap-client=009&sap-language=EN&sap-domainRelax=min&crm-object-type=CRM_SRQM_INCIDENT&crm-object-action=B&crm-object-bolobjectid=FF060201010280003431303300000000010400000000100000003C0300 000000000000000000000000000000000000004B0045005900BC00000010005056A473C91EE985FFD3682C7E7EB2BD04&crm -object-bolobjectname=BTOrder\n\n                                                                                                                                      TD-esc-02-ger-eng-10-043 Rev000 Maximum\n                                                                                                                                      admissible wind speed with dismantled stator\n                                                                                                      TD-esc-02-     BMA-D036\n                                                                                                                                      support\n                                                                                                      ger-eng-1...   6408-1 Ra...\n\n    Note: Stock of 1 exists in Inverness. From AJ Engineering & Construction Services Ltd\n\nFilter fuses popped\nThursday, June 02, 2016   8:05 AM\n\nDescription of fault.\npassed it's G59 and had been running at 300Kw, after the test I increased the output and at around 1Mw all 3 filter fuses in cabinet 1\npopped. This was accompanied by a bang and a burning smell. There was an LV Earth fault error on screen. I think this may be the\ninsulation of the grid filter but cant be sure without testing. Do any of you know how to test the insulation of the filter and what results to\nexpect or is it easier just to swap it out?\nReply\nit sounds like the grid filter circuit has not been setup correctly or been subjected to a short circuit. Below is an overview of the filter circuit.\n\nThe circuit is located behind the chokes so will be hard to access but there is a 8 turn ‘Torrid’ with a resistor in paralleland 200 micro farad capacitor connected to neutral so there shouldn’t be too many components to check. You will need a SAP tho.\nAs for testing the setup an simple continuity test will prove the circuit but bare in mind the inductance in the ‘Torrid’\n\nI/O board. No tower type.\nThursday, July 21, 2016    11:04 AM\n\nI/O board does not have tower type within list.\n\nFirst check weather they were input correctly, if you do not then the tower type can be missing from\nthe list.\n   1) Select blade type\n   2) Select generator type\n   3) Then select tower type\n\nIf this fails to work check that the software they are loading is correct.","o":"Pole shoe replacements\n17 April 2020 14:28\nE82 E4 turbines require extra time to replace a pole shoe.\nThey are also best carried out as a 3 man team. As a 3 man team it is possible to complete a repair in 3 days\n1 day is required to remove all the guards\n1 day to replace pole shoe\n1 day to rebuild.\nPole shoe temperature wiring:\nPT100 - Red/White\nPCT 140 - blue/white\nPTC 150 - black/black\nPTC 160 - Blue / Red\nFilter fuses popped\nThursday, June 02,2016 8:05 AM\nDescription of fault.\npassed it's G59 and had been running at 300Kw, after the test | increased the output and at around 1Mw all 3 filter fuses in cabinet 1\npopped. This was accompanied by a bang and a burning smell. There was an LV Earth fault error on screen. | think this may be the\ninsulation of the grid filter but cant be sure without testing. Do any of you know how to test the insulation of the filter and what resul :"","b":"601630 - retainer slip ring unit   9208118-3","o":"","im":[],"k":""},{"i":221,"c":"Parts","s":"Lubrication","t":"Fan motor re-lubrication","d":"07 January 2021","f":"Shared Parts info 1.pdf","p":[14,15],"r":"","b":"According to point 50 of the maintenance manual \"TD-esc-08-de-de-15-055 Rev010\" the tower fan must be greased with the grease that is on the type plate:\n\nThe fan motor can be relubricated with the grease SAP 576855 (grease lubrication- PETAMO GHY 133 N 400g). 15 strokes per grease nipple\nmust be done with the grease gun to reach the 20 cm ^ 3.\nThe grease SAP 576855 is compatible with the grease on the nameplate (both the chemical structure of the oil type and the chemical\nstructure of the consistency generator).\nThe second type of grease was added to the next revision of the maintenance instructions TD-esc-08-de-de-15-055 Rev010 as a change\nrequest.\n\nIf the rubber armored hose (SAP number 23170) of the grease gun is not compatible with the grease nipple of the fan motor, the grease\nnipple of the fan motor can be replaced with the grease nipple SAP number 154270.","o":"Fan motor re-lubrication\n07 January 2021 10:04\nAccording to point 50 of the maintenance manual \"TD-esc-08-de-de-15-055 Rev010\" the tower fan must be greased with the grease that is on the type plate:\n50. Grease fan for tower cooling system\nQuantity Designation SAP no.\nWork equipment 1 lever press 18107\n1 armoured rubber hose f.grease press300mm 23170\nMaterial 1 grease ESSO® UNIREX N3 cartouche 38689\n10 c-sunk h.tapp.screw DIN7982 C4,8x25 A2 5267\n3. Check whether there is a notice sign specifying a grease type on\nthe fan motor.\nResult Work step\nNotice sign present Apply the grease gun with the\ngrease type from the notice sign\nto the lubricating nipple and\nsqueeze one stroke of grease\ninto the bearing. After one stroke,\nturn the fan’s impeller around five\nrevolutions manually.\nCarry out regreasing 10 times for\neach lubricating nipple.\nNotice sign not present It is not necessary to regrease\nthe lubricating nipples.\nThere is a nameplate on the fan motor, there is a grease name: \"KlUberquiet bgh 72-102\"\nThe fan motor can be relubricated with the grease SAP 576855 (grease lubrication- PETAMO GHY 133 N 400g). 15 strokes per grease nipple\nmust be done with the grease gun to reach the 20 cm % 3.\nThe grease SAP 576855 is compatible with the grease on the nameplate (both the chemical structure of the oil type and the chemical\nstructure of the consistency generator).\nThe second type of grease was added to the next revision of the maintenance instructions TD-esc-08-de-de-15-055 Rev0O10 as a change\nrequest.\nIf the rubber armored hose (SAP number 23170) of the grease gun is not compatible with the grease nipple of the fan motor, the grease\nnipple of the fan motor can be replaced with the grease nipple SAP number 154270.","im":["Shared_Parts_info_1_014","Shared_Parts_info_1_015"],"k":""},{"i":222,"c":"Parts","s":"Electrical","t":"Bus bars where to get replacements.","d":"26 October 2017","f":"Shared Parts info 1.pdf","p":[16],"r":"","b":"Where to enquire about getting new Bus bars made up.\n\nhttp://www.copperbusbar.co.uk/\nhttp://www.hvwooding.co.uk/copper-busbars/\nhttp://www.lmlproducts.co.uk/","o":"","im":[],"k":""},{"i":223,"c":"Parts","s":"Electrical","t":"Cable search","d":"07 January 2021","f":"Shared Parts info 1.pdf","p":[17],"r":"","b":"Using key words it is possible to find cable sets. From here these can be narrowed down to specific\ncables within the set.\nSee: CS03 Display Material BOM","o":"Cable search\n07 January 2021 10:13\nUsing key words it is possible to find cable sets. From here these can be narrowed down to specific\ncables within the set.\nSee: CS03 Display Material BOM\nMaterial anzeigen (Einstieg)\n© Materialnummer (1) 161\nSichtenauswahl OrgEbenen Daten ii )\ne gefunden\nMateriainummer/-kurztext i A: Material zur alten Materialnummer\nSES Tv\nMaterial =*Cable* *nacelle* (oa | ||| 64)| tened down.\n\nAnswer\nI have just spoken with Ian bird and the part required is sap 82477 which is taller and has a flat cut\naway which allows a closer fit to the weld seam.","o":"300Hr Basement bolt\n27 February 2018 07:13\nQuestion\n| attempted to use tool AS TECH M36 HSW 16243003 SAP 109920 but the tool was lowering on top\nof the weld, which prevented it from being fully tightened down. In addition, when attempting to\nuse the tool in the basement inside, the tool fouled the tower which also prevented it being fully\ntightened down.\nAnswer\n| have just spoken with lan bird and the part required is sap 82477 which is taller and has a flat cut\naway which allows a closer fit to the weld seam.","im":["Shared_Parts_info_1_084"],"k":""},{"i":279,"c":"Parts","s":"Tooling","t":"Electrical gloves","d":"14 March 2019","f":"Shared Parts info 1.pdf","p":[85],"r":"","b":"","o":"Electrical gloves\n14 March 2019 10:53\nBSD safety gloves against electric arc’ blocked\nIn the future, only protection gloves for electricians 1000 V (see Fig. 2) will be required for electrical work.\nThe insulating gloves (1000 V, Class 0) wom by electricians during electrical work are now also equipped with arc fault protection in addition to\ntheir insulating properties.\nThis means they protect against both electric shock and the thermal effects of an arc fault. The use of the glove electric arc type A (see Fig. 1) is\ntherefore no longer required.\nThis also brings with it the advantage that uncertainties and confusion can no longer arise.\nNote:\nOld stock of the glove electric arc type A may be used up.\nFor more information, refer to JSJ— 04 Occupational Health and Safety — News - Information - Instructions - Explanations — List of Personal\nProtection Equipment — Protective Gloves.\n= = \"\n= 4\nis a\nFig. 1: Glove electric arc type A (e.g. SAP 141118) Fig. 2: Protection gloves for electricians 1000 V (e.g. SAP 39416)\nGo to Top","im":["Shared_Parts_info_1_085"],"k":""},{"i":280,"c":"Pa
