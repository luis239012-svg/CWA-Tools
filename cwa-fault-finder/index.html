 important that you unlock the rotor.","o":"Blade angle exceeds limits\n07 July 2020 15:53\nyou need to do these steps to solve your problem for the moment.\n1. Please check the motor, maybe it damaged at the fault. (measurement of the isolation)\n2. You need to change the pitch box from the affected blade to another blade which are not\naffected. It is really important that you pull the plug of the compact limit switch off when you drive\nthe blade to 92°. The steps are very well described in the document and this will help you with the\ntask.\neng St ~=TD-esc-08-de-en-17-051 Rev001 Manual CS101a, CS82a\npitch control operation\nAfter you drive the blade in the correct position, it is important that you unlock the rotor.","im":["shared_fault_info_1_168"],"k":""},{"i":115,"c":"Faults","s":"Descriptive","t":"Cabinet fan UPS does not operate","d":"22 May 2019","f":"shared fault info 1.pdf","p":[169],"r":"","b":"                             Ticket: 70030982\n\nSolution Description 15.05.2019 07:14:56 Andre Wagner\nHello,\nIt's a already known software bug in the current ups version.\nYou can go a menu forward to the \"pwm menu\" and activate it.\nSee attached picture.\nIt will activate the fan.\nA technical information will be released soon and hopefully this bug is removed in the next UPS Software.\nBest regard\nAndre\n____________________\nProblem Description 14.05.2019 16:34:00 Marc Dewing\nFor two of our UK sites, Harburnhead and Corriegarth. We have multiple WEC's where the UPS fan does automatically come on, an d can not be manually activated\nwithin the PCB settings.\nThese are the only two sites we have seen this issue and these are the only two sites in the UK with a special software packa ge. (CS82_2019-03-11)\nCan you identify if our problem lies within this software?\n\nFrom <https://srv-crm01.enercon.de/sap(ZT1NREF3TmpRMU5ERmZYMTlmTWpKZk1qRmZBRkJXcE1ubkh1bWZqLU5aSmpuS2hnPT0=)/bc/bsp/sap/crm_ui_frame/BSPWDAppli cation.do?sap-client=009&sap-language=EN&sap-domainrelax=min>","o":"Cabinet fan UPS does not operate\n22May2019 14:34\nTicket: 70030982\nSolution Description 15.05.2019 07:14:56 Andre Wagner\nHello,\nIt's a already known software bug in the current ups version.\nYou can go a menu forward to the \"pwm menu\" and activate it.\nSee attached picture.\nIt will activate the fan.\nA technical information will be released soon and hopefully this bug is removed in the next UPS Software.\nBest regard\nAndre\nProblem Description 14.05.2019 16:34:00 Marc Dewing\nFor two of our UK sites, Harburnhead and Corriegarth. We have multiple WEC's where the UPS fan does automatically come on, and can not be manually activated\nwithin the PCB settings.\nThese are the only two sites we have seen this issue and these are the only two sites in the UK with a special software package. (CS82_2019-03-11)\nCan you identify if our problem lies within this software?\nFrom <https://srv-crm01.enercon.de/sap(2T1NREF3TmpRMUSERMZYMTimTWpkZk1gRmZBRkIXcE1ubkh1bWZqLUSaSmpuS2hnPTO=)/bc/bsp/sap/crm_ui_ frame/BSPWDAppli cation.do?sap-client=009&sap-language=EN&sap-domainrelax=min>\nfan PWM\nfrequenz: 2.00kHz\npuls du.: 0.1%\ntemp.: + 30","im":["shared_fault_info_1_169"],"k":""},{"i":116,"c":"Faults","s":"Descriptive","t":"Capacitor Bank short","d":"01 March 2019","f":"shared fault info 1.pdf","p":[170],"r":"","b":"  Q circle\nreport -R...","o":"","im":[],"k":""},{"i":117,"c":"Faults","s":"Descriptive","t":"Continuous boost / HSST IGBT Failure","d":"18 March 2022","f":"shared fault info 1.pdf","p":[171,172],"r":"","b":"Hill of Skilmafilly T7 had various boost faults (Cabinet not boosting the DC, Grid contactor not pulling\nin, spurious boost / chopper temperature faults) and then kept blowing the boost IGBT in Inverter\ncabinet 1.\nThis turbine was found to have double step-up converter's fitted throughout instead of the more\ncommon single step up and chopper heatsink.\n\nTD-esc-07-ger-eng-14-018 Rev001 Replacing IGBT modules shows the correct layout of each\nheatsink with part numbers. On this occasion, what should have been a 72762 2 x step-up converter\nhad been replaced with a 72451 step up converter and chopper\n\nThis gave a 62:1001 fault which drew attention to the fact that the cabinet was set up to take a\ndouble step up converter - as shown in the faults database info below:\n\nIn this situation, check the wiring from plug X19 and check the other cabinets in the WEC to establish\nwhether or not a double step up converter is required.","o":"Continuous boost / HSST IGBT Failure\n18 March 2022 08:38\nHill of Skilmafilly T7 had various boost faults (Cabinet not boosting the DC, Grid contactor not pulling\nin, spurious boost / chopper temperature faults) and then kept blowing the boost IGBT in Inverter\ncabinet 1.\nThis turbine was found to have double step-up converter's fitted throughout instead of the more\ncommon single step up and chopper heatsink.\nTD-esc-07-ger-eng-14-018 Rev001 Replacing IGBT modules shows the correct layout of each\nheatsink with part numbers. On this occasion, what should have been a 72762 2 x step-up converter\nhad been replaced with a 72451 step up converter and chopper\n6.2 Mitsubishi CM1000\nM1000\nName/ Heat sink unit Driver board |CM1000E2UA-24D | CM1000E3UA-24D\napplication SAP no. SAP no. SAP 58687 SAP 58688\nL1-L3 basic 60740 / 68148\nconfiguration 72483 / 91476 1* 1*\n1x step-up converter | 71709 68859 1x\n60822 / 65630\n2x step-up converter | 72762 / 91661 2x\nStep-up converter and 60740 / 68148 x\nchopper 72451 / 91476 1 1*\n60821 / 68151 “\nChopper 72774 / 92715 191713 1\nTable 6: Overview of heat sink unit configurations with Mitsubishi CM1000 IGBT modules\nThis gave a 62:1001 fault which drew attention to the fact that the cabinet was set up to take a\ndouble step up converter - as shown in the faults database info below:\nFor certain system configurations, a transformer with double step-up converter IGBT module is mandatory.\nThis error is generated by the power control, if no second step-up converter is enabled in the converter.\nIf a second step-up converter is available, the dip switch 1 of the inverter control must be set to 1!\nX19\nIf there is no second step-up converter is available, the dip switch 1 is set to 0.\nCharacteristic for the non-existent 2nd step-up converter: a bridge between X19.1 - X19.4 and bridge between X19.7 - X19.8.\nPlease look closely, the bridge can also be in the cable duct!\nCause Developer:\nCheck the DIP switch settings (S6.1 on the Inverter Control)\nVerify that second step-up converter is present (connected to X19)\nIn this situation, check the wiring from plug X19 and check the other cabinets in the WEC to establish\nwhether or not a double step up converter is required.","im":["shared_fault_info_1_171","shared_fault_info_1_172"],"k":""},{"i":118,"c":"Faults","s":"Descriptive","t":"CT Current transformer","d":"04 October 2019","f":"shared fault info 1.pdf","p":[173],"r":"","b":"  Current\ntransform...","o":"","im":[],"k":""},{"i":119,"c":"Faults","s":"Descriptive","t":"Data Bus error's","d":"06 March 2017","f":"shared fault info 1.pdf","p":[174],"r":"","b":"                                                                    Databus         databusCh         Enercon\n                                                                  fault finding        ecks           Databus\n\nAfternoon All\n\nI stumbled across a trick/solution to help teams when fault finding difficult databus faults. I had\na situation while on shift Sunday where a turbines databus system had failed. When the team\ngot onsite they found the display board frozen and when they replaced the IO board, display\nboard and distribution PCB they could not communicate with the IO board in the main control\ncabinet.\nThere was also databus errors in the nacelle before the team arrived so I got the team to go to\nSpecial functions on the display PCB and scroll all the way along to “CAN 1 bus counter”\n\nIn normal operation the Valid counter should count up and the warning and bus off should be\nstable.\nAs in the teams case if the warning or bus off counters count up this means there is a data bus\nissue with that particular system.\n\nOne way to differentiate where the databus fault lies in the turbine is to go to the main optical\ndistribution in the control cabinet and remove jumper S1. This isolates the nacelle control bus\nfrom the main data bus system.\n\nIf the warning or bus off counter stops counting then the fault lies in the nacelle area. If the\ncounters continue to count up then the fault lies in the lower part of the turbine.\nAs in the teams case the counter stopped and the team tried a replacement nacelle optical dis\nboard and this resolved all data bus issues in the WEC.\n\nHopefully this should help others when fault finding databus faults.","o":"Data Bus error's\n06 March 2017 08:01\nDatabus databusCh Enercon\nfault finding ecks Databus\nAfternoon All\n| stumbled across a trick/solution to help teams when fault finding difficult databus faults. | had\na situation while on shift Sunday where a turbines databus system had failed. When the team\ngot onsite they found the display board frozen and when they replaced the IO board, display\nboard and distribution PCB they could not communicate with the |O board in the main control\ncabinet.\nThere was also databus errors in the nacelle before the team arrived so | got the team to go to\nSpecial functions on the display PCB and scroll all the way along to “CAN 1 bus counter”\nIn normal operation the Valid counter should count up and the warning and bus off should be\nstable.\nAs in the teams case if the warning or bus off counters count up this means there is a data bus\nissue with that particular system.\nOne way to differentiate where the databus fault lies in the turbine is to go to the main optical\ndistribution in the control cabinet and remove jumper S1. This isolates the nacelle control bus\nfrom the main data bus system.\nIf the warning or bus off counter stops counting then the fault lies in the nacelle area. If the\ncounters continue to count up then the fault lies in the lower part of the turbine.\nAs in the teams case the counter stopped and the team tried a replacement nacelle optical dis\nboard and this resolved all data bus issues in the WEC.\nHopefully this should help others when fault finding databus faults.","im":["shared_fault_info_1_174"],"k":""},{"i":120,"c":"Faults","s":"Descriptive","t":"Databus error after FACTS Activation","d":"10 February 2021","f":"shared fault info 1.pdf","p":[175,176],"r":"","b":" Databus\nFaults aft...\n\n   Day Code Issues.\n   Wednesday, August 17, 2016     3:23 PM                                                                 -Star faults can only be reset from the faulted board.\n                                                                                                          -If after being locked out the team can not enter their code/day code and only\n                                                                                                          Pop's up message - Access denied, then get them to carry out Initialize Eprom\n   When using day codes, the system will first ask for a User number.\n   The User number for day codes is always: 0000                                                          ( this is in basic settings and then hit the orange button)\n\n   Next the system will ask for Code 1: , Code 2 or Code 3\n   Three codes can be requested a day from Germany however the WEC serial number and\n   reason for the code will be required.\n\n   Only the correct code can be used IE Code 1 with Code 1.\n\n   Before you use a day code please double-check that the date and time in “general data” of\n   the I/O board is right.\n\n   In case the date is wrong the day code will be refused by the turbine with the message\n   “wrong code”. That happens because the code is valid only for the 24 hours of today!\n\n   If the incorrect code in input 3 times in a row then the system will lock out and shut down\n   the turbine for 1 hour.\n\nHello everyone\n\nBefore you use a day code please double-check that the date and time in “general data” of the I/O board\nis right.\nIn case the date is wrong the day code will be refused by the turbine with the message “wrong code”.\nThat happens because the code is valid only for the 24 hours of today!\nThank you!\n\nWith regards / Mit freundlichen Grüßen\nBen Arndt, M.Eng.","o":"Databus error after FACTS Activation\n10 February 2021 06:58\nWE\nDatabus\nFaults aft...\nDay Code Issues.\nWednesday, August 17,2016 3:23 PM -Star faults can only be reset from the faulted board.\n-If after being locked out the team can not enter their code/day code and only\nPop's up message - Access denied, then get them to carry out Initialize Eprom\n( this is in basic settings and then hit the orange button)\nWhen using day codes, the system will first ask for a User number.\nThe User number for day codes is always: 0000\nplease enter\nservice code (2018):\nuser number: OXxxx\n< > v a | Enter\nNext the system will ask for Code 1: , Code 2 or Code 3\nThree codes can be requested a day from Germany however the WEC serial number and\nreason for the code will be required.\nplease enter\nservice code (2018):\ncode 1: OXxx\n< > . a Enter\nOnly the correct code can be used IE Code 1 with Code 1.\nBefore you use a day code please double-check that the date and time in “general data” of\nthe 1/0 board is right.\nIn case the date is wrong the day code will be refused by the turbine with the message\n“wrong code”. That happens because the code is valid only for the 24 hours of today!\n= ow =)\nENERCON\nDreekamp 5\n26605 Aurich\n11:32\nIf the incorrect code in input 3 times in a row then the system will lock out and shut down\nthe turbine for 1 hour.\nHello everyone\nBefore you use a day code please double-check that the date and time in “general data” of the I/O board\nis right.\nIn case the date is wrong the day code will be refused by the turbine with the message “wrong code”,\nThat happens because the code is valid only for the 24 hours of today!\nThank you!\nWith regards / Mit freundlichen Griien\nBen Arndt, M.Eng.\n[ 2)\nENERCON\nDreekamp 5\n26605 Aurich\n|\n|\nQ6.aun.73 11:32 |\n|","im":["shared_fault_info_1_175","shared_fault_info_1_176"],"k":""},{"i":121,"c":"Faults","s":"Descriptive","t":"DC distribution Overheated or burnt-out in plant types E 44, E 48 and E 53","d":"07 January 2021","f":"shared fault info 1.pdf","p":[177,178],"r":"","b":"Problem Description:\nIn the DC distribution (figure 1), defective electrical connections can cause damage.\n\nFigure 1: DC-distribution with defective cable insulation\n\nIf the screw connections, the insulation of the cable or the copper bar are marked by discoloration (Figure 2 and Figure 3), it indicates overheating and defective\nelectrical connections. The connections and, if necessary, the copper bars must be replaced.\n\nFigure 2: cable lug and heat shrink sleeve\n\nFigure 3: Open cable insulation coursed by overheating\n\n   Solution Description:\n1. For the repair, the tower cables must be shortened accordingly and then extended again with the help of a screw connector and a 300mm²\n   copper cable.\n2. The end of the copper cable is provided with a suitable cable lug and insulated with a shrink sleeve.\n3. If the copper bar and the existing cast resin insulator are not discolored or exposed to high temperature, they may be reused after cleaning\n   and replacement of the bolt set. If the copper bar and the cast resin insulator are exposed to heat, they must be replaced.\n4. The cables are re-laid and tightened with a torque of 60Nm. The contact surfaces and the finished screw connection must be protected\n   towards corrosion with Rivolta F.L.G. GT-2 (SAP 559852).\n   Further information on the processing of cable lugs and cables can be found in the instruction TD-esc-08-de-en-15-016.\n\n   The following materials can be ordered and used to work:\n\n   SAP      short text                                            Quantity Item\n   121249 cable TECWIND BASE H07BN4-F 1x300mm²                    8       m\n   540034 connect. screw- BSMB-120/300 shear/screw                8       ST\n   7292     cable lug pipe- M12 300mm²                            8       ST\n   86572    heat shrink.sleeve medium w.glue 63>19mm              1,6     m\n   87571    tube roll- RS300-500      315mm V2                    8       ST\n   31839    hexagon head screw DIN933 M12x035 8.8 galZn           8       ST\n   27297    conical spring washer DIN6796 12x29x03Zn              18      ST\n   84464    hexagon nut DIN934 M12 10HDG moly coated              8       ST\n   537289   bar current-                   D0226840-0             1       ST\n   3126     insulator, cast resin 50/50/M12                       2       ST\n\n   Note: If Copper to Aluminum terminations are required for Re-terminating existing wiring please see below for correct numbers:","o":"DC distribution Overheated or burnt-out in plant types E\n44,E 48 andE 53\n07 January 2021 12:17\nProblem Description:\nIn the DC distribution (figure 1), defective electrical connections can cause damage.\nFigure 1: DC-distribution with defective cable insulation\nIf the screw connections, the insulation of the cable or the copper bar are marked by discoloration (Figure 2 and Figure 3), it indicates overheating and defective\nelectrical connections. The connections and, if necessary, the copper bars must be replaced.\nFigure 2: cable lug and heat shrink sleeve\nFigure 3: Open cable insulation coursed by overheating\nwn\nSolution Description:\nFor the repair, the tower cables must be shortened accordingly and then extended again with the help of a screw connector and a 300mm?\ncopper cable.\nThe end of the copper cable is provided with a suitable cable lug and insulated with a shrink sleeve.\nIf the copper bar and the existing cast resin insulator are not discolored or exposed to high temperature, they may be reused after cleaning\nand replacement of the bolt set. If the copper bar and the cast resin insulator are exposed to heat, they must be replaced.\n. The cables are re-laid and tightened with a torque of 60Nm. The contact surfaces and the finished screw connection must be protected\ntowards corrosion with Rivolta F.L.G. GT-2 (SAP 559852).\nFurther information on the processing of cable lugs and cables can be found in the instruction TD-esc-08-de-en-15-016.\nThe following materials can be ordered and used to work:\nSAP. short text Quantity | Item\n121249 | cable TECWIND BASE HO7BN4-F 1x300mm? 8 m\n540034 | connect. screw- BSMB-120/300 shear/screw 8 ST\n7292 cable lug pipe- M12 300mm? 8 ST\n86572 | heat shrink.sleeve medium w.glue 63>19mm 1,6 m\n87571 | tube roll- RS300-500 315mm V2 8 ST\n31839 | hexagon head screw DIN933 M12x035 8.8 galzn|g ST\n27297 | conical spring washer DIN6796 12x29x03Zn 18 ST\n84464 | hexagon nut DIN934 M12 10HDG moly coated 8 ST\n537289 | bar current- D0226840-0 1 ST\n3126 insulator, cast resin 50/50/M12 2 ST\nNote: If Copper to Aluminum terminations are required for Re-terminating existing wiring please see below for correct numbers:","im":["shared_fault_info_1_177","shared_fault_info_1_178"],"k":""},{"i":122,"c":"Faults","s":"Descriptive","t":"E48 Axle nut checks.","d":"02 July 2020","f":"shared fault info 1.pdf","p":[179],"r":"","b":"CS48 Front\nBearing A...\n\n E48 axle\nnut checks","o":"","im":[],"k":""},{"i":123,"c":"Faults","s":"Descriptive","t":"Eprom needs software update","d":"16 September 2020","f":"shared fault info 1.pdf","p":[180],"r":"","b":"  Eprom\nOrder Form","o":"","im":[],"k":""},{"i":124,"c":"Faults","s":"Descriptive","t":"Excitation during stop","d":"07 November 2018","f":"shared fault info 1.pdf","p":[181],"r":"","b":"ESC Ticket: 70020758, Excitation during Customer stop.\n\n01. November 2018 | 16:05 | Marc Dewing | Problem Description\n\nOn our UK turbines 825060 & 825062, during a customer stop the turbines went into fault with 80:1.\nThe local service team found blown pole shoes.\n\nLooking at an adjacent WEC which was still in customer stop, current was present on the excitation.\n\nIt is strange that all WEC's for this site would have the same condition so have looked through\nsoftware descriptions for an answer but could not find one.\n\nCan advice be given?\n\n07. November 2018 | 11:26 | Philip Heidgen | Solution Description\n\nHi Marc,\nsorry for the late answer.\nWhen the outside temperaure is lower than 15°C, the rotor heating is activated to get the rotor\ntemperature 3°C higher than the outside temperature. There are some exceptions. You can find the\ninfo's about the rotor heating in the following documents in the TSI 06:\n\n06-032\n10-017\n17-009\n\nUnfortunately i can't find more information at the moment.\nThanks and best Regards,\nPhilip","o":"Excitation during stop\n07 November 2018 15:50\nESC Ticket: 70020758, Excitation during Customer stop.\n01. November 2018 | 16:05 | Marc Dewing | Problem Description\nOn our UK turbines 825060 & 825062, during a customer stop the turbines went into fault with 80:1.\nThe local service team found blown pole shoes.\nLooking at an adjacent WEC which was still in customer stop, current was present on the excitation.\nIt is strange that all WEC's for this site would have the same condition so have looked through\nsoftware descriptions for an answer but could not find one.\nCan advice be given?\n15:28:08] 80: 1 [Excitation error: Fault current | 6 17:41:30\n4 9/24/2018\n21:10:20]1:7 Turbine stopped : SCADA (customer) 4 18:17:48\n21:10:15/15: 111 Turbine moist : Rectifier 1 00:00:05\n07. November 2018 | 11:26 | Philip Heidgen | Solution Description\nHi Marc,\nsorry for the late answer.\nWhen the outside temperaure is lower than 15°C, the rotor heating is activated to get the rotor\ntemperature 3°C higher than the outside temperature. There are some exceptions. You can find the\ninfo's about the rotor heating in the following documents in the TSI 06:\n06-032\n10-017\n17-009\nUnfortunately i can't find more information at the moment.\nThanks and best Regards,\nPhilip","im":["shared_fault_info_1_181"],"k":""},{"i":125,"c":"Faults","s":"Descriptive","t":"Facts PCB","d":"20 October 2016","f":"shared fault info 1.pdf","p":[182],"r":"","b":"After replacement of facts board there is no power to the display and I/O Board, check that CPU 2 Is seated properly on\nthe Facts board. Sometimes the two screws on the back are not tight.\n\nI f you replace the FACTS board there should be no need for a prarameter update but software may be\nrequired.","o":"","im":[],"k":""},{"i":126,"c":"Faults","s":"Descriptive","t":"FACTS software","d":"18 November 2021","f":"shared fault info 1.pdf","p":[183],"r":"","b":"Evening all\n\nOver the last few weeks several FACTS PCBs have been damaged during software updates.\nThe damage seems to occur when Power Control software is loaded on instead of FACTS\nPower Control software.\n\nWhen updating software, please take care to install the correct software version for the WEC\ntype.\n\nThe latest software version for each PCB in the WEC can be obtained from Tsi 05 as shown:\n\nAnd the update sequence is given in Tsi 08 as shown below.\n\n        TD-esc-08-ger-eng-10-054 Rev000 WEC display software update\n\nAfter updating the display, check what type of Power Control is fitted, If it’s FACTS – DO NOT INSTALL\nPower Control software, only install the correct version of FACTS Power Control software","o":"FACTS software\n18 November 2021 18:50\nEvening all\nOver the last few weeks several FACTS PCBs have been damaged during software updates.\nThe damage seems to occur when Power Control software is loaded on instead of FACTS\nPower Control software.\nWhen updating software, please take care to install the correct software version for the WEC\ntype.\nThe latest software version for each PCB in the WEC can be obtained from Tsi 05 as shown:\nAnd the update sequence is given in Tsi 08 as shown below.\nTD-esc-08-ger-eng-10-054 Rev000 WEC display software update\n5.3.2 Software update sequence\nortware 4 Loa\nYcss2\nend\n> TD-gecs-05-de-en-21-009 Revol eng Sis Program overview list CS82 TD-esc-D5-dexx-21-009 O00\nrer\nSoftware ma rsa\nIU Board Z Nacelle 84 BU (+4) 3.49\nFACTS Power Control CPU1 1.0\nC167 controller only 33 20 3.238\nFACTS Power Control CPU1 1.0 33 20\nXE controller only\nFACTS Power Control CPU1 1.1 33 20\nFACTS Power Control CPU2 37 21 1.47\nFACTS Power Control CPU2 XE 37 22 1.18\nFACTS Power Control HW2.x\nCPUt 33 20 1.33\nFACTS Power Control HW2.x\nCPU2 33 22 2.13\nNearaiunlina Dratactinn CDI 14 a7 wal 41 7082\nUpdate the software of the individual modules in the sequence shown in Tab. 1 below. If no software\nupdate is required for a particular module, select the next in line.\n| Display |\nFACTS Power Control\nPower Control |\nCPU1 —\nInverter Control\nepin —— eps\nAfter updating the display, check what type of Power Control is fitted, If it’s FACTS - DO NOT INSTALL\nPower Control software, only install the correct version of FACTS Power Control software","im":["shared_fault_info_1_183"],"k":""},{"i":127,"c":"Faults","s":"Descriptive","t":"FCU Control","d":"18 June 2018","f":"shared fault info 1.pdf","p":[184],"r":"","b":"If a WEC is not responding to a FCU curtailment then please check the FACTS P1031 Parameter. If\nthis parameter is switched off then the FCU will not be able to control the WEC.","o":"","im":[],"k":""},{"i":128,"c":"Faults","s":"Descriptive","t":"Flushing / re-greasing of roller bearings","d":"07 January 2021","f":"shared fault info 1.pdf","p":[185,186],"r":"","b":"Problem Description:\nWhen a bearing damage got detected or when the iron or copper part is too high, the grease of the\nbearing needs to get flushed and replaced by fresh grease to avoid that rollers will not overrun\nparticles again. Further damages can get stopped this way.\n\nSolution Description:\n\nQuantity of grease:\nType of turbine Quantity of grease in kg\n                     Rear main bearing       Front main bearing Blade flange bearing Yaw bearing\n      EP1                     5                       5                      2                  3\n\n (E-40 to E-53)\n      EP2                     8                       8                      4                  6\n\n (E-58 to E-92)\n      EP2                    10                       10                     5                  8\n\n    (E-103)\n      EP3                    20                       20                    10                  10\n\n(E-101 to E-115)\n      EP4                    35                       35                    15                  15\n\n(E-126 to E-141)\n      EP8                    45                       45                    25                  25\n\n    (E-126)\n\nProcedure:\nAfter cleaning all lubrication points and taking off central lubrication connections and grease nipples\nthe grease pump (refiller or grease gun) needs to get connected.\nMain bearing (front and rear): At first one third of the stated amount of grease has to get pumped\ninto the bearing splitted to each lubrication point. Afterwards the rotor needs to rotate 15 to 20 turns.\nRepeat greasing and turning two times.\nBlade flange bearing: At first one third of the stated amount of grease has to get pumped into the\nbearing splitted to each lubrication point. Afterwards pitch the rotor blade completely in and\nout. Repeat greasing and pitching two times.\nYaw bearing: At first one third of the stated amount of grease has to get pumped into the bearing\nsplitted to each lubrication point. Start the yaw control and pump the remaining grease splitted to each\nlubrication point into the bearing.\n\nforeign Language\nSunday, October 09, 2016     12:52 PM\n\n                                                   To change the language, dial into the display and go to special functions.\nI/O Boards Control Cabinet                         Once you have input a service code come back out.\n\n                                                   Go back into special functions on the display and it will be the first menu","o":"","im":[],"k":""},{"i":129,"c":"Faults","s":"Descriptive","t":"G59 Fault finding prcedure","d":"19 November 2019","f":"shared fault info 1.pdf","p":[187],"r":"","b":"As requested by Steve Harrison, the attached document should be used to fault find G59's\n\n    G59 fault\n    procedure\n\n       G59\n     template","o":"","im":[],"k":""},{"i":130,"c":"Faults","s":"Descriptive","t":"Grease sample","d":"02 June 2020","f":"shared fault info 1.pdf","p":[188],"r":"","b":"Cat B is fine. Cat C would be borderline and dependent on whether it was metallic. I'd be doing a\nflush on the next maintenance regardless. We'll be adding more grease anyway so a flush would give\nus a good sample specimen which we can check against this recent one plus it removes used grease\nand replaces with fresh - unlike a relube which just adds more grease to already used grease.","o":"","im":[],"k":""},{"i":131,"c":"Faults","s":"Descriptive","t":"Hardware Reset","d":"01 November 2018","f":"shared fault info 1.pdf","p":[189],"r":"","b":"","o":"Hardware Reset\n01 November 2018 10:17\n| ESC Ticket: 70007816, HW Reset for facts 2.0\n14. February 2018 | 07:59 | Timm Mross | Solution Description\nPLEASE NOTE IN GENERAL:\nA hardware reset is just the last way to get a turbine back in operation!\nThe load to all electronic components is higher as a software reset which shall be succesfull in 99%\nSo a hardware reset is only permitted in exceptional cases!\nAhardware reset is possible by FACTS 2.0 as well but there is the entering of the servicecode necessary\nYou can find the option in the menu \"special function\" at the PCB Power Control... To carry out a reset push both grey buttons at first and inside 5 seconds the quit button.\nReset Info RM\nResetcounter: 152\nLast Reset : ESRO P\nSW-RST SetO\n08. February 2018 | 09:34 | Engin TOPCU | Problem Description\nHello,\nJust hw reset is possible for some faults and it saves time sometimes for us, but | could not find it for facts 2.0 operation, is there any possibility hw reset for facts 2.0?\nturbine HW resetRM\n<OFF> ONV VOFF\n> To A dl emer","im":["shared_fault_info_1_189"],"k":""},{"i":132,"c":"Faults","s":"Descriptive","t":"Re Initialise Load control","d":"01 August 2019","f":"shared fault info 1.pdf","p":[190],"r":"","b":"TD-esc-07-de-en-15-010 Rev000 Installing load control sensor\nStep: 10 Adapting the control system and checking the load control sensor values\n\nFrom point 5","o":"Re Initialise Load control\n01 August 2019\n15:10\nTD-esc-07-de-en-15-010 Rev000 Installing load control sensor\nStep: 10 Adapting the control system and checking the load control sensor values\nFrom point 5\n. On the control cabinet on the //O-Board 1 control cabinet\nPCB, go to the Load-Control menu and select Ini-\ntialise Load Control (Fig. 47).\n. Using the grey buttons, set the parameter P2050 to 100\nand confirm with the orange button.\nFig. 47: Initialising load control, step 9\n1\n. After a few seconds set the parameter to 2 and confirm.\n. Use the main switch to reset the WEC control system.\n. Check whether the parameter P2050 is still set to 2\n(Fig. 48).\nFig. 48: Initialising load control, step\n2\n10.On the //O-Board 1 Nacelle PCB go to the relevant Con-\ntrolboard Pitch PCB.\n11.In the Load control menu select Zero point DMS\norLoad DMS .\nFig. 49: Checking the load control 12. Check the DA-values and AD-values for load control sen-\nsensor values sor 1 and load control sensor 2 (Fig. 49).\nWEC type Target value\nDA-value AD-value\nE-53, E-82, E-92, E-126 2048 + 300 dig ;\n512 +1 dig\nE-101, E-115 1800 + 300 dig\nTable 8: DA-setpoints and AD-setpoints\nIf the tolerance is not observed, the load control\nil sensor is incorrectly installed or defective.\n13. Start the WEC.\n14. On the nacelle control cabinet on the //O-Board 1 Nacelle\nPCB go tothe Pitch data menu and select Blade\nload curr/aver.\n15. Check the current blade load values (Fig. 50).\nFig. 50: Current load control values 6 Tai aa aaa Sine aes DE\n@ If one of the values is negative, load control sen-\nsor 1 (rear) or load control sensor 2 (front) or the\nsensor cable have been interchanged.\n16.Stop the WEC.","im":["shared_fault_info_1_190"],"k":""},{"i":133,"c":"Faults","s":"Descriptive","t":"Ice detection test failure.","d":"23 September 2020","f":"shared fault info 1.pdf","p":[191],"r":"","b":"Many teams have reported their turbine not stopping when carrying out the ice detection test.\n\nPlease ensure the latest software is installed and try again.","o":"","im":[],"k":""},{"i":134,"c":"Faults","s":"Descriptive","t":"Initialize EEPROM / Parameter update","d":"05 January 2021","f":"shared fault info 1.pdf","p":[192],"r":"","b":"After a software update, an initialization of the EEPROM often takes place unnecessarily. This is really necessary only in rare cases.\n\nBy initializing, system-specific parameters in the background depend on the basic settings, such as turbine version / blade version set to\ncorrect values that are safe for the wind turbine. The power optimized maximum power (P2100) is also set to default values as a function of\nthe rated active power (P2003).\n\nIf dependent parameters (e.g. set rotation speed (power optimized), depending on the turbine version / blade version) have been changed\nafter a last initialization, they are thus reset again on reinitialization.\n\nIf these parameters have been set in the SAP system as desired values, a comparison error can still occur with the subsequent YP message\nin the SAP system.\n\nInitialization is required only if the software prompts you with status 152: xxx. This can be done automatically after a software\nupdate or when changing the parameters in basic settings such as the nominal active power. An initialization without request from\nthe software is to be avoided and to be carried out only with separate instruction (among other things by software description, ESC-\nElectrical Engineering, developer).\n\nAfter every initialization of the EEPROM, a parameter update must always be carried out for the reasons mentioned above. This is to ensure\nthat the parameters with different setpoint specifications are again set to the default settings of the software in the wind turbine.","o":"","im":[],"k":""},{"i":135,"c":"Faults","s":"Descriptive","t":"I/O PCB Clear data","d":"19 August 2019","f":"shared fault info 1.pdf","p":[193,194],"r":"","b":"Two options to try against the parameter out of range...\n\nIn case the parameter is not a PM/Site Assessment or Service Parameter the IO board can be reset\nwith the battery jumper:\njumper is on IO board 1 Control Cab. On top of the board next to the display.\nMove jumper to the left to Battery off.\nwait 5 minutes\nmove jumper to the back to the right position\nDo a software and parameter adjustment to the board.\n\nIf this fails TRY?\n\nPlease do the following:\n -Do the software update again\n-Under “basic settings” and “initialize noise optimized curves: no” switch to “yes”\n-Then initialize EEPROM\n-Then transfer the parameters to the turbine again\n\nI/O Boards Control Cabinet\nWednesday, June 08, 2016    3:26 PM\n\nDialing into the I/O Board some menu's are in foreign. Including loss of function on a board.\n  - This was caused by a bus error, carry out a reset of the bus error and the fault will cure.\n\n       If you can not see a New PCB after install, for the software update there are a few options to try.\n\n       (1)If you are having difficulty up-loading software to a new PCB is it possible that the new PCB has\n       incompatible software with the rest of the turbine. You will need to clear this PCB of its memory.\n       To do this follow the same process for Parameters out of range.\n       Out of Range. Gen\n\n       (2) the Can optical jumper S1 on the control optical dist PCB. Remove jumper, prepare to do software\n       update and only put it back in as you start the update\n\n       (3) Remove the PCB and connect it the Display PCB via wiring, and carry out update without the rest of\n       the system between.\n\n       (4) Against the test box mode a new Eprom can be used if you have one.\n           If not an alternative way of getting rid of the test box mode is:\n       -remember the 4 dip switch positions on the IO board\n       -put all 4 dip switch positions to off\n       -try a software update according to TSI8. 10-054 (attached)\n       -set the 4 dip switch positions how they were before\n       -do a parameter update afterwards\n\n       The fault 432:84 can be a defective IO board but it could also be a missing supply voltage to the board -\n       (+5V, +15V, +20V) on the I/O board. If a cable is loose for example.","o":"|/O PCB Clear data\n19 August 2019 13:27\nTwo options to try against the parameter out of range...\nIn case the parameter is not a PM/Site Assessment or Service Parameter the IO board can be reset\nwith the battery jumper:\njumper is on IO board 1 Control Cab. On top of the board next to the display.\nMove jumper to the left to Battery off.\nwait 5 minutes\nmove jumper to the back to the right position\nDo a software and parameter adjustment to the board.\n6\nIf this fails TRY?\nPlease do the following:\n-Do the software update again\n-Under “basic settings” and “initialize noise optimized curves: no” switch to “yes”\n-Then initialize EEPROM\n-Then transfer the parameters to the turbine again\n1/O Boards Control Cabinet\nWednesday, June 08, 2016 3:26 PM\nDialing into the |/O Board some menu's are in foreign. Including loss of function on a board.\n- This was caused by a bus error, carry out a reset of the bus error and the fault will cure.\nIf you can not see a New PCB after install, for the software update there are a few options to try.\n(1)If you are having difficulty up-loading software to a new PCB is it possible that the new PCB has\nincompatible software with the rest of the turbine. You will need to clear this PCB of its memory.\nTo do this follow the same process for Parameters out of range.\nOut of Range. Gen\n(2) the Can optical jumper S1 on the control optical dist PCB. Remove jumper, prepare to do software\nupdate and only put it back in as you start the update\n(3) Remove the PCB and connect it the Display PCB via wiring, and carry out update without the rest of\nthe system between.\n(4) Against the test box mode a new Eprom can be used if you have one.\nIf not an alternative way of getting rid of the test box mode is:\n-remember the 4 dip switch positions on the IO board\n-put all 4 dip switch positions to off\n-try a software update according to TSI8. 10-054 (attached)\n-set the 4 dip switch positions how they were before\n-do a parameter update afterwards\nThe fault 432:84 can be a defective |O board but it could also be a missing supply voltage to the board-\n(+5V, +15V, +20V) on the I/O board. If a cable is loose for example.","im":["shared_fault_info_1_193","shared_fault_info_1_194"],"k":""},{"i":136,"c":"Faults","s":"Descriptive","t":"Inverter control PCB details","d":"21 February 2022","f":"shared fault info 1.pdf","p":[195,196,197],"r":"","b":"    DC Input\n    The basic circuit diagram shows the main components of the 300kW converter. The terminals +/- UGR have the dc\n    voltage (app. 200 – 680V), that is being smoothed in the UGR capacitor bank. The voltage above the capacitors is\n    actively balanced in the DC-Link-interface.\n    Current in the upper power range will flow via bypass diode in the UZW-intermediate circuit.\n\n    Step-up transformer\n    In the lower power range the step-up transformer will increase the UGR-voltage to app. 650V, which is then present in\n    the UZW-intermediate circuit. Therefore the Step-up-IGBT switches continuously on and off in the kHz-range with a\n    variable Pulse-interval-ratio.\n    If the IGBT is switched on, a current will flow through the step-up choke. This will store energy in the choke. When the\n    IGBT switches off, the briefly stored energy will be transferred into the UZW-intermediate circuit via the Pass-diode.\n    The higher voltage will result from the high no-load voltage of the step-up choke.\n\n    UZW-Intermediate Circuit\n    UZW-voltage lies above UZW-capacitor bank. The capacitor voltage is here also balanced by the DC-link-interface.\n\n    Chopper (optional)\n    Excess energy in the converter will result in an increased UZW-voltage.\n    Reasons could be e.g. grid faults (under-voltage, phase jumps,..). The external chopper resistor can take over this excess\n    energy briefly and convert it into heat energy. The intermediate circuit voltage will be switched to the external resistor\n    via chopper-IGBT.\n\n    Feeding IGBTs\n    These IGBTs create the three-phase alternating current 50Hz (or 60Hz) from the intermediate circuit current. The\n    inverter-control-board will create the required pulse patterns. The sinusoidal current will be constantly monitored and\n    controlled by the three LEM-modules.\n\n    Grid Choke & Grid Filter\n    Filters the input sinus current.\n\n    Plugs of Inverter Control\n    X1 Supply\n\nX1 Supply\nVoltage of app. 40V and 30kHZ are present\nAC1: only Inverter Control supplied\nAC2: supply of driver, DC-Link-Interface and sensors\n\nX2 Reserve Temperature\nInput for KTY-81 sensors. They will be connected to 1 and 3 or 2 and 3.\n\nX3 Connection for DC-Link-Interface\nDC-Link-Interface with AC2-voltage is supplied from here (5 and 6). Supply is through a relay; see LED: „Supply DCLink“.\nConnection for UGR and UZW-voltage measurement also are here. New is, that the singler capacitor voltages can now\nbe measured .\n\nThe different voltages are in\nmenu output\n\nX4 Chopper Back-feed\nIf an external chopper resistance has been connected, the over-temperature switch will be connected here.\nThe circuit board will detect the chopper from the bridge between pin 2 and 3. The temperat.-switch is on pin 1 and 3.\n\nX5 & X6 Relay\nConnection see circuit board over-view\n\nX7, X8 & X9 Digital inputs\nConnection see circuit board over-view\n\nX10 – X13 Driver interface\nThis is the total electric interface of the drivers. One driver board always supplies 2 IGBT-modules. New is the\nintegrated temperature sensor in the modules.\nPlug connection is as follows:\n1 & 2: Integrated temperature sensor of under-switch\n3 & 6: Driver back feed. Is closed if driver is ok.\n4 & 5: supply AC2\n7 & 8: Integrated temperature sensor of upper switch\n9 & 10: Temperature switch heat sink\n\nX14- X16: LEM-Connection\nThe LEM-current measurement is connected here. The message „LEM-Connect“ will appear for faulty connections.\n\nX18 Cross short-circuit detection\nComes from cross short-circuit-chokes\n\nImportance of LEDs\nUpper Row:\n\nRelease:      On, when pulse release is given\nProg:         Flash of processor is being programmed\nLEM:          Fault in LEM-plug, LEM-module or LEM-cable\nUZWmax: Over-voltage UZW\nQK:           Cross short-circuit (always comes with appropriate over-current-LED)\nDriver:       No back message of IGBT-driver (e.g. no power at drivers)\nOK:           Processor ready. Must always be on or blink\nError:        A fault exists\n\nLower Row:\n\nPower:        Main voltage supply\nProg:         Flash of processor is being programmed\nHsst:         Hsst-limitation. Is on, when the Hsst is run at current limit (Hsst = step-up transformer)\nHeatsink: Over-temperature switch on heatsinks\nInductor:     Over-temperature switch on choke\nUZW:          Intermediate circuit is charged (>500V) Hardware-release for grid contactor\nOK:           Processor is ready. Must always be on or blink.\nError:        A fault is present\n\nOther LEDs:\nPower-Iso2:          Supply of digital I/Os; must always be on\nI-Max xx:            Over-current\nAt Relay:            These LEDs show, whether a relay is switched on\nAcoustic sensor: The acoustic sensor has responded\nChopper:             The chopper is contacted\nTemp Chopper:        Over-temperature or over-load chopper. Is caused by temperature switch lengthy operation of choppers\n\nTemp Chopper:      Over-temperature or over-load chopper. Is caused by temperature switch lengthy operation of choppers\n\nProcessor Tasks:\nCPU 1:\n• Monitoring of digital inputs [X7 – X9]: (fuses, temperature switch)\n• Drive step-up transformer [W19]\n• Drive of all relay [X5, X6]: (grid contactor , fan,...)\n• Temperature measurement of IGBT-module [X10 – X13]\n• Switching of power supply for DC Link-Interface [X3]\n• Measurement of UGR & UZW [X3]\n• Monitoring of choppers [X4]\n• Control of converter power\n\nCPU 2:\n• Synchronising to zero crossing (will be created by power control) [W11]\n• Measurement of currents [X14 – X17] (L1, L2, L3, IGR)\n• Drive of IGBT-drivers [W13 – W18]\n• Cross short-circuit monitoring [X18]\n\nCommunication:\nThe inverter control communicates via CAN-Bus protocol with the power control in the control cabinet. The optical\nwaveguide connections will remain free and will currently only be used for Software-Update.\nGrid Measurement and Zero Crossing:\nAs the grid measurement has been moved to the power control in the control cabinet, the grid zero crossing will go over\nits own optical waveguide to the converter. It is used for synchronising to grid frequency and phase.\n\nDC-Link Interface\nThe DC-Link Interface balances actively the voltages at the capacitor banks. It makes sure that the same voltage is on\nthe plus and minus contacts of the capacitors. Also the contact for the UGR and UZW-voltage measurement for the\ninverter control is here. The symmetry will be tested via optical waveguides. For switched off DC-interface the resistors\nare constantly switched to the capacitors.\n\nPower Supply:\nThe power supply supplies all circuit boards in the converter with an alternating voltage of app. 40V with 30kHz.\nThere are 2 different alternating voltages (AC1 and AC2), which are created with different high level output\ntransformers on the board. AC1 supplies only the inverter control-board. AC2 is divided on the inverter control and\nsupplies the drivers and the DC-Link-interface. The voltage to DC-Link-Interface will be switched by processor 1 via\nrelay.\n\nInformation:\nTo measure the AC-voltages with a multimeter appears to be difficult. Multimeters with RMS-function show app. 20V,\nothers between 15 and 30V.\nAC1 is on, if „Power-LED“ at Inverter-Control is on\nAC2 is on, if „Power-ISO2“ at Inverter-Control is on\n\nAbout Software:\n\nThe address of the converter will be set in the display (under special functions).","o":"Inverter control PCB details\n21 February 2022 15:48\nBasic Circuit Diagram\nBy pee dade —_ _\n— sowaae! 7 | Dte\noS Lal\nsym\noo ee)\n= 0 ey\nUB ual Ih\nCapacitor bank —-Step-up transformer Capacitor bank Chopper Feeding IGBTs Grid connection\nUGR 1GBT ‘UZW\nDC Input\nThe basic circuit diagram shows the main components of the 300kW converter. The terminals +/- UGR have the de\nvoltage (app. 200 - 680V), that is being smoothed in the UGR capacitor bank. The voltage above the capacitors is\nactively balanced in the DC-Link-interface.\nCurrent in the upper power range will flow via bypass diode in the UZW-intermediate circuit.\nStep-up transformer\nIn the lower power range the step-up transformer will increase the UGR-voltage to app. 650V, which is then present in\nthe UZW-intermediate circuit. Therefore the Step-up-IGBT switches continuously on and off in the kHz-range with a\nvariable Pulse-interval-ratio.\nIf the IGBT is switched on, a current will flow through the step-up choke. This will store energy in the choke. When the\nIGBT switches off, the briefly stored energy will be transferred into the UZW-intermediate circuit via the Pass-diode.\nThe higher voltage will result from the high no-load voltage of the step-up choke.\nUZW-Intermediate Circuit\nUZW-voltage lies above UZW-capacitor bank. The capacitor voltage is here also balanced by the DClink-interface.\nChopper (optional)\nExcess energy in the converter will result in an increased UZW-voltage.\nReasons could be e.g. grid faults (under-voltage, phase jumps,..). The external chopper resistor can take over this excess\nenergy briefly and convert it into heat energy. The intermediate circuit voltage will be switched to the external resistor\nvia chopper-IGBT.\nFeeding IGBTs\nThese IGBTs create the three-phase alternating current SOHz (or 60H2) from the intermediate circuit current. The\ninverter-control-board will create the required pulse patterns. The sinusoidal current will be constantly monitored and\ncontrolled by the three LEM-modules.\nGrid Choke & Grid Filter\nFilters the input sinus current.\nu 2 b\nmeee inwinmiice +. imrimchen + ivwiice +s incon\nCOMO fg Jy | COI 4 74 | COO\n4|+ Boao s|+ 4]t\ncoc\non\nRed wr\nBootblockyumper 2 Zero cross exit\nun i\ncurrent 3 Oo, — Zeno cos put\nL3 Red\nDip switch eck? tere\nun\ncurrent 12 oO oT, cpu2 Eprom 2\nhe ‘Motor cxreuit breaker\ncuit\n7 Oo ooo 000 S| Pomc onich\ncurrent Release Prog ‘LEM U2 Wax QK Dnver OK  Enor 5\nLi Red 4 wed ek aed ed geen ed S| Cooke texsperare-\nS| ma\nte aed | x7 semiconductc fae\ncoment it Tr Drsphay 5 Reserv\nTr Owe re fan 8 mes\n(X6 Relay\nOC} Reserve\n. ABSee 3\ncross OC} Reserve\nshort circuit [—] a\n“tT fad\n#18 Dip seh ec rey\nm8 [3 _\nco. 6\nui. | 9 Eprom i CPUI Bootblockyamper 1 o| =\n32/8 3] ™\n{ e©0000000 ~\nowe Pop HSTHera nase ZW OC Ee\noo cat Sent pe gece XA Chappe rca\n° Eisenman\nAkustiksensor Rot Reserve optical\n>| waveguide\nTy Sree pti\noO\n| tackespc\nwera\nACL AC?\n[eofoo] [+ Hell +t]+ [29] [2000000000]\nX1 supply CAN CAN X3 D-Link DC-Link\nGircmt board Rove PoneCel Resae Tenperstee\nPlugs of Inverter Control\n1GBT diver |\nIGBT Chopper (+)-\nIGBT Hse ( nly screens with the V-O label are allowed to be installed.\nDas Material der Beruhrungsschutzabdeckung muss aus Material der Brennbarkeitskiasse V-0 bestehen\n-\nKennzeichnung nach Company Standard CS E00 001:2017-06, Kategorie B\nlabeling according to company standard CS E )01:2017-06, category B\nThe material of the touch protection cover made of flammability class V-O.\nLabeling according to corporate standard CS EOC category B.\nlabeling according to company standard CS too 00122017-06, category 8","im":["shared_fault_info_1_198","shared_fault_info_1_199"],"k":""},{"i":138,"c":"Faults","s":"Descriptive","t":"Mains filter removal.","d":"29 August 2017","f":"shared fault info 1.pdf","p":[200],"r":"","b":"                                                                         Filter circuit removal at Corrigarth\n\nStep:   Action:\n\n1       Switch off main control cabinet (SO1)\n2       Remove filter fuses (FC10) and store in a safe place.\n3       Bridge points X8.4 and X8.3 on inverter control PCB (FIG 1)\n4       Switch on contol cabinet (SO1)\n5       Insure WEC is fault free with no filter circuit trip messages.\n6       Note date and time in \"log\" section.\n7       Start WEC.","o":"Mains filter removal.\n29 August 2017 09:59\nStep: Action:\nNOUBWNPR\nSwitch off main control cabinet (SO1)\nRemove filter fuses (FC10) and store in a safe place.\nBridge points X8.4 and X8.3 on inverter control PCB (FIG 1)\nSwitch on contol cabinet (SO1)\nInsure WEC is fault free with no filter circuit trip messages.\nNote date and time in \"log\" section.\nStart WEC.\nDig in reserve & X92) — 4\nDig in reserve 2\nDig in reserve 2\n= hygrostat\n= tygrostat\nT motor protection switch\n13 motor protectbn switch\nrelease grid contactor\nrelease grid contactor\nor montioring afc\n. . . f itor it fe\nBridge the Two following points: wee montoning gre\nchoke temp.\nchoke temp.\nfuse monitaring UGR\nfuse monitsring UGR\nIso s12V\nIso ov\nX96 —>\nFilter circuit removal at Corrigarth\n nge...\nIn case the parameter is not a PM/Site Assessment or Service Parameter the IO board can be reset with the battery jumper:\njumper is on IO board 1 Control Cab. On top of the board next to the display.\nMove jumper to the left to Battery off.\nwait 5 minutes\nmove jumper to the back to the right position\nDo a software and parameter adjustment to the board.\nIf this fails TRY?\nPlease do the following:\n-Do the software update again\n-Under “basic settings” and “initialize noise optimized curves: no” switch to “yes”\n-Then initialize EEPROM\n-Then transfer the parameters to the turbine again","im":["shared_fault_info_1_208"],"k":""},{"i":143,"c":"Faults","s":"Descriptive","t":"Overvoltage protection","d":"08 February 2021","f":"shared fault info 1.pdf","p":[209],"r":"","b":"Resistance check: Greater than 1 Meg","o":"","im":[],"k":""},{"i":144,"c":"Faults","s":"Descriptive","t":"Pendulum operation","d":"29 October 2020","f":"shared fault info 1.pdf","p":[210],"r":"","b":"For a description of Pendulum operation please see SID 1:19","o":"","im":[],"k":""},{"i":145,"c":"Faults","s":"Descriptive","t":"Pitch motor diagnosis","d":"21 February 2020","f":"shared fault info 1.pdf","p":[211],"r":"","b":"As discussed, when the teams are carrying out fault finding on the pitch motors the team can carry out measurement checks.\nBelow are two tables, One empty one with desired values.\n\nPlease sent the teams the uncompleted table requesting values. This was we can be sure the measurements have been carried out. You can then cross ref against the desired values\ntable.\n\nMeasurements table for Technicians.\n\n      Motor details              A         B         C\n      Motor SAP No.\n   Motor manufacturer\n    Resistance check             A         B         C\n   Measurement point           Value      Value    Value\nF1 - F2\n1B1 - 2B2\nD1 - D2\nT1 - T2\n500V Dc Insulation check         A         B         C\n   Measurement point           Value      Value    Value\nF1 - D1\nF1 - PE\nD1 - PE\n\nDesired value table.\n\n    Resistance check\n   Measurement point              Value\nF1 - F2                        385 Ohm\n1B1 - 2B2                      23 Ohm\nD1 - D2                        1.25Ohm\nT1 - T2                        109 Ohm\n500V Dc Insulation check\n   Measurement point              Value\nF1 - D1                        > 1Meg ohm\nF1 - PE                        > 1Meg ohm\nD1 - PE                        > 1Meg ohm","o":"","im":[],"k":""},{"i":146,"c":"Faults","s":"Descriptive","t":"Pitch motor failure E92","d":"07 January 2021","f":"shared fault info 1.pdf","p":[212],"r":"","b":"Problem Description\nThe Ruckh® pitch motor had fractures on the bearing shield of the A- and B-sides.\nIn the course of this a constructive defect of the motor was discovered, which favours the breaking of the B-bearing shield.\nThis constructive defect is corrected with an adapted ring between the motor housing and the B end shield as well as a new end shield.\nThis new, reinforced motor has already been released and designed as a replacement material: SAP number 192919 Variable pitchmotor Ruckh®E82E4 MK82021-2\n\nSolution Description:\nIf a pitch motor from the company Ruckh® in an E-92 plant fails due to a short circuit to ground or short circuit to windings, this defective pitch motor must be replaced\nwith the new reinforced motor variant.\nIf a pitch motor from the company Ruckh® in an E-92 plant should fail due to a break in the bearing shield of the A- or B-side, all three pitch motors of the affected wind\nturbine must always be replaced with the new, reinforced version (no matter how many motors were actually damaged).","o":"Pitch motor failure E92\n07 January 2021 10:31\nProblem Description\nThe Ruckh® pitch motor had fractures on the bearing shield of the A- and B-sides.\nIn the course of this a constructive defect of the motor was discovered, which favours the breaking of the B-bearing shield.\nThis constructive defect is corrected with an adapted ring between the motor housing and the B end shield as well as a new erd shield.\nThis new, reinforced motor has already been released and designed as a replacement material: SAP number 192919 Variable pitchmotor Ruckh®E82E4 MK82021-2\nSolution Description:\nIf a pitch motor from the company Ruckh® in an E-92 plant fails due to a short circuit to ground or short circuit to windings, this defective pitch motor must be replaced\nwith the new reinforced motor variant.\nIf a pitch motor from the company Ruckh® in an E-92 plant should fail due to a break in the bearing shield of the A- or B-side, all three pitch motors of the affected wind\nturbine must always be replaced with the new, reinforced version (no matter how many motors were actually damaged).","im":["shared_fault_info_1_212"],"k":""},{"i":147,"c":"Faults","s":"Descriptive","t":"Pole shoe Bridging","d":"24 January 2018","f":"shared fault info 1.pdf","p":[213],"r":"","b":"    Additional details outside of Limit value list.\n\n    Bridge 1 pole shoe only:\n    Limit value stipulates 1 pole shoe bridged then a limitation of 75% rated power needs to be applied.\n\n    Bridge multiple pole shoes:\n    There is no maximum figure in the limit values list however no more than: Up to 5 pole shoes can be bridged but only for a MAX of 10 days.\n    We do not have a limit value for more than 2 pole shoes, because of the position of the defect pole shoe is important.\n\n    For Example, if the pole shoes are next to each other we'll have a big \"Magnetic hole\" which will lead to the turbine shaking or cause a fault condition.\n\n    If a team bridge multiple pole shoes they must notify the IHT which system each is on and which pole shoe. The team then gradually ramp up the power of\n    the turbine, observing tower for oscillations and vibrations. The team must also monitor the generator for an imbalance in voltage.\n    If any conditions exist, reduce power to a known safe position and notify the IHT. The IHT Should then notify Germany through a ticket.\n\n    Bridged pole shoe whilst at rated power:\n    It could be that a commercial decision needs to be made to put the turbine back to rated power. Lack or resource ( Material or manpower) to replace\n    however mounting pressure is applied by the customer to achieve rated power.\n\n    Julian my Sanction this on a commercial basis, but ensure the risks are made clear.\n    Under ticket: 70092193, Rated power can be achieved whilst the team observe tower for oscillations and vibrations. The team must also monitor the\n    generator for an imbalance in voltage, if any of these apply then reduce the generator output. However the important risk to highlight is that in carrying\n    out this piece of work, the remaining pole shoes will undergo an accelerated aging process as the rotor runs hotter.\n\n    Only to be carried out in exceptional circumstances.\n\nUseful list of parts for Pole Shoe replacement, Feel free to add to/change it\n\n4159     Lifting eye\n8563     Threaded bolt M12x115                            10\n7176     Connector butt 25mm\n172707 Pole shoe G82/30-G4 PT100/PTC160\n123494 pole shoeE48-G2 6,7x3,55 350 PT100PTC140","o":"Pole shoe Bridging\n24 January 2018 15:57\nAdditional details outside of Limit value list.\nBridge 1 pole shoe only:\nLimit value stipulates 1 pole shoe bridged then a limitation of 75% rated power needs to be applied.\nBridge multiple pole shoes:\nThere is no maximum figure in the limit values list however no more than: Up to 5 pole shoes can be bridged but only for a MAX of 10 days.\nWe do not have a limit value for more than 2 pole shoes, because of the position of the defect pole shoe is important.\nFor Example, if the pole shoes are next to each other we'll have a big \"Magnetic hole\" which will lead to the turbine shaking or cause a fault condition.\nIf a team bridge multiple pole shoes they must notify the IHT which system each is on and which pole shoe. The team then gradually ramp up the power of\nthe turbine, observing tower for oscillations and vibrations. The team must also monitor the generator for an imbalance in voltage.\nIf any conditions exist, reduce power to a known safe position and notify the IHT. The IHT Should then notify Germany through a ticket.\nBridged pole shoe whilst at rated power:\nIt could be that a commercial decision needs to be made to put the turbine back to rated power. Lack or resource ( Material or manpower) to replace\nhowever mounting pressure is applied by the customer to achieve rated power.\nJulian my Sanction this on a commercial basis, but ensure the risks are made clear.\nUnder ticket: 70092193, Rated power can be achieved whilst the team observe tower for oscillations and vibrations. The team must also monitor the\ngenerator for an imbalance in voltage, if any of these apply then reduce the generator output. However the important risk to highlight is that in carrying\nout this piece of work, the remaining pole shoes will undergo an accelerated aging process as the rotor runs hotter.\nOnly to be carried out in exceptional circumstances.\nUseful list of parts for Pole Shoe replacement, Feel free to add to/change it\n123068 1 PC pole shoe E30/3.30 cp!.Pt100/PTC140\n141338 1 KG resin 2K Araldit® F (Komp.A)ikg\n141339 1 KG resin 2K Harter HY956 (Komp.B)O,2ke\n93816 10 PC hexagon nut ISO4032 M12 10HDG\n13067 10 PC threaded bolt DIN976 B M12x0100 10.9HDG\n15147 1 M Polyester tape 20mm -resin oxidered-\n27173 1 M adhesive tape KAPTON- 19mm\n8278 1 PC bucket, plastic 1L\n580866 10 PC connector butt- 25 mm? Euro-Serie\n4159 | Lifting eye\n8563 Threaded bolt M12x115 10\n7176 Connector butt 25mm\n172707 | Pole shoe G82/30-G4 PT100/PTC160\n123494 | pole shoeE48-G2 6,7x3,55 350 PT100PTC140","im":["shared_fault_info_1_213"],"k":""},{"i":148,"c":"Faults","s":"Descriptive","t":"Rectifer incorrect address","d":"09 August 2019","f":"shared fault info 1.pdf","p":[214],"r":"","b":"The rectifiers should recognise their locations through DIP switches ref to commissioning document.\n\nIf for whatever reason the PCB's fail to take the correct address go to..\n\nMain menu you can use the grey keys to set 1.1 or 1.2.","o":"Rectifer incorrect address\n09 August 2019 13:25\nThe rectifiers should recognise their locations through DIP switches ref to commissioning document.\nIf for whatever reason the PCB's fail to take the correct address go to..\nMain menu you can use the grey keys to set 1.1 or 1.2.\nRECTIFIER RM\nSYSTEM: 1.1","im":["shared_fault_info_1_214"],"k":""},{"i":149,"c":"Faults","s":"Descriptive","t":"Rectifier issues","d":"04 March 2021","f":"shared fault info 1.pdf","p":[215],"r":"","b":"  Rectifier\nshunt and...","o":"","im":[],"k":""},{"i":150,"c":"Faults","s":"Descriptive","t":"Ref Ticket Self Supply - Yaw clamping","d":"20 December 2018","f":"shared fault info 1.pdf","p":[216,217],"r":"","b":"Germany have given a speedy answer for the Ben Aketil Yaw clamping issue.\nAfter a discussion with Zack we believe the case for this site that the WEC’s were left permanently wired to the Generator out of fear of the winds dropping. So as per the below the loss of yaw\nclamping can be expected.\n\n20. December 2018 | 16:22 | Andre Rabenstein | Info by Second-Level\nHi Marc,\nsorry for the late response.\nIf the WEC will supplied by an emergency generator, in that case the clamping will be deactivated because the clamping needs to much energy.\nIf the WEC is in self supply mode the yaw clamping is still activated.\nBut in self supply mode the clamping is reduced to the half of the yaw clamping speed.\nIn that case the WEC has to be reduced too 15 rpm.\nThe control system will reduce the rpm of the yaw clamping automatically if the self supply is activated on IO Board 1 CC and the WEC is in self supply operation.\n\nHave the WEC been supplied via self supply or emergency generator?\n________________________________________\n04. March 2018 | 11:27 | Marc Dewing | Problem Description\nFor our UK site Ben Aketil, (SCADA 2938) it was found that recently when these turbines were placed in Self supply (Due to a grid issue) the self supply function would disable the Yaw clamping\nand so the WEC's would rock back and forth on the gear backlash\nCan it be identified if this is a fault? or if the turbine function is correct?\n\nSetting of Blade angle.\nThursday, July 21, 2016   10:15 AM\n\nQuestioned about \"s-e-01-ger-eng-07-017 Rev000 Blade angle alignment at 0°\"\nThe team were struggling with further details on how to set up the blade angle when there was no ref to what the blade angle actually is.\n\nFound the further information required within. TD-esc-07-de-en-11-016 Rev002 Replacing compact limit switch - see Sect 4.3","o":"Self Supply - Yaw clamping Ref Ticket\n20 December 2018 15:46 ESC Ticket: 70008898, Self supply mode - Yaw clamping\nGermany have given a speedy answer for the Ben Aketil Yaw clamping issue.\nAfter a discussion with Zack we believe the case for this site that the WEC’s were left permanently wired to the Generator out of fear of the winds dropping. So as per the below the loss of yaw\nclamping can be expected.\n20. December 2018 | 16:22 | Andre Rabenstein | Info by Second-Level\nHi Marc,\nsorry for the late response.\nIf the WEC will supplied by an emergency generator, in that case the clamping will be deactivated because the clamping needs to much energy.\nIf the WEC is in self supply mode the yaw clamping is still activated.\nBut in self supply mode the clamping is reduced to the half of the yaw clamping speed.\nIn that case the WEC has to be reduced too 15 rpm.\nThe control system will reduce the rpm of the yaw clamping automatically if the self supply is activated on IO Board 1 CC and the WEC is in self supply operation.\nyaw clamping: RM\nn(diff)= 30rpm\nHave the WEC been supplied via self supply or emergency generator?\n04. March 2018 | 11:27 | Marc Dewing | Problem Description\nFor our UK site Ben Aketil, (SCADA 2938) it was found that recently when these turbines were placed in Self supply (Due to a grid issue) the self supply function would disable the Yaw clamping\nand so the WEC's would rock back and forth on the gear backlash\nCan it be identified if this is a fault? or if the turbine function is correct?\nSetting of Blade angle.\nThursday, July 21, 2016 10:15 AM\nQuestioned about \"s-e-01-ger-eng-07-017 Rev000 Blade angle alignment at 0°\"\nThe team were struggling with further details on how to set up the blade angle when there was no ref to what the blade angle actually is.\nFound the further information required within. TD-esc-07-de-en-11-016 RevO02 Replacing compact limit switch - see Sect 4.3","im":["shared_fault_info_1_216","shared_fault_info_1_217"],"k":""},{"i":151,"c":"Faults","s":"Descriptive","t":"Single zone Wiring diagrams","d":"26 February 2021","f":"shared fault info 1.pdf","p":[218],"r":"","b":"CS82a\n                    Tower              Nacelle        Rotor\n                  CS82a-07-...       CS82a-07-...   CS82a-04...\n\nCS48a E48\n                      CS48a-01-       CS48a-01-     CS48a-01-R\n                      T-V1-07_...     N-V1-07_...   -V1-05 Be...\n\nCs48a E44\n                      CS48a-04-T     CS48a-04-      CS48a-01-R\n                      -V1-00a_...    N-V1-00_...    -V1-05 Be...\n\nCS31a\n                      CS31A02TV       CS31a_02       CS31a_02\n                      100 Berei...   _N-V1_00...     _R_V1_0...","o":"","im":[],"k":""},{"i":152,"c":"Faults","s":"Descriptive","t":"Software will not update - Inverter","d":"13 September 2020","f":"shared fault info 1.pdf","p":[219,220],"r":"","b":"I have seen the same issue come up twice in the last year where the display could not find the\nInverter control boards to update CPU 2. In both cases it was one or more defective Inverter control\nboards. Even though the WECs were running without fault, the full software package was not\nupdated for over 5 years on both sites.\n\nIf you come across this issue here is a quick easy method to find which board/boards are causing the\nproblem. (Credit to John Macneill)\n\nWith the WEC stopped pull the 4 POF connections out from the bottom of all Inverter control boards\nexcept power cabinet 1.\n\nIgnore the multitude of data faults and go to software update page, select Inverter control CPU 2\nand hit start.\n\nThe display should say 1PCB found, if not Inverter control board 1 is defective. Reconnect each\ncabinet one at a time and repeat.\n\nIt is important to make sure the latest software package is installed and investigate any issues during\nmaster maintenance. If anything it leads to further downtime for faults as technicians don’t have\naccess to old software.","o":"Software will not update - Inverter\n13 September 2020 06:45\n| have seen the same issue come up twice in the last year where the display could not find the\nInverter control boards to update CPU 2. In both cases it was one or more defective Inverter control\nboards. Even though the WECs were running without fault, the full software package was not\nupdated for over 5 years on both sites.\nIf you come across this issue here is a quick easy method to find which board/boards are causing the\nproblem. (Credit to John Macneill)\nWith the WEC stopped pull the 4 POF connections out from the bottom of all Inverter control boards\nexcept power cabinet 1.\n\"File ideatitication:\nFETE, gene teres\nfeer 189 oe\nIgnore the multitude of data faults and go to software update page, select Inverter control CPU 2\nand hit start.\nThe display should say 1PCB found, if not Inverter control board 1 is defective. Reconnect each\ncabinet one at a time and repeat.\nIt is important to make sure the latest software package is installed and investigate any issues during\nmaster maintenance. If anything it leads to further downtime for faults as technicians don’t have\naccess to old software.","im":["shared_fault_info_1_219","shared_fault_info_1_220"],"k":""} ck\nback relay from the I/O board.\nThere is a way of permanently deactivating this option.\n1.       Remove the sensor (X7.1B) and relay plug (X8.4B) from the I/O board 2.\n2.       Restart the WEC. The turbine should start.\n3.       Stop the WEC and reinsert the plugs into the I/O board\n4.       Reboot the I/O board by removing power and applying power to the board.\n\nIt is possible to make the IO board forget everything but you need to make sure you have all details\nfrom it saved then you can make it forget:\n\njumper:\njumper is on IO board 1 nacelle. On top of the board next to the display.\nMove jumper to the right.\nwait 5 minutes\nmove jumper to the left again\nDo a software and parameter ajustment to the board.\n->please do IO board downstairs first.","o":"Transformer Deactivation\n13 June 2017 13:04\nhere a description how you can deactivate the transformer in case you haven’t got it yet:\nAll the new E82 turbines coming into the UK have the KNAF transformer option activated in I/O\nboard 2. Up to now the only way of deactivating is to remove the cooling pump sensor and the check\nback relay from the I/O board.\nThere is a way of permanently deactivating this option.\n1. Remove the sensor (X7.1B) and relay plug (X8.4B) from the I/O board 2.\n2. Restart the WEC. The turbine should start.\n3. Stop the WEC and reinsert the plugs into the I/O board\n4 Reboot the I/O board by removing power and applying power to the board.\nIt is possible to make the IO board forget everything but you need to make sure you have all details\nfrom it saved then you can make it forget:\njumper:\njumper is on IO board 1 nacelle. On top of the board next to the display.\nMove jumper to the right.\nwait 5 minutes\nmove jumper to the left again\nDo a software and parameter ajustment to the board.\n->please do IO board downstairs first.\nate\npeerage\nith\nes. xf","im":["shared_fault_info_1_228"],"k":""},{"i":160,"c":"Faults","s":"Descriptive","t":"Transmission/FRT test Failure","d":"07 January 2021","f":"shared fault info 1.pdf","p":[229],"r":"","b":" Transmissi\non test fai...","o":"","im":[],"k":""},{"i":161,"c":"Faults","s":"Descriptive","t":"Voltage present after trip of RCD","d":"04 March 2019","f":"shared fault info 1.pdf","p":[230],"r":"","b":"920034991182\n\nSee notification for corrective action","o":"","im":[],"k":""},{"i":162,"c":"Faults","s":"Descriptive","t":"Water in Basement","d":"03 December 2019","f":"shared fault info 1.pdf","p":[231],"r":"","b":"     Afternoon All\n\n     Further to recent discussions regarding Dowhill it has been identified that there is no defined response to the existence of water in the basement. Going forward the following process will be\n     followed:\n\n • The existence of water in the basement will be identified by a team on site. This will be formally reported by the raising of a near miss.\n • Initially further actions will be dealt with at a pod level.\n • Communications with the customer will take place through normal channels. The customer should be made aware of the following:\n1. The presence of water in the basement is possible risk to the integrity of the turbine an it is advised that the turbine is t urned off.\n2. In order for teams to attend to faults or to assess the water ingress issue a full isolation of the turbine will need to take place.\n3. Once all aspects of which ENERCON are responsible have been assessed and rectified as necessary it is up to the customer to i nvestigate and repair as necessary any site issues.\n4. In order for a team to attend site for any reason and work in the turbine a full isolation will be required and the water rem oved prior to any further work being carried out.\n • At this point operations are empowered to continue with attempting to solve any water ingress issues which are deemed part of our responsibility, i.e. Sealing ducts etc. These works must be\n   done while a full turbine isolation is in place.\n • One all works have been completed under ENERCON’s scope we then to stand back and await the customers actions.\n • In the meantime further works can then be carried out in the normal way however prior to dispatch there must be confirmation from CRC’s that isolations will be in place when the teams are on\n   site. If this is not confirmed the teams to do not attend.\n • Any issues can be escalated through the normal channels.\n\n     These actions are intended to keep our Technicians safe while on the turbine and not seen as actions to safeguard the integri ty of the asset, this is the customers responsibility.\n\n        WEC           Turbine          ESC_UK\n     basement...     Water Ing...     WEC Wat...","o":"","im":[],"k":""},{"i":163,"c":"Faults","s":"Descriptive","t":"Yaw teeth damage","d":"07 January 2021","f":"shared fault info 1.pdf","p":[232],"r":"","b":"In every case a ticket need to be created. For a fast decision it must include the following information:\n\n1. The number of cracked teeth at gear ring and pinion.\n2. Number of broken / missing teeth at gear ring and pinion. Particular breaks get noted in one, - two,- or three-third.\n3. Manufacturer of yaw bearing, yaw gear and yaw motor (pictures of identification plates help a lot)\n\nTo get these information, it will be necessary to clean the entire gear ring and all pinion. The Teeth of the gear ring need to get numbered\n(start from any position).\nCracked teeth, particular breaks and complete breaks at the gear ring get noted in the attached Excel -file...the manufacturer of the\ncomponents as well. Please put the Excel file into the ticket.\nIf a turbine can get in operation again depends on the dimension of damages. Please have a look into the limit value list. Be fore a turbine can\noperate again, you need to work on the damaged teeth:\n\n1. Deformation at damaged teeth need to get removed by grinding with an angle grinder. This will make the interlock possible again.\n2. Remove detached parts of teeth with a hammer or angle grinder.\n3. Replace yaw gear with damaged teeth.\n\nAn Update is not generally necessary. Previously weld repairs have been possible in other countries. The 2nd -level-support will decide if a\nwelding repair or an update need to get done.\n\nPlease prepare the WIOS list in any case to safe time.\n\n Yaw rim\ninspection","o":"","im":[],"k":""},{"i":164,"c":"Faults","s":"E33","t":"Anemometer fault","d":"17 January 2017","f":"shared fault info 1.pdf","p":[233],"r":"","b":"Team struggled with 200/61 fault.\n\nAlthough Voltage measurement was pressent on the IO PCB the turbine could not determine wind\ndirection.\nAfter checking the software description it was evident dip switch 2 should be in the off position\n( TSI6 13-009)\nTurbine then operational.\n\nDip switch 2 to off indicates no anemometer interface board is fitted due to having a cup\nanemometer.","o":"","im":[],"k":""},{"i":165,"c":"Faults","s":"E33","t":"Capacitor testing","d":"20 January 2017","f":"shared fault info 1.pdf","p":[234],"r":"","b":"The picture shows the test ready to be started.\nIf, instead of U=156V, there is text (something like capacitors charged) , the test will not operate.\nAfter pressing the orange button to start the test, you will be taken away from this screen and shown\nthe status for all 3 capacitor banks, either OK or err, will be indicated.\nThe three black buttons at the bottom of the board switch between blades A,B and C.\nThe red light indicating which blade is selected.\nWhen I did the capacitor test this morning, that light extinguished during it, and came back on after it\nwas complete.\nI could not get the screen up to show when the test was not accessible. This is because once you\ncomplete it, as stated above, you get a different screen up. So by the time you navigate back to the\ntest screen, it is ready to go again.\nI think that as there was a problem with 2 resistors last night, blade A was over heating and taking\nmore time to cool down and become ready again.\nBe careful not to confuse this with the capacitor charger test. It is easily done as you are trying to read\nthe screen upside down or at a weird angle, generally with poor lighting.","o":"Capacitor testing\nJanuary 2017 07:28\nThe picture shows the test ready to be started.\nIf, instead of U=156V, there is text (something like capacitors charged) , the test will not operate.\nAfter pressing the orange button to start the test, you will be taken away from this screen and shown\nthe status for all 3 capacitor banks, either OK or err, will be indicated.\nThe three black buttons at the bottom of the board switch between blades A,B and C\nThe red light indicating which blade is selected.\nWhen I did the capacitor test this morning, that light extinguished during it, and came back on after it\nwas complete.\n| could not get the screen up to show when the test was not accessible. This is because once you\ncomplete it, as stated above, you get a different screen up. So by the time you navigate back to the\ntest screen, it is ready to go again.\n| think that as there was a problem with 2 resistors last night, blade A was over heating and taking\nmore time to cool down and become ready again\nBe careful not to confuse this with the capacitor charger test. Itis easily done as you are trying to read\nthe screen upside down or at a weird angle, generally with poor lighting.","im":["shared_fault_info_1_234"],"k":""},{"i":166,"c":"Faults","s":"E33","t":"Capacitor box bushings","d":"16 June 2020","f":"shared fault info 1.pdf","p":[235],"r":"","b":"Cotter pins x4 sap 31916\nWasher x8 sap 31917\nBushings x8 33790\nCap box brackets 1 sap 56853                   E33 rotor\nCap box bracket 2 sap 56854                   box spare...\nBar top sap 33259","o":"","im":[],"k":""},{"i":167,"c":"Faults","s":"E33","t":"Capacitor box Wiring","d":"17 January 2022","f":"shared fault info 1.pdf","p":[236],"r":"","b":"New capacitor boxes are being sent out and may need the following revision to the wiring to
