emperature sensors to the PCB. Using a blank connector rewire:\nPlease find the below menu on the rectifier PCB under Rectifier Settings.                                                      X4.3 & X4.4 to X26.5 & X26.6. Black connectors are possible to find on another PCB.\n\nWe cannot take the phase current higher than this so if the fault still occurs. Please replace the Shunt PCB opto -coupler.\nThe original component has a 5% tolerance whilst the new variant is reduced to 1%\n\nSAP No.1317","o":"3t Date and Tr\nDescrpton 66:XX Over current Phase.\n18 February 2021 13:05\nDescription\n(On some WECS we have had problems with tripped system circult breakers after software update to control board rectifier 2 2.18. We have already forwarded this topic to WRD, unfortunately the cause of this problem has not found yet.\nTo solve this problem we do have only the possibility to perform @ downgrade to the old software controlboard rectifier V1.52. If this problem will appear in association with an installed PCB controlboard rectifier 2 V1.9, the department Electrical engineering\nhas tobe informed\nNote: This isin relation to a fault whilst the turbine is not in operation. Consult 66:XX Fault rectifier\nIf turbine has faulted during operation first.\nOften the turbine will report this faults regardless of operation ( No power production)\nWhat are the Phase differences on the rectifier? A difference of no more the 35A is normal. Note: V1.9 PCB must have software greater than V2.XX\nExchanging shunt pcbs to allow for a more balanced position may be required. If this is not possible with the PCB's\ncurrently installed on the turbine then new PCB's will be required. SAP: 60033\nFault post PCB replacement?\nWhen replacing an older PCB with V1.9. An overcurrent fault may occur.\nAlternatively the next step will be to increase the Phase current diff setting to 50A Carry out rewiring of the temperature sensors to the PCB. Using a blank connector rewire:\nPlease find the below menu on the rectifier PCB under Rectifier Settings. X4.3 & X4.4 to X26.5 & X26.6. Black connectors are possible to find on another PCB.\nPHASE CURR. DIFF\nTHRESH .OFFS.=35A\nv a Enter\nWe cannot take the phase current higher than this so if the fault still occurs. Please replace the Shunt PCB opto -coupler.\nThe original component has a 5% tolerance whilst the new variant is reduced to 1%\nSAP No.1317","im":["shared_fault_info_1_066"],"k":"66:XX"},{"i":42,"c":"Faults","s":"50-99","t":"66:8 Rectifier overcurrent","d":"11 September 2021","f":"shared fault info 1.pdf","p":[67],"r":"","b":"Faulty hygrostat in rectifier cabinet - happened in Bryn Blaen","o":"","im":[],"k":"66:8"},{"i":43,"c":"Faults","s":"50-99","t":"66:21/22 & 23 Isometer sys 1 /2 or both","d":"08 February 2018","f":"shared fault info 1.pdf","p":[68],"r":"","b":"How to diagnose fault.\n\n      Fault\n   details 66...","o":"","im":[],"k":"66:21"},{"i":44,"c":"Faults","s":"50-99","t":"66:31 &32 Malfunction UGR-measurement system 2","d":"16 May 2019","f":"shared fault info 1.pdf","p":[69,70,71,72],"r":"","b":"5.1 Fix for fault message DC link measurement (66:X31, 66:X32)\nIn combination with the software Controlboard Rectifier ≥ V2.00, there have recently been more frequent occurrences\nof fault message “DC link measurement system x”.\nThis fault occurs if the output voltage of the rectifier is not equal to the DC link voltage of the con -verters.\nThis problem was caused by a software-internal fault which has now been fixed.\n\nTD-esc-05-d\ne-de-19-0...\n\n                           Please see Ticket 70031095. It was found that this turbine 783862 the system disconnector had two\n                           failings. First The dissconnector would not charge each time the team manually charged it, it would\n                           discharge instantly.\n                           Second issue was it needed to be switched on but in manual (Not automatic) due to turbine being an\n                           E70 where these are not programed to the I/O PCB's\n\n                           From <https://srv-\n                           crm01.enercon.de/sap(ZT1NREF3TmpRMU5ERmZYMTlmTWpKZk1qRmZBRkJXcEhQSkh1bWdvWnVxamJWSU5RPT0\n                           =)/bc/bsp/sap/crm_ui_frame/BSPWDApplication.do?sap-client=009&sap-language=EN&sap-domainrelax=min>\n\n66:41 Fault rectifier earth fault contact system 1\nThursday, June 02, 2016    9:33 AM\n\nTemplate instructions to send to team.\n\nTemplate -\n66.4X Rec...\n\nHi all.\nI forgot to mention that we have had cases where the earth cable wrapped round the\ngenerator has become damaged and shorted against the generator. This will cause\ninfrequent trips. You will have to visually check the cable all the way round as the slightest\ncontact will cause the turbine to trip.\n\nIB1152- Troubleshooting-silicon-controlled-rectifiers pdf\n\nUsing a resistance check is not ideal in this situation as you will get differences in the resistance readings due to the\nheasink units them self’s.\nI have attached a tutorial how to successfully test “Hocky Puck” Thyristors using the diode tester on your\nmultimeter.\n\n Generator\nFault Find...\n\n66:42 Fault rectifier earth fault contact system 2\nThursday, June 02, 2016    9:33 AM\n\nTemplate instructions to send to team.\n\nTemplate -\n66.4X Rec...\n\nHi all.\nI forgot to mention that we have had cases where the earth cable wrapped round the\ngenerator has become damaged and shorted against the generator. This will cause\ninfrequent trips. You will have to visually check the cable all the way round as the slightest\ncontact will cause the turbine to trip.\n\nIB1152- Troubleshooting-silicon-controlled-rectifiers pdf\n\nUsing a resistance check is not ideal in this situation as you will get differences in the resistance readings due to the\nheasink units them self’s.\nI have attached a tutorial how to successfully test “Hocky Puck” Thyristors using the diode tester on your\nmultimeter.\n\n Generator\nFault Find...\n\n    66:43 Fault rectifier earth fault contact system 1&2\n    Thursday, June 02, 2016    9:33 AM\n\n    Template instructions to send to team.\n\n    Template -\n    66.4X Rec...\n\nHi all.\nI forgot to mention that we have had cases where the earth cable wrapped round the\ngenerator has become damaged and shorted against the generator. This will cause\ninfrequent trips. You will have to visually check the cable all the way round as the slightest\ncontact will cause the turbine to trip.\n\nIB1152- Troubleshooting-silicon-controlled-rectifiers pdf\n\nUsing a resistance check is not ideal in this situation as you will get differences in the resistance readings due to the\nheasink units them self’s.\nI have attached a tutorial how to successfully test “Hocky Puck” Thyristors using the diode tester on your\nmultimeter.\n\n Generator\nFault Find...","o":"","im":[],"k":"66:31"},{"i":45,"c":"Faults","s":"50-99","t":"66:51/52 Rectifer overtemp","d":"01 February 2018","f":"shared fault info 1.pdf","p":[73],"r":"","b":"Fault: sensor reading bouncing between -28 and 98 Just after PCB update.\nSolution: PCB V1.9 must have software greater than V2.XX","o":"","im":[],"k":"66:51"},{"i":46,"c":"Faults","s":"50-99","t":"66:91 Unknown status","d":"13 September 2018","f":"shared fault info 1.pdf","p":[74],"r":"","b":"When commissioning Brenig, the turbine has fault 66:91. This would prevent the turbine being able to run in Self supply.\nThis would also prevent a turbine from running in operation.\n\nThe issue was caused by a loss of data at the rectifier pcb.\n\nIf the rectifier software is >V2.18 then you have to manually tell the rectifier what it is attached to\n\n   • Turbine type\n   • Amount of inverters installed\n\nOnce this is done then the fault will disappear. Note this has to be done at the rectifier, it can not be done remotely.\nPlease see software description below.\n\nTD-esc-06-de-en-18-030 Rev000a Control Board Rectifier E-112 V2.18\n5.1 - Introduction of a new parameter: Article number\nDue to the increasing number of versions and the corresponding dependencies of the connected\nperipherals, the number of parameters to be configured has also increased. Most of these parameters\nare directly dependent on the assembly (rectifier cabinet) in which the control board is operated. By\nintroducing the article number as a new parameter we have been able to reduce the total number of\nadjustments required, thus limiting the chances of misconfiguration.\nThe following articles are supported and can be configured:\n18354, 37665, 68580, 79914, 79915, 90911, 92793, 92795, 103625, 506387, 90912, 92794, 92796,\n103627, 506389, 108015, 646858, 108017, 520569, 589976, 589978, 587424, 600001, 600004, 600009.\nIn addition to this, rectifiers that are operated on control systems CS70, CS66 and CS58 and already had\nsoftware support are also supported. Due to the commonalities in their control systems, these can all be\nselected using FOR CS58/66/70. This applies to cabinet types 5256, 37665, 68580 and 18354.\nParameter configuration must be carried out once during putting into service of each board. This usually\ntakes place during functional checks at the factory, installation following PCB replacement or a software\nupdate from ≤ V1.52 to ≥ V2.05.\nThe key determiner is the article number, which is usually marked inside the rectifier cabinet.\n\n5.15 - No WEC power generation in case of incorrect software settings\nFollowing installation of the Rectifier V2.05 test software the installed rectifier article number needed to\nbe set. If this setting was not made, the WEC would start up with Status 0:0 but not generate any power.\nNow, if the article number is not correctly configured, the Control Board Rectifier immediately issues\nStatus 66:x91 (rectifier configuration error) and does not begin operation.\n\nPlease note: the two rectifier cabinets are likely to have differing Article numbers so double check","o":"","im":[],"k":"66:91"},{"i":47,"c":"Faults","s":"50-99","t":"66:92 Unknown status","d":"15 November 2018","f":"shared fault info 1.pdf","p":[75],"r":"","b":"See 66:91","o":"","im":[],"k":"66:92"},{"i":48,"c":"Faults","s":"50-99","t":"70:XX Generator overtemp","d":"20 January 2018","f":"shared fault info 1.pdf","p":[76,77],"r":"","b":"                                                           TD-esc-01-de-en-15-002 Rev001 Rewiring stator temperature sensor\n\nWhen this turbine has no sub-distribution box for stator temperatures (SAP 81879) the spare sensors should be in an\nextra tubing at around 11 or 1 o'clock on the copper overhang on the machine house side.\n\nAnother option is, that the reserve temperature sensors are laying unconnected in the sub-distribution box you\nmentioned.\n\n        Temperature monitoring: With PTC Sensors series\n        Possible cause\n        Defect temperature sensor (PTC/PTI 00)\n        Loose connection\n        Insufficient cooling\n        Defect board\n\n        Possible repair method\n        Conntect back-up sensor\n        Check/exchange sensor cable","o":"70:XX Generator overtemp\n20 January 2018 15:32\nTD-esc-01-de-en-15-002 Rev001 Rewiring stator temperature sensor\nWhen this turbine has no sub-distribution box for stator temperatures (SAP 81879) the spare sensors should be in an\nextra tubing at around 11 or 1 o'clock on the copper overhang on the machine house side.\nAnother option is, that the reserve temperature sensors are laying unconnected in the sub-distribution box you\nmentioned.\nTemperature monitoring: With PTC Sensors series\nPossible cause\nDefect temperature sensor (PTC/PTI 00)\nLoose connection\nInsufficient cooling\nDefect board\nPossible repair method\nConntect back-up sensor\nCheck/exchange sensor cable","im":["shared_fault_info_1_076","shared_fault_info_1_077"],"k":"70:XX"},{"i":49,"c":"Faults","s":"50-99","t":"71:XX Insulation monitoring","d":"18 September 2020","f":"shared fault info 1.pdf","p":[78],"r":"","b":"Monitoring the generator phase, Analysis for fault current     S71.x0x\nWEC stop and grid disconnection with total current fault     insulation ...\n\nPossible cause\nGenerator damage\nDefect current transducer\nDefect board\nLoose connection\nDefect varistor\n\nPossible repair method\nGenerator inspection\nExchange board\nGenerator repair\nRenew generator connection","o":"71:XX Insulation monitoring\n18September 2020 13:34\nMonitoring the generator phase, Analysis for fault current S71.x0x\nWEC stop and grid disconnection with total current fault insulation ...\nOvervoltage protection Current transducer\nStair point\nPossible cause\nGenerator damage\nDefect current transducer\nDefect board\nLoose connection\nDefect varistor\nPossible repair method\nGenerator inspection\nExchange board\nGenerator repair\nRenew generator connection","im":["shared_fault_info_1_078"],"k":"71:XX"},{"i":50,"c":"Faults","s":"50-99","t":"72:XX Airgap monitoring","d":"20 February 2018","f":"shared fault info 1.pdf","p":[79,80],"r":"","b":"                                                        One of the main issues that were seeing on CS48a turbines is the tab washer of the bearing not becomes\n                                                        deformed and then the nut comes loose. Please see below details for repair.\n\n   • Always the same sensor?\nPossible cause\nLoose connection in sensor cable\nRotor not centric\nStator with confined space\n\nPossible repair method\nCheck sensor and cable\nAir gap measurement with V2 measurement tool\nGenerator alignment\n\n   • Status only with nominal power?\nPossible cause\nRotor thermal expansion is faster than stator thermal expansion (Liquid cooling? Noise optimization?)\nBad generator alignment\n\nPossible repair method\nCheck cooling parameters\nGenerator air sealing\nAir gap measurement with V2 measurement tool\nGenerator alignment\n\n   • Several sensor at once or directly after each other?\nPossible cause\nForeign object in air gap\nRotor fitting gap sloping\nMovement within rotor and stator\n\nPossible repair method\nCheck air gap for foreign objects\nAir gap measurement with V2 measurement tool\nCheck movement with test excitation","o":"72:XX Airgap monitoring\n20 February 2018 15:27\nOne of the main issues that were seeing on CS48a turbines is the tab washer of the bearing not becomes\ndeformed and then the nut comes loose. Please see below details for repair.\n\"TD-esc-07-de-en-17-004 Rev00) Rolling- element bearings and fiction besrings.paf - Adobe Reader\n4.2 Replacing front main bearing in E-40 to E-53\n1 Special tool, rotor bearing preloading, E40-E53\n1 Axle nut TR 220x4 EP101001-0 (axle nut with built-in locking device)\nHex. bolt |S04017 M08x020 8.8tZn\n8 Washer HLB-8\n* Always the same sensor?\nPossible cause\nLoose connection in sensor cable\nRotor not centric\nStator with confined space\nPossible repair method\nCheck sensor and cable\nAir gap measurement with V2 measurement tool\nGenerator alignment\n+ Status only with nominal power?\nPossible cause\nRotor thermal expansion is faster than stator thermal expansion (Liquid cooling? Noise optimization?)\nBad generator alignment\nPossible repair method\nCheck cooling parameters\nGenerator air sealing\nAir gap measurement with V2 measurement tool\nGenerator alignment\n* Several sensor at once or directly after each other?\nPossible cause\nForeign object in air gap\nRotor fitting gap sloping\nMovement within rotor and stator\nPossible repair method\nCheck air gap for foreign objects\nAir gap measurement with V2 measurement tool\nCheck movement with test excitation\n66889\n645733\n124\n645757","im":["shared_fault_info_1_079","shared_fault_info_1_080"],"k":"72:XX"},{"i":51,"c":"Faults","s":"50-99","t":"73:2 Torque monitoring : Peak load","d":"20 December 2018","f":"shared fault info 1.pdf","p":[81,82,83],"r":"","b":"          Template instructions to send to team.\n\n          Template -\n          73.2 Torq...\n\n    Reference Ticket :\n\n    Check list for team inspection.\n      1. Check filter cabinets and that fuses are greased.\n      2. Check rectifier, generator, surge protectors for signs of damage.\n      3. Carry out insulation checks of stator windings both between systems and against earth. (Provide results) TD-esc-01-de-en-14-032 Rev002 Generator measurements\n      4. Check of cabling between all of the above.\n      5. Checked function of torque monitoring sensor\n      6. Check function of Smoke detectors .\n      7. Check Storm control on and settings correct\n      8. Check alignment of Anemometer\n\n    A near miss is required for every fault occurrence.\n    Do not start WEC. Consult with IHT as ESC Electrical engineering advice will be required prior to start up.\n\n                  Category 2       Subject\n    Notes Link ESC-HSE Warning / Warnung\n\nChecking the torque monitoring system. Info from commissioning document.\n\nThe acceleration sensor is highly sensitive to shocks! Hold\nthe acceleration sensor level. Status 73:12 Signal too\nsmall will be generated if the acceleration sensor’s output\nvoltage is ≤ 1.9 V for more than 20 seconds. Status 73:13\nSignal too large will be generated if the output voltage\nis ≥ 3.4 V for more than 20 seconds.\n\n1. Make sure the Manual/Automatic switch has been set so that the\nManual on indicator light is on.\n2. Insert the torque monitoring system plug into the sensor.\n3. Go to Torque monitoring in the General data menu on Nacelle\nI/O Board 1.\n4. Remove the acceleration sensor from the torque monitoring system\nand move it from side to side.\n➥ In the Torque monitoring menu item, the peak load\ncounter and the maximum counter count up.\n5. Properly fit the torque monitoring acceleration sensor.\n6. Reset the maximum counter.\n7. On Nacelle I/O Board 1, go to the Sensor data menu.\n8. Check if the output voltage displayed for analogue input 1: X5.1 of\nthe torque monitoring system is 2.5 V ± 0.1 V.\n\nChecking the transversal and longitudinal acceleration sensors\nThe acceleration sensor responds when moved from side to side on an imaginary line\nbetween the fastening bolts. The transversal / longitudinal acceleration sensor’s\noutput voltage can be modified by slightly adjusting its bracket or the sensor itself.\n\n1. Go to the Sensor data menu on Nacelle I/O Board 1 in the nacelle control cabinet.\n2. Check the displayed output voltages of the acceleration sensors:\n\n3. Pull the plug of the transversal acceleration sensor and check the voltages:\n\n4. Connect the plug on the transversal acceleration sensor.\n\nSubject    RE: Safety Warning - Conduct in the event of status 73-2\n\nSubject     RE: Safety Warning - Conduct in the event of status 73-2\nFrom        Karl Sollis\nTo          Marc Dewing\nCc          &UK-Technical\nSent        18 December 2018 11:52\n\nMarc,\n\nI want a Near Miss for every fault but it is for the Technician to complete not IHT. As you would potentially stop the WEC\na Team needs to attend site, investigate & check the WEC systems as per the Warning.\n\nWhat I want to do is give ESC a picture of what we are finding as a result of the 73 -2 status i.e. no fault or smoke etc\n\nKarl\n\nKarl Sollis\nHealth & Safety Manager\nMob: 07825980524\nTel: 01480 415839\nE-mail: karl.sollis@enercon.de\n\nFrom: Marc Dewing <Marc.Dewing@enercon.de>\nSent: 18 December 2018 07:43\nTo: Karl Sollis <karl.sollis@enercon.de>\nCc: &UK-Technical <technical-uk@domino.enercon.de>\nSubject: RE: Safety Warning - Conduct in the event of status 73-2\n\nGood morning Karl,\n\nCan you confirm if a near miss is required for every fault, or only when a team are on site? ( Glasgow have a fault this\nmorning )\n\nWith regards / Mit freundlichen Grüßen\n\nMarc Dewing\nIn House Technical Electrical\n\nENERCON Services UK Ltd.\nMace House,\n3 Sovereign Court,\nErmine Business Park,\nHuntingdon\nPE29 6XU\n\nwww.enercon.de\n\nFrom: Karl Sollis\nSent: 13 December 2018 20:07\nTo: &SI-Installationteams-UK; &SI-Serviceteams-UK; Anna de Fortuna; Anthony Waslin; Antonios Loukas; Barry O\nDocherty; Bhavna Makwana; Candida Neves; Catriona Walsh; Chris Allan; Christoph Klimek; Christopher Hughes;\nChristopher Rogers; Colin Brown; Craig Durrans; Dave Russell; Emma Pledger; Erwin Lechner; ESC-HSE; Frederika Eades;\nGennady Maniquiz; Hannah Thorp; Henri Snijder; Hinai Proudfoot; Ian Bird; Ilkka Korppi; James Hughes; Jason O\nRourke; Jerry Johansson; John Hart; John Houlding; Julian Martin; Kelly Horn; Laura Collin; Lesley Pullar; Marc Curadeau;\nMarc Dewing; Matthew Ainley; Michelle Miller; Natalie Phillips; Nicola Miller; Paul Govers; Peter Archer; Richard Thomas;\nRichard Wallace; Sarah Hobbs; Shane Rowland; Shane Willmott; Steve Harrison; Sven Dressler; Tatjana Dreimane;\nThomas Hosegood; Tim Daynes; Tricia Eaton; Victoria Gilbert; Wendy Dodson; Willi Schulz\nSubject: FW: Safety Warning - Conduct in the event of status 73-2\n\nHi,\n\nPlease see attached the HSE Warning from the ESC GmbH Health & Safety Department.\n\nIf status 73-2 is experienced then ensure that a Near Miss is completed & sent to the Health & Safety Department.\n\nKarl\n\nKarl Sollis\nHealth & Safety Manager\nMob: 07825980524\nTel: 01480 415839\nE-mail: karl.sollis@enercon.de\n\nFrom: Insa Franken <insa.franken@enercon.de> On Behalf Of ESC-HSE\nSent: 13 December 2018 13:56\nTo: &HSE-Sicherheitswarnungen-EN <&HSE-Sicherheitswarnungen-EN-Notes@domino.enercon.de>\nSubject: Safety Warning - Conduct in the event of status 73-2\n\nHello everyone,\n\nplease find attached a safety warning concerning the topic \"Conduct in the event of status 73 -2\".\nThis document was sent to all German speaking ESC employees.\n\nAddress any questions or issues regarding this HSE warning to Technical Service Dispatch.\nIf necessary, they can contact the ESC Electrical Engineering department.\n\nThe respective service companies are responsible to forward the safety warning to external service providers that they\nhave contracted.\nCustomers and operators are informed by the Customer Relation Department.\n\nThe local Service Managers have to make the decision whether this safety warning shall also be sent out in their\nrespective country.\nIf so, then they have to manage who may forward it to the affected areas and whether a translation in the email text is\nrequired.\n\nSafety warnings are saved in the ISI database under the chapter 04-Occupational Health and Safety - here is the link:\n\n                Category 2              Subject\nNotes Link ESC-HSE Warning / Warnung\n\nHealth-Safety-ESC Team\n\nENERCON Service Center\nGewerbestraße 56\n26624 Südbrookmerland/ Germany\nPhone: +49 (0)4942 6569-456\nFax:      +49 (0)4942 6569-25371\nmail to: esc-hse@enercon.de\nhttp://www.enercon.de\n\nDiese E-Mail und mögliche Anhänge enthalten vertrauliche Informationen, die rechtlich besonders\ngeschützt sein können. Wenn Sie nicht der beabsichtigte Empfänger bzw. Adressat dieser E-Mail sind\nund diese E-Mail etwa aufgrund eines technischen Fehlers oder eines Versehens erhalten haben,\ninformieren Sie uns bitte sofort und löschen Sie anschließend die E-Mail. Das unbefugte Kopieren\ndieser E-Mail, etwaiger Anhänge sowie die unbefugte Weitergabe der enthaltenen Informationen an\nDritte ist nicht gestattet.\nThis e-mail message together with its attachments, if any, is confidential and may contain information\nsubject to legal privilege (e.g. attorney-client-privilege). If you are not the intended recipient or have\nreceived this e-mail in error, please inform us immediately and delete this message. Any unauthorised\ncopying of this message (and attachments) or unauthorised distribution of the information contained\nherein is prohibited.\nENERCON Service Deutschland GmbH | Sitz: Dornumer Straße 20, 26607 Aurich | Registergericht:\nAmtsgericht Aurich, HRB 1921 | Geschäftsführer: Dipl.-Betriebswirt Volker Kendziorra, Michael\n\nAmtsgericht Aurich, HRB 1921 | Geschäftsführer: Dipl.-Betriebswirt Volker Kendziorra, Michael\nHölscher","o":"73:2 Torque monitoring : Peak load\n20December 2018 11:50\n‘Template instructions to send to team.\nol\nTemplate ~\n73.2 Torq...\n+ Alert Details\niption: Status message 732 - “Torque Monitoring : Peak Load” Sent Date and 7\nne: 03122098 17:33\nRead Expraton Date 311220192359\nTimm Mross\nDescription\nIt's strictly not permitted to reset the status 73:2 - “torque monitoring: load peaks” via SCADA or locally unless the exact cause is known. A cause of 73:2 status can be serious\ngenerator damage. In the worst case scenario, the WEC can cause a fire failure if restarted. A manual start of the generator heating is also not allowed, if the status 73:2 was\ngenerated.\nItis essential to perform a troubleshooting. If the cause can not be clarified, the wind turbine may not be put into operation without consulting the department ESC-Electrical\nEngineering.\nReference Ticket\nESC Ticket: 70023298, 73:2 Torque Monitoring peak load 482043\nCheck list for team inspection\n1. Check filter cabinets and that fuses are greased\n. Check rectifier, generator, surge protectors for signs of damage.\n. Carry out insulation checks of stator windings both between systems and against earth. (Provide results) T-esc-01-de-en-14-032 Rev002 Generator measurements\nCheck of cabling between all of the above.\n. Checked function of torque monitoring sensor\nCheck function of Smoke detectors.\n/. Check Storm control on and settings correct\n|. Check alignment of Anemometer\nPNOVEYN\nAnnear miss is required for every fault occurrence.\nDo not start WEC. Consult with IHT as ESC Electrical engineering advice will be required prior to start up,\n[ [eatesony? sabe\nESC-HSE Warning / Warnung\n‘Checking the torque monitoring system. Info from commissioning document.\n‘The acceleration sensor is highly sensitive to shocks! Hold\nthe acceleration sensor level. Status 73:12 Signal too\n‘small will be generated if the acceleration sensor’s output\nvoltage is < 1.9 V for more than 20 seconds. Status 73:13\nSignal too large will be generated if the output voltage\nis 2 3.4V for more than 20 seconds.\n1. Make sure the Manual/Automatic switch has been set so that the\nManual on indicator light is on.\n2. Insert the torque monitoring system plug into the sensor.\n3. Go to Torque monitoring in the General data menu on Nacelle\n1/0 Board 1.\n4, Remove the acceleration sensor from the torque monitoring system\n‘and move it from side to side.\nIn the Torque monitoring menu item, the peak load\ncounter and the maximum counter count up.\n5. Properly fit the torque monitoring acceleration sensor.\n6. Reset the maximum counter.\n7. On Nacelle I/O Board 1, go to the Sensor data menu.\n8 Check if the output voltage displayed for analogue input 1: XS.1 of\nthe torque monitoring system is 2.5 V#0.1V.\nChecking the transversal and longitudinal acceleration sensors\nThe acceleration sensor responds when moved from side to side on an imaginary line\nbetween the ng bolts. The Jong sensor's\n‘output voltage can be modified by slightly adjusting its bracket or the sensor itself,\n1. Go to the Sensor data menu on Nacelle /O Board 1 in the nacelle control cabinet.\n2. Check the displayed output voltages of the acceleration sensors:\n‘Acceleration sensor Analog input Target value\nTransversal accelera- 2: X5.2 25V40.1V\ntion sensor\nLongitudinal acceler- 3: X5.3 25V201V\nation sensor\n3. Pull the plug of the transversal acceleration sensor and check the voltages:\n‘Acceleration sensor Analog input Target value\nTransversal accelera- 2: X5.2 s0AV\ntion sensor\nLongitudinal accel\nation sensor\n4, Connect the plug on the transversal acceleration sensor.\n3:X5.3 25V201V\nSubject _| RE: Safety Warning - Conduct in the event of status 73-2\nFrom | Kar Solis\nTo | Mare Dewing\nce | Buk-Technical\nSent [18 December 2018 1:52\nMarc,\n| want a Near Miss for every fault but itis for the Technician to complete not IHT. As you would potentially stop the WEC\na Team needs to attend site, investigate & check the WEC systems as per the Warning.\n‘What | want to do is give ESC a picture of what we are finding as a result of the 73-2 status ie. no fault or smoke ete\nKarl\nKarl Solis\nHealth & Safety Manager\nMob: 07825980524\nTel: 01480 415839\nE-mail: karl sollis@enercon.de\nFrom: Marc Dewing <Marc.Dewing@enercon.de>\nSent: 18 December 2018 07:43\nTo: Karl Sollis <karl sollis@enercon.de>\nCe: &UK-Technical <technical-uk@domino.enercon.de>\nSubject: RE: Safety Warning - Conduct in the event of status 73-2\nGood morning Karl,\nCan you confirm if a near miss is required for every fault, or only when a team are on site? ( Glasgow have a fault this,\nmorning )\nWith regards / Mit freundlichen Gren\nMare Dewing\nIn House Technical Electrical\nFi ENERCO!\nSeRVICES UF\nENERCON Services UK Lid.\nMace House,\n3 Sovereign Court,\nErmine Business Park,\nHuntingdon\nPE29 6XU\nwamw.enercon.de\nFrom: Karl Solis\nSent: 13 December 2018 20:07\nTo: &SI-Installationteams-UK; &SI-Serviceteams-UK; Anna de Fortuna; Anthony Wasiin; Antonios Loukas; Barry O\nDocherty; Bhavna Makwana; Candida Neves; Catriona Walsh; Chris Allan; Christoph Klimek; Christopher Hughes;\nChristopher Rogers; Colin Brown; Craig Durrans; Dave Russell; Emma Pledger; Erwin Lechner; ESC-HSE; Frederika Eades;\nGennady Maniquiz; Hannah Thorp; Henri Snijder; Hinai Proudfoot; Ian Bird; IIkka Korppi; James Hughes; Jason O\nRourke; Jerry Johansson; John Hart; John Houlding; Julian Martin; Kelly Horn; Laura Collin; Lesley Pullar; Marc Curadeau;\nMarc Dewing; Matthew Ainley; Michelle Miller; Natalie Philips; Nicola Miller; Paul Govers; Peter Archer; Richard Thomas;\nRichard Wallace; Sarah Hobbs; Shane Rowland; Shane Willmott; Steve Harrison; Sven Dressler; Tatjana Dreimane;\n‘Thomas Hosegood; Tim Daynes; Tricia Eaton; Victoria Gilbert; Wendy Dodson; Willi Schulz\n‘Subject: FW: Safety Warning - Conduct in the event of status 73-2\nHi,\nPlease see attached the HSE Warning from the ESC GmbH Health & Safety Department.\nIf status 73-2 is experienced then ensure that a Near Miss is completed & sent to the Health & Safety Department.\nKarl\nKarl Solis\nHealth & Safety Manager\nMob: 07825980524\nTel: 01480 415839,\nE-mail: karl sollis@enercon.de\nFrom: Insa Franken <insa franken@enercon.de> On Behalf Of ESC-HSE\nSent: 13 December 2018 13:56\nTo: BHSE-Sicherheitswarnungen-EN <&HSE-Sicherheitswarnungen-EN-Notes@domino.enercon.de>\nSubject: Safety Warning - Conduct in the event of status 73-2\nHello everyone,\nplease find attached a safety warning concerning the topic \"Conduct in the event of status 73-2\".\nThis document was sent to all German speaking ESC employees.\nAddress any questions or issues regarding this HSE warning to Technical Service Dispatch.\nIf necessary, they can contact the ESC Electrical Engineering department.\nThe respective service companies are responsible to forward the safety warning to external service providers that they\nhave contracted.\nCustomers and operators are informed by the Customer Relation Department.\nThe local Service Managers have to make the decision whether this safety warning shall also be sent out in their\nrespective country.\nIf so, then they have to manage who may forward it to the affected areas and whether a translation in the email text is\nrequired.\nSafety warnings are saved in the ISI database under the chapter 04-Occupational Health and Safety - here isthe link\n[ [estesony2? subject\nNotes Link | ESC-HSE Warning / Warnung\nHealth-Safety-ESC Team\nepee Fi ENERCON\nENERGY FOR THE WORLO|\nENERGON Service Center\nGewerbestrae 56\n26624 Sidbrookmertand! Germany\nPhone: +49 (0)4942 6569-456\nFax: +49 (0}4942 6569-25371\nmail to: esc-hse@enercon.de\nhitp-shwaw.enercon.de\nDiese E-Mail und magliche Anhinge enthalten vertrauliche Informationen, die rechtich besonders\nDt istrict estate\n‘This e-mail message together with ils allachments, Fany, is confidential and may contain information\nsubject to lagal prviege (e.g attomey-clentpevilega). I you are not the infended recipient or have\n‘ecaived this e-mal in ertor, please inform us mmeciaialy and delete this message. Any unauthorised\ncopying ofthis message (and attachments) or unauthorised cstibtion ofthe information contained\nherein s prohibited\nENERGON Service Deuischiand GmbH | Sitz Dornumer State 20, 26607 Aurich | Registergercht\n‘Amlogericht Aurich, HRE 1921 | Geschaltefiter: Dipl -Betrebewit Volker Kendzorra, Michael\nHolscher","im":["shared_fault_info_1_081","shared_fault_info_1_082","shared_fault_info_1_083"],"k":"73:2"},{"i":52,"c":"Faults","s":"50-99","t":"76:1 76:2 Bearing overtemp","d":"08 March 2017","f":"shared fault info 1.pdf","p":[84],"r":"","b":"One issue causing the Bearing overtemp faults are the 95:1 Error measurement. If there is no plausible fault with the Bearing temp\nsensors then investigate the spinner. Please see TSI 01 - 04-027 for incorrect installation of this.\n\nIf temperature difference is greater than 40 degrees between spinner and bearing this fault code will trigger","o":"76:1 76:2 Bearing overtemp\n08 March 2017 11:27\n17:37:14 |76:2 Bearing temperature : Overtemp. rear bearing 6 16:01:17\n17:31:09 |0:0 Turbine in operation 1 00:06:05\n17:30:05 |0:1 Turbine starting 1 00:01:04\n17:27:42 |0:2 Turbine operational 1 00;02:23\n17:21:33 | 76:2 Bearing temperature : Overtemp. rear bearing 6 00:06:09\n17:21:33 |76:1 Bearing temperature : Overtemp. front bearing 6 00:00:00\n12:59:58 0:10 Information / Warnings\n12:59:58 |\nOne issue causing the Bearing overtemp faults are the 95:1 Error measurement. If there is no plausible fault with the Bearing temp\nsensors then investigate the spinner. Please see TS! 01 - 04-027 for incorrect installation of this.\n* at\nfj onal i Temp. Front bearing\nTemp. Front beari :\nTemp. Rear bearing femp. Rear bearing\nTemp. Spinner -5.0 °C\nTemp. Spinner\nXO0PM — 12/13/2021 9:00:00PM 12/14/2021 1:00:00 AM 12/14/2021 5:00:00 AM\nIf temperature difference is greater than 40 degrees between spinner and bearing this fault code will trigger","im":["shared_fault_info_1_084"],"k":"76:1"},{"i":53,"c":"Faults","s":"50-99","t":"80:XX Fault excitation","d":"18 September 2020","f":"shared fault info 1.pdf","p":[85,86],"r":"","b":"Template instructions to send to team.\n\nTemplate -\n80.XX Exci...\n\nExample: 80:XXX Fault current\nEarth fault monitoring of the pole shoe\n\nPossible cause\nDefect pole shoe\nDefect ground wire\nDefect board\n\nPossible repair method\nExchange board\nExchange ground cable\nExchange pole shoes","o":"80:XX Fault excitation\n18 September 2020 13:45\nTemplate instructions to send to team.\nbea\nTemplate -\n80.XX Exci...\nExample: 80:XXX Fault current\nEarth fault monitoring of the pole shoe\nPossible cause\nDefect pole shoe\nDefect ground wire\nDefect board\nPossible repair method\nExchange board\nExchange ground cable\nExchange pole shoes","im":["shared_fault_info_1_085","shared_fault_info_1_086"],"k":"80:XX"},{"i":54,"c":"Faults","s":"50-99","t":"80:1","d":"16 October 2017","f":"shared fault info 1.pdf","p":[87],"r":"","b":"Sru Replace                     IIIIIII           7\nSRU Brush replace               IIIIIII           7\nSRU Clean                       II                2\nFO Cable repair                 I                 1\nCable repair, SRU to rotor sub III                3\nPole shoe replace               IIIIIIIII         9\nExcitation cable issue          I                 1\nIGBT                            I                 1\nDiode Module                    I                 1\nExcitation PCB                  I                 1\n\n  Has the SRU been replaced, not like for like?\n  Check pin connections.\n\n  Information regarding adaptors exist in the following places.\n  SRU replacement from 112319.","o":"80:1\n16 October 2017 12:49 Fault location Tally | Total count.\nSru Replace wnt 7\nSRU Brush replace wnt 7\n. SRU Clean u 2\n‘FE TW-esc-01-de-en-17-033 RevO00i Replacing ENERCON slip ring unit carbon brushespdf - Adobe Reader LCE) To Cable repair 1 1\nFile Edit View Window Help * Cable repair, SRU to rotor sub| III 3\nBB 6nu| *) (#) [4] /25 | = + 8 | oy | {e?] Fill Sign Pole shoe replace mm 9\n| 15 R tor inetructh TT. |_| Excitation cable issue 1 1\nfl feason for ins! jons E ‘cer , 1\n‘| Several ENERCON slip ring units have already failed in the field of use due to excitation paths : Diode Module 1 1\nbeing eroded away. Status messages 80:1 or 92:1 were generated. B - pce ; 1\n—— excitation\nThe problem can be traced back to a second-source carbon brush made by the Carbex company. 2\nThis carbon brush has a low percentage of copper, making it more susceptible to temperature than\nthe replacement type by Schunk. High temperatures can deform the carbon brush slightly and it\nmay become trapped in the carbon bag. Its entrapment will lead to abnormal abrasion of carbon. ; ;\nHigh levels of contact resistance will arise, which ensure an even higher temperature in this area Has the SRU been replaced, not like for like?\nand cause the excitation tracks to be eroded. Check pin connections.\nTo prevent WEC standstill and replacement of the ENERCON SRU, Garbonlbrushes by /Carbex Will Information regarding adaptors exist in the following places.\nSRU replacement from 112319.\nral\ncs82\n8 Carbon brush 32 x 16 x 50 mm C40Z3 Schunk® 628677\n1 Sanding line 50 x 5,000 mm KL361JF Korn 60 43767\n1 Respiratory protection with a particle filter according to the latest\ninstructions for safe use of respiratory protection.\nHandling of dismantled materials\nComponent designation Return Scrap on site Other\nCarbon brush\n32x 16x64mmCU35M [] &\nCarbex® (SAP 530284)","im":["shared_fault_info_1_087"],"k":"80:1"},{"i":55,"c":"Faults","s":"50-99","t":"80:22 Current is low during testing Please see advice laid out in below ticket","d":"20 December 2018","f":"shared fault info 1.pdf","p":[88],"r":"","b":"I see 3 possibilities which can cause this message: 80:22\n1.       The measuring\n2.       The supply of the excitation\n3.       The cabling/wiring to the pole shoes and back\nThe 1st point should be the easiest. It can be a CT issue ( For this WEC please check CT’s BC-03, BC-04 & BC-15), the cabling between CT’S and control board excitation or the control board excitation is the problem.\nThe 2nd and the 3rd point are not so easy. From the rectifier over the excitation, SRU, rotor sub distribution, the pole shoes and the way back it could be that there is a loose connection. This means that every\nconnection between and inside the assemblies (and of course also inside the plugs) must be checked visual and by strength/torque (pull the connections for checking).\n\nAfter this can you please provide details below.\n•       Rotor earth cable continuity: =\n•       Excitation circuit resistance rotor: =\n•       Excitation Circuit insulation: =\n•       Pole shoes Visual inspection and polarity check: = Ok / Not ok\n\nLastly, Please note: In the past we have had fuse’s in the system that visually look serviceable but a continuity check has proven the fuse blown","o":"","im":[],"k":"80:22"},{"i":56,"c":"Faults","s":"50-99","t":"80:25","d":"23 September 2019","f":"shared fault info 1.pdf","p":[89],"r":"","b":"Below software was supplied by second level to try and resolve the ongoing issue at Islay. (E33)\n\n  Ticket\n70019233...","o":"","im":[],"k":"80:25"},{"i":57,"c":"Faults","s":"50-99","t":"80:31","d":"30 December 2016","f":"shared fault info 1.pdf","p":[90],"r":"","b":"This is usually caused by the DC fuses (F04 and F05) being blown. Please note these can be 63amp,\n82amp and 100amp but the replacements have to be of the same rating. If for instance you have\n80amp fuses on your van/service station and you require a 100amp fuse then the 80 amp can be\nused as a temp measure only.\n\nSRU BRUSHES\nExcitation fuses.\n\nFuse holder has poor connection","o":"80:31\n30 December 2016 11:00\nThis is usually caused by the DC fuses (FO4 and FOS) being blown. Please note these can be 63amp,\n82amp and 100amp but the replacements have to be of the same rating. If for instance you have\n80amp fuses on your van/service station and you require a 100amp fuse then the 80 amp can be\nused as a temp measure only.\nSRU BRUSHES\nExcitation fuses.\nFuse holder has poor connection","im":["shared_fault_info_1_090"],"k":"80:31"},{"i":58,"c":"Faults","s":"50-99","t":"80:42 Excitation current too low during operation","d":"05 April 2019","f":"shared fault info 1.pdf","p":[91],"r":"","b":"                                                                                                                                                                                      Measureme\n                                                                                                                                                                                      nts check ...\n    This status is generated if the pulse output of the inverters has been granted and the excitation current is smaller than 10A with an excitation controller duty cycle of 100%.\n\n    This is usually caused by the DC fuses (F04 and F05) being blown. Please note these can be 63amp, 82amp and 100amp but the replacements have to be of the same rating.\n    If for instance you have 80amp fuses on your van/service station and you require a 100amp fuse then the 80 amp can be used as a temp measure only.\n\n•   Excitation test. How does this perform?\n•   Inspection required of Rectifier and Excitation cabinets.\n•   Are the rectifier fuses open circuit? Often open circuit but no warning/indication given. Physical measurement of these required .\n•   Inspection for defects on each 300KW supply. Burn marks on these are believed to be the cause of blowing the Rectifier fuses.\n•   If no defect can be found, please carry out measurements of rotor system. Ref TSI 1 – 14:032\n\n    Possible Parts\n    300KW supply\n    Excitation IGBT (Possible SAP 18744)\n    Excitation PCB","o":"80:42 Excitation current too low during operation\n05 April 2019 09:26\nMeasureme\nnts check ...\nThis status is generated if the pulse output of the inverters has been granted and the excitation current is smaller than 10A with an excitation controller duty cycle of 100%.\nThis is usually caused by the DC fuses (F04 and FOS) being blown. Please note these can be 63amp, 82amp and 100amp but the replacements have to be of the same rating.\nIf for instance you have 80amp fuses on your van/service station and you require a 100amp fuse then the 80 amp can be used as a temp measure only.\n--------------4\nexcitation\nExcitation test. How does this perform?\nInspection required of Rectifier and Excitation cabinets.\nAre the rectifier fuses open circuit? Often open circuit but no warning/indication given. Physical measurement of these required .\nInspection for defects on each 300KW supply. Burn marks on these are believed to be the cause of blowing the Rectifier fuses.\nIf no defect can be found, please carry out measurements of rotor system. Ref TS! 1 ~ 14:032\nPossible Parts\n300KW supply\nExcitation IGBT (Possible SAP 18744)\nExcitation PCB","im":["shared_fault_info_1_091"],"k":"80:42"},{"i":59,"c":"Faults","s":"50-99","t":"80:85 Excitation error : Undefined 2","d":"12 November 2018","f":"shared fault info 1.pdf","p":[92],"r":"","b":"                                                                                      Information from ticket - 70011624 is for E101 but s also helpful\n\nThis problem is generated by a faulty temperature sensor in the excitation cabinet.   Here some unkown excitation status additional the reason of the status:\n                                                                                      Status 80:50 -> temperature switch heat sink BT03.1\n                                                                                      Status 80:51 -> temperature switch heat sink BT03.2\n                                                                                      Status 80:52 -> temperature switch heat sink BT03.3\n                                                                                      Status 80:85 -> temperature sensor heat sink BT07.1 or BT07.3\n                                                                                      Additional you can see the reason of the status directly on the excitation board:","o":"80:85 Excitation error : Undefined 2\n12.November 2018 14:31\nThis problem is generated by a faulty temperature sensor in the excitation cabinet.\nInformation from ticket - 70011624 is for E101 but s also helpful\nHere some unkown excitation status additional the reason of the status:\nStatus 80:50 -> temperature switch heat sink BT03.1\nStatus 80:51 -> temperature switch heat sink BT03.2\nStatus 80:52 -> temperature switch heat sink BT03.3\nStatus 80:85 -> temperature sensor heat sink BT07.1 or BT07.3\nAdditional you can see the reason of the status directly on the excitation board:\n| Fenster .\n--STATE EXCITATION--\nMAIN: 80 ADD.: 51\nTEMP.-SWITCH IGBTS\nList L OJ: 0: 0\n4 > ’ « Enter","im":["shared_fault_info_1_092"],"k":"80:85"},{"i":60,"c":"Faults","s":"50-99","t":"90:xxx Generator filter CB tripped","d":"20 November 2020","f":"shared fault info 1.pdf","p":[93,94],"r":"","b":"  S90. xxx\ncircuit bre...\n\nMeasure Filter capacitors\n\n90:9 CIRC BREAKER TRIPED\nMonday, September 19, 2016    8:57 AM\n\nAs per the SID this issue can be caused by the ups cabinet. Please see 42:X22 As this has the same\nUPS issues.","o":"","im":[],"k":"90:xxx"},{"i":61,"c":"Faults","s":"50-99","t":"90:31 System circuit breaker Tripped.","d":"17 March 2017","f":"shared fault info 1.pdf","p":[95],"r":"","b":"         Often the turbine will report this faults regardless of operation ( No power production)\n        What are the Phase differences on the rectifier? A difference of no more the 35A is normal.\n        Exchanging shunt pcbs to allow for a more balanced position may be required. If this is not possible with the PCB's currently\n        installed on the turbine then new PCB's will be required. SAP: 60033\n\n        Alternatively the next step will be to increase the Phase current diff setting to 50A\n        Please find the below menu on the rectifier PCB under Rectifier Settings.\n\n        We cannot take the phase current higher than this so if the fault still occurs. Please replace the Shunt PCB opto-coupler.\n        The original component has a 5% tolerance whilst the new variant is reduced to 1%\n\n        SAP No.1317\n\n    Old data.\n1.29 Status 90:31 ‘Prot. circuit-breaker tripped: System disconnector’ (V6.60/V6.67)\n                                                                                                                                        WG Status     Rectifier_E1   20191028 -\nThe level of status 90:31, ‘Prot. circuit-breaker tripped: System circuit breaker’ has been\nadjusted.                                                                                                                                9031         12-2.31-D...   URGENT -...\nAs the overload relay of the system disconnector returns to its normal, non-triggered state after the                                      Upgraded optocopler may assist - 1317\nrectifiers have shut down, status 90:31 can be cleared via a reset of the control system, as opposed to\nother protective circuit breaker messages. As a consequence of this, a reset of the control system, and\nthereby a reset of fault message 90:31, can be performed via SCADA in future.\n\nThe first signs that the breaker is failing and needs replacing is that it will not close automatically but will manually.\nIf there doesn’t appear to be an issue with the breaker itself then carry out replacement of rectifier PCB's\n\nSAP 77583\n\nIssue had on Harbunhead beginning of 2019\n\nSo this issue with the phase differences is a known software bug in rectifier software greater than 2.18V.\nThe solution to this is to carry out adjustments to the Phase current Threshold difference. This must be\ndone on a case by case basis monitoring the WEC and adjusting until the WEC operates within the\nselected range. We MUST NOT exceed 60Amps. If the WEC is still faulting at this level then we will need\nto seek further advice from Second level.","o":"90:31 System circuit breaker Tripped.\n17 March 2017 09:26\nDescription\n(On some WECS we have had problems with tripped system circuit breakers\nTo solve this problem we do have only the possibility to perfor\nhas to be informed.\ner software update to control b\ndowngrade to the old\nof this problem has not found yet.\nrd rectifier % V1.9, the department Electrical engineering\nware control\nOften the turbine will report this faults regardless of operation ( No power production)\nWhat are the Phase differences on the rectifier? A difference of no more the 35A is normal.\nExchanging shunt pcbs to allow for a more balanced position may be required. If this is not possible with the PCB's currently\ninstalled on the turbine then new PCB's will be required. SAP: 60033\nAlternatively the next step will be to increase the Phase current diff setting to 50A\nPlease find the below menu on the rectifier PCB under Rectifier Settings.\nPHASE CURR. DIFF\nTHRESH .OFFS.=35A\nWe cannot take the phase current higher than this so if the fault still occurs. Please replace the Shunt PCB opto-coupler.\nThe original component has a 5% tolerance whilst the new variant is reduced to 1%\nSAP No.1317\nOld data. 4 B\n1.29 Status 90:31 ‘Prot. circuit-breaker tripped: System disconnector’ (V6.60/V6.67) fs\nThe level of status 90: 31, ‘Prot. circuit-breaker tripped: System circuit breaker’ has been bh ca ea\n- 9031 12-2.31-D....  URGENT-...\nadjusted.\nAs the overload relay of the system disconnector returns to its normal, non-triggered state after the\nrectifiers have shut down, status 90:31 can be cleared via a reset of the control system, as opposed to\nother protective circuit breaker messages. As a consequence of this, a reset of the control system, and\nthereby a reset of fault message 90 : 31, can be performed via SCADA in future.\nUpgraded optocopler may assist - 1317\nThe first signs that the breaker is failing and needs replacing is that it will not close automatically but will manually.\nIf there doesn’t appear to be an issue with the breaker itself then carry out replacement of rectifier PCB's\nSAP 77583\nIssue had on Harbunhead beginning of 2019\nSo this issue with the phase differences is a known software bug in rectifier software greater than 2.18V.\nThe solution to this is to carry out adjustments to the Phase current Threshold difference. This must be\ndone on a case by case basis monitoring the WEC and adjusting until the WEC operates within the\nselected range. We MUST NOT exceed 60Amps. If the WEC is still faulting at this level then we will need\nto seek further advice from Second level.","im":["shared_fault_info_1_095"],"k":"90:31"},{"i":62,"c":"Faults","s":"50-99","t":"90:63 Yaw inverter trip","d":"21 March 2018","f":"shared fault info 1.pdf","p":[96],"r":"","b":"Edinbane 8 (March 2018.\nOn many attempts to find the fault where QA011 (K011) contactor in the Nacelle control cabinet was\ntripping along with the yaw cabinet feeding fuses. It was found that Capacitor C14 had a small hair\nline crack in the installation and was occasionally shorting to earth via the mounting plate.\n\nThe two cabinet SAP numbers for this fault were - 73614 Nacelle control & 41047 Yaw inverter","o":"","im":[],"k":"90:63"},{"i":63,"c":"Faults","s":"50-99","t":"90:85 Nacelle fan,","d":"19 October 2020","f":"shared fault info 1.pdf","p":[97],"r":"","b":"  90 85\nNacelle F...","o":"","im":[],"k":"90:85"},{"i":64,"c":"Faults","s":"50-99","t":"90:91 Tower fan CB Tripped","d":"07 January 2021","f":"shared fault info 1.pdf","p":[98,99],"r":"","b":"Possible cause for fault is the motor protection switch KF33. Please check status.","                                     S92. 1 LV\n                                                                                                                                                            earth faul...\n\n       The status 92:1 means, that there is an earth fault in the feeding system: excitation line\n       (excitation, sru and pole-shoes), generartor, rectifier, tower cables, DC-distribution, power\n       cabinets and MV-transformer.\n\n       If a loss of comms occurs directly after 9:1 Please ensure the team have a FACTS pcb\n\n       TD-esc-01-ger-xxx-12-010\n\n       Capacitor Bank short\n       94019233/0020\n       There is a resistance of 5k ohms on pins 4,5 & 6 of J03 from yaw\n       cabinet to the nacelle control cabinet. Pins 1,2 & 3 ok. Swapped plugs\n       between A15 & A25 and fault switched to system 1. Checked the IGBTs and\n       replaced the choke on system 2 to rule out and think all ok inside yaw\n       cabinet. Started to follow low resistance path and disappeared when i\n       tripped the yaw breakers q11.1 & q11.2. Checked and was on the L3\n       bussbar above circuit breakers. Checked and this supply comes from the\n       control cabinet but is tied in with the ups. We replaced the 80a fuses\n       in the ups earlier. Measured the top of QB01 with 63a fuses removed and\n       there is a dead short between top connection of L3 and GND. No more\n       time\n\n       94019233/0020\n       Earth fault on yaw system\n       ----------------------------------------\n       +ve Ups fuses found blown x2. Require 3xsap no 37143. Turned off Ups as\n       instructed by IHT. Fitted new IgBT Boost Pcb inside Inv cabinet 3 but\n       still showing IGBT faults on control board. Disabling Inv Cab 3 on I/O\n       Board and setting maximum Power to 250kw. IHT trying to trace parts fop\n       Inv cabinets. Investigating yaw fault. Swapping over lems controling\n       x17 terminals both systems but fault still showing. When Q11.2 breaker\n       isolated for system 2 Yaw ,the motors yaw( only on 2) Low resistance\n       on T1 terminal to earth (6.65k 0hm) on K05 relay when switched off.\n       Further investigation of wiring and motors required. Note job not sent\n       to us on Mams 1st may.\n\n       -----------------------------------------\n\n       Parts left on site incorrect.3x IGBT BOOST SAP 72762 required (replaces\n       Sap 79131). Normal IGBTs left on site may be required. Fitted new IGBT\n       BOOST SAP 72762 to inv cab1(From Perth Stock for BONERBO Repair next\n       week . Removed faulty IGBT Boost from INV Cab 2 and isolated cabinet\n       and turned down scada to 500kw. IGBT Fault still showing on INV cab 3.\n       3x IGBT BOOST Required SAP 72762 as requested. Trish left info to trace\n       these. Replaced Rectifier control Board SAP 77716. Problems with Mams\n       notifications to assign material. Yaw system Fault still apparent.\n       Tried software as warning but fault still present. Further\n       investigation required. WEC stopped ,maintenance and manual on. Return\n       tomorrow.\n       ----------------------------------------\n       On investigation the boost converter pcb's in power cabinets 1 and 2\n       where found to have damage. IHT were informed and it was decided that\n       all boost converters should be replaced(SAP required).\n       The rectifier driver pcb system 2 was found to be damaged so was\n       replaced. The rectifier control pcb was found to be faulty (replacement\n       required).\n       WEC was left in service mode and in manual. The yaw was not working\n       which we suspect is connected to earthing issues in the boost\n       converters.\n                             Whilst observing the LV detection CT, it has previously been found\n                             That the connections have been corroded. The slightest disturbance to this\n                             caused multiple LEDS to light up. Under normal operation you can usually\n                             expect 2-4 LED's to be lit.\n\n       The earth fault CT (SAP 511360) has got 10 steps that you can choose. You need to set them depending on the control type of the turbine.\n       Set up IAW TD-ESC-01-GER-ENG-14-034 PAGES 8\n\n       Or TSI TD-esc-01-de-en-18-085 Rev001\n\nSubject           RE: Mossmorran 92:10\nFrom              Benjamin Arndt\nTo                Team16 Service-UK\nCc                Christopher Hughes; Marc Dewing\nSent              17 September 2018 13:00\nAttachments\n\n                  92_1 issues\n\nI have just seen on the update email that it was a 92:1 fault there as well.\nPlease see attached a few other sites that had the issue before and how we fixed it.\n\nWith regards / Mit freundlichen Grüßen\nBen Arndt, M.Eng.\nIn-House Technical Support\n\n------------------------------------------------------------\n\nWith regards / Mit freundlichen Grüßen\nBen Arndt, M.Eng.\nIn-House Technical Support\n\n------------------------------------------------------------\nENERCON Services UK Ltd.\nMace House, 3 Sovereign Court,\nErmine Business Park, Huntingdon PE29 6XU\n01480 415852\ntechnical-uk@enercon.de\nwww.enercon.de\n------------------------------------------------------------\nENERCON Services UK Ltd. ∙ Registered Place of Business: Companies House Cardiff ∙ Commercial Registration No. 05634531 ∙ Managing\nDirector: Julian Martin\nThis e-mail message together with its attachments, if any, is confidential and may contain information subject to legal privilege (e .g. attorney-\nclient-privilege). If you are not the intended recipient or have received this e -mail in error, please inform us immediately and delete this\nmessage. Any unauthorised copying of this message (and attachments) or unauthorised distribution of the information contained herein is\nprohibited.\n\nFrom: Benjamin Arndt\nSent: 17 September 2018 12:50\nTo: Team16 Service-UK\nCc: Christopher Hughes; Marc Dewing\nSubject: Mossmorran 92:10\n\nHello\n\nI have attached some details about Low voltage earth faults.\n\n   1. It can be an issue with the N and PE separation in the turbine. If that has not been assembled\n      properly that can be the problem. Please see 92:10 document for the explanation how to test it.\n\n   2. It can that the LV fault measurement does not work properly. That could be a broken CT or IO\n      board. For some CT settings I have attached an old email.\n\n   3. If the two things above are both not the cause there needs to be full investigation of the turbine.\n      Maybe check the book first about other issues in the past and see since when the fault is on the\n      turbine (the first time). I have attached the file 92_1 as well. It shows some causes that we have\n      had on other turbines. So the fault then can be for example on the SRU, in the pitch box, one of\n      the heaters inside an inverter a motor/or fan ... please have a look at the attached.\n\nWith regards / Mit freundlichen Grüßen\nBen Arndt, M.Eng.\nIn-House Technical Support\n\n------------------------------------------------------------\nENERCON Services UK Ltd.\nMace House, 3 Sovereign Court,\nErmine Business Park, Huntingdon PE29 6XU\n01480 415852\ntechnical-uk@enercon.de\nwww.enercon.de\n------------------------------------------------------------\nENERCON Services UK Ltd. ∙ Registered Place of Business: Companies House Cardiff ∙ Commercial Registration No. 05634531 ∙ Managing\nDirector: Julian Martin\nThis e-mail message together with its attachments, if any, is confidential and may contain information subject to legal privilege (e .g. attorney-\nclient-privilege). If you are not the intended recipient or have received this e -mail in error, please inform us immediately and delete this\nmessage. Any unauthorised copying of this message (and attachments) or unauthorised distribution of the information contained herein is\nprohibited.","o":"92:XX Low voltage earth fault\n18 September 2020
