der what level of\nmisalignement MPPT would be able to correct the nacelle alignment. What is the maximum misalignement\nacceptable for the MPPT to be efficient?\nFor instance, if I have a nacelle misaligned by 15° will the MPPT be able to correct it to 0° or not?\nThanks,\n\nFrom <https://srv-crm01.enercon.de/sap(ZT1NREF3TmpRMU5ERmZYMTlmTWpKZk9EQmZBRkJXcEhQSkh1cWZ3XzNTNldlblJRPT0\n=)/bc/bsp/sap/crm_ui_frame/BSPWDApplication.do?sap-client=009&sap-language=EN&sap-domainrelax=min&sap-domainrelax=min>","o":"MPPT System\n25 June 2018 13:27\nThe MPPT is automatically activated for following software versions:\n101 Cab. > 5.75\n102 Nac. > 4.66\nTo really confirm if all parameters are activated (they can be manually deactivated) you have to enter the following menu in the WEC:\n102 Nacelle - Wind Parameters - MPPT\nMPPT wind dir. adj.:\n(operation modeO ):\nv= 0.0m/s c= 0\ncorrection= + 0.00°¥\nSolution Description 16.08.2019 13:56:27 Alexander Berwald\nHi Louis-Olivier,\nFor safety reasons, the correction determined by the MPP tracker is limited to +12°. If larger corrections are\nnecessary, the turbine must be checked, especially the wind direction measurement.\nBest regards\nProblem Description 15.08.2019 19:53:23 Louis-Olivier Savard\nHello,\nWould you be able to tell us what is the operational range for the MPPT system? Under what level of\nmisalignement MPPT would be able to correct the nacelle alignment. What is the maximum misalignement\nacceptable for the MPPT to be efficient?\nFor instance, if I have a nacelle misaligned by 15° will the MPPT be able to correct it to 0° or not?\nThanks,\nFrom <https://srv-crm01.enercon.de/sap(ZTINREF3TmMpRMUSERMmZYMTImTWpKZk9EQmZBRkJXCEhQSkh1cWZ3XzNTNIdIbURPTO\n=)/bc/bsp/sap/crm_ui_frame/BSPWDApplication.do?sap-client=009&sap-language=EN&sap-domainrelax=min&sap-domainrelax=min>","im":["Shared_Info_102"],"k":""},{"i":385,"c":"General","s":"Other","t":"New fault finding tool","d":"24 August 2020","f":"Shared Info.pdf","p":[103],"r":"","b":"Dezide.","o":"","im":[],"k":""},{"i":386,"c":"General","s":"Other","t":"NortH Alignment. GPS","d":"16 March 2017","f":"Shared Info.pdf","p":[104],"r":"","b":"                                                                                                                          What if the North Alignment looks compared to other turbines but Production looks ok….\nGPS\n                                                                                                                          The reason is more than likely one of the WEC's might not be set to zero at North. When we test the\n                                                                                                                          yaw system, we align to north and the system should be zeroed. I would suggest that the system has\n                                                                                                                          been zeroed after the yaw test by accident. To correct this the nacelle needs yawing manually to\nConvert the required - UTM WGS84 - data from a Long/Lat figure using below link.                                          North (there are North stickers in the yaw deck), double check heading with a compass and then\nhttps://www.geoplaner.com/                                                                                                setting the control system to zero via I/O board 2 in the nacelle control cabinet.\nor\nhttp://home.hiwaay.net/~taylorc/toolbox/geography/geoutm.html\n\nHere is how I would set the WEC to read North. Follow instructions as per the commissioning document until the WEC is\npointing North, then I would remove the plastic twist counter wheel on the TWK or equivalent twist counter (stromag on\nthis WEC that I am on at the moment), rotate the drive until the yaw angle is reading 0 deg on the yaw data Nacelle I/O\ncontrol board 2, the twist angle should also be reading 0 and the display should also be saying North, then I would\nreinstall the yaw counter drive.                                                                                          https://www.geoplaner.com/ is simple to use. Input any form of data and it will return the rest.\n                                                                                                                          Easting is the \"Y\" Co-ordinates\n                                                                                                                          Northing is the \"X\" Co-ordinates.\n                                                                                                                          Always use \"30U\"\n\nhttp://www.synnatschke.de/geo-tools/coordinate-converter.php\n\n      NORTH ALIGMENT TO BE CARRIED OUT. PLEASE CARRY OUT NORTH ALIGMENT CHECK USING ATTACHED\n      SIAS-PPM TOOL. THIS WAS ALSO EMAILED TO ALL TEAMS ON THE 14TH Nov2017 with the how to use\n      guide.\n\n      SIAS-PPM        SIAS-PPM_         North               PG-03.03\n      _Tool_ N...     NacelleN...    Alignmen...           SIAS-PPM...\n\n      FW North           North\n      alignment       alignment","o":"NortH Alignment. GPS\n16 March 2017 15:51\nWhat if the North Alignment looks compared to other turbines but Production looks ok....\nes The reason is more than likely one of the WEC's might not be set to zero at North. When we test the\nyaw system, we align to north and the system should be zeroed. | would suggest that the system has\nbeen zeroed after the yaw test by accident. To correct this the nacelle needs yawing manually to\nConvert the required - UTM WGS84 - data from a Long/lat figure using below link. North (there are North stickers in the yaw deck), double check heading with a compass and then\nhttps://wwnw.geoplaner.com, setting the control system to zero via I/O board 2 in the nacelle control cabinet.\nor\nhttp://home.hiwaay.net/~taylorc/toolbox/geography/geoutm.html\nHere is how | would set the "k":""},{"i":391,"c":"General","s":"Other","t":"Power Curves","d":"22 November 2017","f":"Shared Info.pdf","p":[110,111],"r":"","b":"Power curves_Rev001","o":"Power Curves\n22 November 2017 10:44\nPower curves_Rev001\n3.1 Background im ENERCON\nENERGIE FOR DIE WELT\n~ The “electrical assemblies / control system” department repeatedly receives messages about\n“bad” power curves from...\nCRC / Technical Service Dispatch / CRM\nSales / PLM\nFleet Support Engineering (Site Assessment)\n~ Customers often threaten not to accept the WEC\n~ Last payments from customer are not made\n~ Recourse claims by customer to ENERCON\n~ When it comes to money, panic often sets in\n~ The customer can see the power curve in the SIP with the target power curve\n~ For the customer, this power curve is the measure of all things\n3.2 Causes and actions\n~ There are four basic causes of bad power curves\n- WECis not in technically working order\n- Wind speed correction / wind direction correction\n- Location and environmental conditions\n- WEC construction defect\n~ Explained in detail...\n3.2 Causes and actions\n~ Location and environmental conditions\nHills/mountains\nForest\nSite elevation\nHigh temperatures (air density changes)\nTurbulent location\nFrequent load control limitations\nWind farm set-up\nForce majeure, no measures possible\nFleet Support Engineering may have to carry out a new site assessment\n3.2 Causes and actions ui\n~ WEC construction defect\nRotor blade\nE-92\nGenerator\nE-82 3 MW G1 generator\nMeasures are then generally attempted by means of upgrading and retrofitting\nE-92 rotor blade - boundary layer railings / Vortex generators / serrations\nE-82 3 MW G1 generator - Step-up converter cabinet, excitation","im":["Shared_Info_110","Shared_Info_111"],"k":""},{"i":392,"c":"General","s":"Other","t":"PPE Inspectors","d":"14 May 2021","f":"Shared Info.pdf","p":[112],"r":"","b":"Hosegood, Thomas      056-TSK1U Inspection of PPE Comp person\nHartshorn, Anthony    056-TSK1U I ability\nperspective, we’re covered by clause 9.1.3 (below) during the outage. However I understand the\ncomplication is after the outage.","o":"Sustained grid outage procedure.\n24 November 2020 10:32\nESC _UK Procedure after Sustained Grid outage _revO00_ en-en\n| scanned through the EPK contract and there’s nothing | can see in the Service Items covering\noutages, therefore contractually we’re not obliged to provide anything. From an availability\nperspective, we’re covered by clause 9.1.3 (below) during the outage. However | understand the\ncomplication is after the outage.\n9.1.3. If one or more of the WECs are unavailable due to:\n(a)\n(b)\n(c)\n(d)\n(e)\n(f)\nevents or circumstances which entitle the Contractor to suspend the execution of\nthe Services or Supplementary Services according to Sub-Clause 6.2,\nshutdown of a WEC by the Contractor for the purpose of performing Scheduled\nMaintenance under the Contract, however, limited to the number of hours per WEC\nand per Operational Year defined for the specific WEC type in Annex 4 [Definition of\nAvailability},\nany suspension of the Services or Supplementary Services ordered by or any\nstoppage shutdown or outage caused by or attributable to the Employer or to any\nthird parties for which the Contractor is not responsible (such as but not limited to\nvandalism, grid outages caused by the grid operator or inspections ordered by any\nOfficial Entity),\nthe Contractor diligently carrying out Supplementary Services in accordance with\nthe Contract,\nthe Contractor not being able to deliver necessary Components to the Site because\nan Official Entity delays the process of obtaining the required transport licences or\npermits; however, the time is limited to the period of time between the Contractor's\napplication of such transport licence and the receipt by the Contractor of such\nlicence, and regardless of such times of delay which have been caused by the\nContractor, or\nthe events or circumstances defined in Annex 4 [Definition of Availability],\nthen, for the purpose of caiculating the Availability of the Wind Farm as well as of the\nWEC(s) pursuant to the procedure established in Annex 4 [Definition of Availability], the\naffected WEC(s) shall be deemed to have been fully available for the period during which\nsuch WEC(s) was/were unavailable.","im":["Shared_Info_117"],"k":""},{"i":397,"c":"General","s":"Other","t":"Technical Area cover","d":"25 October 2021","f":"Shared Info.pdf","p":[118],"r":"","b":"Provide cover Absent                Detail\n      Area 1     Area 2   Matt covering for Paul/Ian\n      Area 2     Area 3   Paul/Ian covering for David\n      Area 3     Area 1    David covering for Matt.","o":"","im":[],"k":""},{"i":398,"c":"General","s":"Other","t":"Van & stock location list","d":"23 April 2020","f":"Shared Info.pdf","p":[119],"r":"","b":" SL Teams -\nupdate in ...\n\nEmail contains live document link for Van stock locations\n\n  Sarah\nHobbs sh...","o":"","im":[],"k":""},{"i":399,"c":"General","s":"Other","t":"VAN - SF fleet driver details","d":"25 January 2021","f":"Shared Info.pdf","p":[120],"r":"","b":" When do I\ncall SG Fle...","o":"","im":[],"k":""},{"i":400,"c":"General","s":"Other","t":"WTSR","d":"01 October 2020","f":"Shared Info.pdf","p":[121],"r":"","b":"  WTSR\nProcedure","o":"","im":[],"k":""},{"i":401,"c":"General","s":"Other","t":"Reset lock","d":"20 January 2022","f":"Shared Info.pdf","p":[122],"r":"","b":"In order to be able to release the reset lock, the service code must be entered.\nI/O board 1 in the control cabinet > Special function > Reset lock I/O Board released > with the orange button\n‘Released’.","o":"","im":[],"k":""},{"i":402,"c":"General","s":"Other","t":"Retrofitting Ultrasonic Anemometer","d":"07 January 2022","f":"Shared Info.pdf","p":[123,124],"r":"","b":"TD-esc-01-d\ne-en-11-0...\n\nUPS Bypass\nFriday, January 23, 2015   3:34 PM\n\nIn nacelle control cabinet: Link between terminal block 015 X10:02 and any one circu al","s":"Portals","t":"Meteorage - Lightning monitor","d":"04 February 2022","f":"Shared Info.pdf","p":[158],"r":"","b":" METEORA                                  TUTORIAL - Tutorial\nGE alarm...                               CUSTOME... lightning ...\n\n    Please see below your login and password, to have access to your customer area\n    https://www.meteorage.com/user/login :\n    Login : ENERCONUK\n    Password : PE296XU","o":"","im":[],"k":""},{"i":434,"c":"General","s":"SCADA","t":"FCU_E2, SCADA; setpoint, status data, RTU","d":"12 February 2021","f":"Shared Info.pdf","p":[159],"r":"","b":"Description\nWith the central setpoint documentation (ZSD) of the ENERCON SCADA Server, setpoints and control actions are recorded\nand made available for evaluation. This means that no setpoint specifications are stored as status or information data in the FCU_E2.\nA storage of the history takes place exclusively in the ZSD and can be checked via SCADA Remote 3.\nWith the RTU there is the possibility to select the storage location of the setpoint specifications via a parameter adjustment. Existing systems should\nnot be adapted. Setpoint specifications are still saved as status here.\n\nFurthermore, with the central setpoint documentation, some system events of the ENERCON SCADA server and other systems are captured and recorded.\nThe recorded setpoints, control actions and system events can be evaluated via the following\nInterfaces/products to be evaluated:\n■ ENERCON SCADA PDI-OPC\n■ ENERCON SCADA Remote 3\n\nExamples of recording:\nIn the following, examples for the recording of the central setpoint documentation are shown. The examples are shown using the view in\nENERCON SCADA Remote 3.\n\nExample: Setpoint specification via PDI-OPC to the ENERCON SCADA FCU E2 An active power setpoint value of 0 % is specified for the\nENERCON SCADA FCU E2 via ENERCON SCADA PDI-OPC.\n■ Time: indicates the time at which the activity occurred.\n■ Name: indicates the activity. In this case the transmission of an active power setpoint to a wind farm controller.\n■ Plant control: indicates the target of the activity. In this case the ENERCON SCADA FCU E2.\n■ Process source: indicates the trigger for the activity. In this case the PDI-OPC.\n■ Process control: indicates the process for transmission of the setpoint. In this case an ENERCON SCADA Server interface to the wind farm\ncontroller.\n■ Setpoint: indicates the setpoint. In this case a setpoint of 0 %.\n\nThe activities of the ENERCON SCADA FCU E2 after receiving the setpoint are also recorded.\n■ Time: indicates the time at which the activity occurred.\n■ Name: indicates the activity. In these two cases this is the change of the relative active power setpoint P2 (P2 Set Rel) and the change\nof the relative active power setpoint currently used by the ENERCON SCADA FCU E2 (P Set Rel).\n■ Plant source: indicates the trigger for the activity. In this case the ENERCON SCADA FCU E2.\n■ Plant control: indicates the target of the activity. In this case the ENERCON SCADA FCU E2.\n■ Interface: indicates the interface for transmission of the setpoint. In this case the OPC interface between the ENERCON SCADA Server and\nthe ENERCON SCADA FCU E2.\n■ Group: indicates the activity group.\n■ Setpoint: indicates the setpoint. In this case a setpoint of 0 %.\n-------------------------------------------------------------------------\nExample: Start of a wind energy converter via ENERCON SCADA Remote 3 Wind energy converter 4 is started via ENERCON SCADA Remote 3.\n■ Time: indicates the time at which the activity occurred.\n■ Name: indicates the activity. In this case the control of a wind energy converter.\n■ Plant control: indicates the target of the activity. In this case wind energy converter 4 with the control system type CS101.\n■ Process source: indicates the trigger for the activity. In this case ENERCON SCADA Remote 3\n■ Process control: indicates the process for transmission of the control actions. In this case an ENERCON SCADA Server process.\n■ Setpoint: indicates the control action. In this case the start of the wind energy converter.\n-------------------------------------------------------------------------\nExample: Stop of a wind energy converter via ENERCON SCADA Remote 3 Wind energy converter 5 is stopped via ENERCON SCADA Remote 3.\n■ Time: indicates the time at which the activity occurred.\n■ Name: indicates the activity. In this case the control of a wind energy converter.\n■ Plant control: indicates the target of the activity. In this case wind energy converter 5 with the control system type CS101.\n■ Process source: indicates the trigger for the activity. In this case ENERCON SCADA Remote 3\n■ Process control: indicates the process for transmission of the control actions. In this case an ENERCON SCADA Server process.\n■ Setpoint: indicates the control action. In this case the stop of the wind energy converter at 90° blade angle.\n\n-----------------------------------------------------------------------\n-----------------------------------------------------------------------\nTo be able to trace the setpoints, control actions and system events recorded by the central setpoint documentation system at a later date,\nthis information is written on a monthly basis to a file with the following naming convention yyymmm00.zsd. The file can be downloaded using\nENERCON SCADA Remote 3 via the Data request tab\n\nAn overview of all data points is described in the Technical Description Central Setpoint Documentation. The document is stored in the\nTechnical Info database under ENERCON SCADA.","o":"","im":[],"k":""},{"i":435,"c":"General","s":"SCADA","t":"General.","d":"06 April 2017","f":"Shared Info.pdf","p":[160],"r":"","b":"TD-esc-01-ger-eng-12-043 Rev004 Installing and commissioning satellite system","o":"","im":[],"k":""},{"i":436,"c":"General","s":"SCADA","t":"Guide","d":"10 March 2020","f":"Shared Info.pdf","p":[161],"r":"","b":"D0184488-\n16_ENER...","o":"","im":[],"k":""},{"i":437,"c":"General","s":"SCADA","t":"Phone signal checker","d":"08 September 2017","f":"Shared Info.pdf","p":[162],"r":"","b":"https://opensignal.com/networks","o":"","im":[],"k":""},{"i":438,"c":"General","s":"SCADA","t":"Power reduction via OPC interface SCADA.","d":"07 January 2021","f":"Shared Info.pdf","p":[163],"r":"","b":"Problem Description:\nThe following article describes the function of the direct marketer interface via the SCADA OPC interface.\nSetpoints of the direct marketer are stored on the SCADA server as the last valid setpoint in the flash memory\nof the SCADA server only every 8 hours.\nSince a value can also be transferred to SCADA every ten seconds via the OPC interface, this behavior has\nbeen set up to conserve the flash memory.\nIn order to use the last valid values after a power failure, the current last value is stored in the flash memory\nin the event of a power failure.\nHowever, a storage occurs only if the SCADA server is shut down correctly via the UPS. If this safety is not\ngiven due to missing or defective UPS, the last stored value is used after a restart. Under certain\ncircumstances, this can lead to the values of an expired reduction being used and the park being reduced via\nthe direct marketer interface of the RTU.\n\nSolution Description:\nIn order to ensure correct functioning of the DV interface, the UPS must be set up correctly in the SCADA system.","o":"","im":[],"k":""},{"i":439,"c":"General","s":"SCADA","t":"Remote display menu ID codes","d":"23 September 2020","f":"Shared Info.pdf","p":[164],"r":"","b":"  Remote\ndisplay ID...","o":"","im":[],"k":""},{"i":440,"c":"General","s":"SCADA","t":"SCADA Plant monitor","d":"18 January 2022","f":"Shared Info.pdf","p":[165],"r":"","b":"New user accounts: Send to Iris Flessner with . iris.flessner@enercon.de\n\nOnce access for the ENERCON plant monitor has been tranted .\n\nPlease find the setup file for the plant monitor here:\n\\\\nt-serv6\\service\\ABLAGE\\P ted very often. It could be determined that the message is c aused\nby an internal error of the level switch (SAP598068). This error can not be solved at the moment by the exchange of the level switch (exchange parts are also affected) or by other\nactions. Further service actions concerning the mentioned message are not neccessary because a repair is not possible.\n\nTroubleshooting can only be performed by retrofitting. The development of the retrofit has already begun. A detailed publicat ion of the technical instruction can unfortunately\nnot yet be mentioned, the material availability is not yet known. A timely publication is the endeavor.\n\nAll of the wind turbines with partly-open cooling system are affected.\n\nBecause the warning message is provided with a timeout of 7 days, it is advisable to set to 0h the counter with a temporary r eset of the warning message. This can be done by the\ntechnical indoor service. This prevents the final stop with status 228: 101","o":"101:7 Malfunc filling level switch\n29\nber 2017 10:59\nDescription: Warning message 101:7 / Malfunction filling level switch Sent Date and Time: | 15.08.2017 16:01\n‘piration Date: | 31.12.2017 23:59\nStatus: |Read\nDescription: Timm Mross\n1\nIt was noticed that the warning message 101: 7 - \"Fault water cooling generator : filling level too low\" is generated very often. It could be determined that the message is caused\nby an internal error of the level switch (SAP598068). This error can not be solved at the moment by the exchange of the level switch (exchange parts are also affected) or by other\nactions. Further service actions concerning the mentioned message are not neccessary because a repair is not possible.\nTroubleshooting can only be performed by retrofitting. The development of the retrofit has already begun. A detailed publicat ion of the technical instruction can unfortunately\nnot yet be mentioned, the material availability is not yet known. A timely publication is the endeavor.\nAll of the wind turbines with partly-open cooling system are affected.\nBecause the warning message is provided with a timeout of 7 days, it is advisable to set to Oh the counter with a temporary r eset of the warning message. This can be done by the\ntechnical indoor service. This prevents the final stop with status 228: 101","im":["Shared_Info_196"],"k":"101:7"},{"i":466,"c":"General","s":"Ticket sys news articals","t":"C-Profile Connector locking washer.","d":"17 November 2017","f":"Shared Info.pdf","p":[197],"r":"","b":"Please note, that you need another tool to check the torque of the M12 bolts at the c-profile-\nconnector, after the retrofit (TD-esc-01-de-xx-17-031) got done.\n\nThe locking washer has a bigger size as the nut has. You can't use a standard socket anymore.\n\nTo check the bolts at the maintenance, you can use this tools:\n\nSAP 73567 Torque wrench 20- 200NM (for insert tools)\n\nSAP 78619 Insert fork spanner SW18\n\nSAP 25722 Insert fork spanner SW19\n\nThe maintenance instruction will get adapted soon.","o":"C-Profile Connector locking washer.\n17 November 2017 11:19\nDescription: — Retrofit Locking Washer C-Profile-Connector\nStatus: Read\nPlease note, that you need another tool to check the torque of the M12 bolts at the c-profile-\nconnector, after the retrofit (TD-esc-01-de-xx-17-031) got done.\nThe locking washer has a bigger size as the nut has. You can't use a standard socket anymore.\nTo check the bolts at the maintenance, you can use this tools:\nSAP 73567 Torque wrench 20- 200NM (for insert tools)\nSAP 78619 Insert fork spanner SW18\nSAP 25722 Insert fork spanner SW19\n= a\nThe maintenance instruction will get adapted soon.\nSent Date and Time:\nExpiration Date\nDescription:\n09.11.2017 16:44\n31.12.2017 23:59\nUwe Schafer","im":["Shared_Info_197"],"k":""},{"i":467,"c":"General","s":"Ticket sys news articals","t":"CS101 ep4 Specific","d":"29 October 2017","f":"Shared Info.pdf","p":[198],"r":"","b":"At the mentionend WEC control systems was noticed that the rotorlocking doesn´t work. The release for setting or\nreleasing of the locking isn´t given by the hydraulic units of the manufactorer Weber Hydraulik.\n\nThis is caused by a missing temperatur switch in the hydraulic units. The temperature switch isn´t necessary acc.\nWRD and must be bridged. Further information can be found in the ESC Ticket 70001127\n\n               If damages or cracks got found during \"checking the pitch module fastening\" (TD-esc-01-de-en-17-006), no repairs have to get organized!\n\n               A retrofit for WEC with damages at the fastening will come soon. Please wait until the document will get published.\n\n               Therefore it's very important to identify damages correct (like described by the instruction) and to create notifications for affected fastenings. We're gonna use the notification to\n               initiate the retrofit.\n\n               WEC without damages will get a modification soon. This will get described in another document. Please wait for it.","o":"CS101 ep4 Specific\n29 October 2017 11:02\nDescription: | Hydjaulic unit trapped key interlock system CS101, EP4-CS-01 ‘Sent Date and Time: 04.09.2017 09:08\nStatus: Read Expiration Date: 31.03.2018 23:59\nDescription: Timm Mross\nAt the mentionend WEC control systems was noticed that the rotorlocking doesn’t work. The release for setting or\nreleasing of the locking isn’t given by the hydraulic units of the manufactorer Weber Hydraulik.\nThis is caused by a missing temperatur switch in the hydraulic units. The temperature switch isn’t necessary acc.\nWRD and must be bridged. Further information can be found in the ESC Ticket 70001127\nDescription: Pitch Module Fastening E-101, E-115: How to handle damages Sent Date and Time: 05.09.2017 14:39\nExpiration Date: 31.01.2018 23:59\nDescription: Uwe Schafer\nStatus: [Read\nIf damages or cracks got found during \"checking the pitch module fastening\" (TD-esc-01-de-en-17-006), no repairs have to get organized!\nA retrofit for WEC with damages at the fastening will come soon. Please wait until the document will get published.\nTherefore it's very important to identify damages correct (like described by the instruction) and to create notifications for affected fastenings. We're gonna use the notification to.\ninitiate the retrofit.\nWEC without damages will get a modification soon. This will get described in another document. Please wait for it.","im":["Shared_Info_198"],"k":""},{"i":468,"c":"General","s":"Ticket sys news articals","t":"E-115 EP3 E3 compact limit switch","d":"07 January 2022","f":"Shared Info.pdf","p":[199],"r":"","b":"Incorrect setting of the compact limit switches on the E-115 EP3 E3\nThe compact limit switches are set in the production. Incorrect settings were made for the E-115 EP3 E3 turbine type. During commissioning of\nthe turbine type E-115 EP3 E3, the compact limit switches must be set as follows according to the commissioning instructions:\n\n   • Limit switch 95°\n   • Limit switch 96°\n   • Parking position 97°\n\nThe currently stored values in the commissioning instruction is still incorrect and must therefore not be used. These values will be adjusted in\nrevision 1.","o":"","im":[],"k":""},{"i":469,"c":"General","s":"Ticket sys news articals","t":"FACTS 2.0 PCB connections","d":"24 January 2018","f":"Shared Info.pdf","p":[200,201,202],"r":"","b":"","o":"FACTS 2.0 PCB connections\n2A January 2018 08:58\nStatus’ Read\nDescription\nIn systems equipped with FACTS V2.0, it has happened that all boost converters have been destroyed during a grid-event.\nThe reason for this immense damage is an incorrectiy inserted fiber optic cable, With FACTS VILx the inverter control W21 and W22 were plugged.\nFor FACTS V2.0, W21 and W23 must be plugged.\nPlease inform your field staff about this fact.\niption: Additonal check at commissioning for the power cabinet V3 and FACTS V2.0\nLeistungsschrank\npower cabinet\nSAP article no index\n60844 the safety warning - \"Fatal accident when using the service hoist in automatic mode\", the\ntechnical information \"TD-esc-02-de-en-17-007 Rev000 Operation of service hoist Greifzug WEC 1\nvia emergency control unit\" will be invalidated with immediate effect.\nSince the service hoist doesn’t have an automatic mode, it was permitted to use the emergency\ncontrol unit under certain conditions to move the service hoist down. This is not allowed until\nfurther notice!\nThe emergency service may only be used in emergencies.","im":["Shared_Info_203"],"k":""},{"i":471,"c":"General","s":"Ticket sys news articals","t":"Overspeed","d":"30 January 2018","f":"Shared Info.pdf","p":[204],"r":"","b":"By using the IO Board 1 Controlcabinet CSxx software ≥ V5.51, the software ensures that an\noverspeed switch test is performed every 485 days (equivalent to 16 months).\nIf no test has been carried out for a remaining time of 120 days, the system generates the warning\n16:91 (overspeed switch test: perform) once. If no test has been carried out within these 120 days,\nthe message 16:91 will be generated daily for the remaining 30 days, after the 30 days the system\nwith the status 16:92 (overspeed switch test: timeout) will be stopped and will not be stopped reset\nmore. (See also Software Description IO Board 1 Controlcabinet CSxx V5.75)\n\nIt is therefore imperative to include the overspeed switch test on the affected systems in the\nresource planning when the warning message appears, otherwise the systems will stop at the end of\nthe time!\n\nThis procedure is necessary because according to TRBS 1201 \"Tests of working equipment and\ninstallations requiring monitoring\" safety equipment must be checked recurrently.","o":"Overspeed\n30January 2018 09:13\nDescrpton: {status 16:92 - Uperorenzaniscnaltertest : Zetuberscnreitung ‘Sent Dale and Time. 26.01.2018 16:28\nStatus. Read Expration Date |51,01.2020 23:68\nDescristion: [Timm wress\nDescription\nMit Einsatz der Software IO Board 1 Controleabinet CSxx 2 V5 51 wird durch die Software sichergestellt. dass alle 485 Tage (entspricht 16 Monate) ein Uberdrehzahlschaltertast durchgefubrt wird.\n‘Wenn bis 2u einer verbleienden Restzeit von 120 Tagen kein Test durehgefthrt wurde, ganariert die Aniage einmalig die Warnung 16:91 (Uberdrehzahlechaltertest : durchfuhren). Wenn innerhalb dieser 120 Tage noch kein Test durchgefuhrt wurde, wird in den verbleibanden 30\n‘Tagen taglich die Meldung 16:91 generiert, nach Ablauf der 30 Tage wird die Anlage mit dem Status 15:92 (Uberdrehzahlschaltertest : Zeituberschreitung) gestoppt und lasst sich auch nicht mehr resetten. (Siehe auch Softwarebeschreibung IO Board 1 Controlcabinet CSxx VE.75)\nEs ist somit zwingend erforderlich bei Auftreten der Warnmeldung den Uberdrehzahischaltertest an den betrofienen Anlagen in die Einsalzplanung mit aufzunehmen, andemfalls bleiben die Aniagen am Ende cer Zeit stehen!\nDieses Vorgehen ist erforderlich da gem TRBS 1201 \"Prifungen von Arbeitsmitteln und Uberwachungsbediirfiigen Aniagen” Sicherheitseinrichtungen wiederkehrend Uberprift werden mussen.\nBy using the IO Board 1 Controlcabinet CSxx software 2 V5.51, the software ensures that an\noverspeed switch testis performed every 485 days (equivalent to 16 months).\nIf no test has been carried out for a remaining time of 120 days, the system generates the warning\n16:91 (overspeed switch test: perform) once. If no test has been carried out within these 120 days,\nthe message 16:91 will be generated dally for the remaining 30 days, after the 30 days the system\nwith the status 16:92 (overspeed switch test: timeout) will be stopped and will nt be stopped reset\nmore. (See also Software Description 10 Board 1 Controlcabinet CSxx VS.75)\nIt is therefore imperative to include the overspeed switch test on the affected systems in the\nresource planning when the warning message appears, otherwise the systems will stop at the end of\nthe time!\n‘This procedure is necessary because according to TRBS 1201 \"Tests of working equipment and\ninstallations requiring monitoring\" safety equipment must be checked recurrently.","im":["Shared_Info_204"],"k":""},{"i":472,"c":"General","s":"Ticket sys news articals","t":"PDF in Google Chrome","d":"20 December 2017","f":"Shared Info.pdf","p":[205],"r":"","b":"","o":"PDF in Google Chrome\n20 December 2017 10:54\nDescription: Solve problems with PDF export in Google Chrome Sent Date and Time: 01.12.2017 15:02\nstatus: [Read Expiration Date: 31.12.9999 23:59\nDescription: Mr Joris Jacobs\nDescription\nIf the PDF export does not work, “open PDFs with another application”:\nMethod:\nGoogle Customize and set Google Chrome> Settings> \"PDF\" as the keyword at the top of the search\n> Settings> PDF documents> Move the switch to the right (will be highlighted in blue)\nLink: https://support.google.com/chrome/answer/62130307hI=en\nRegards,\nJoris","im":["Shared_Info_205"],"k":""},{"i":473,"c":"General","s":"Ticket sys news articals","t":"PI testing","d":"10 January 2018","f":"Shared Info.pdf","p":[206],"r":"","b":"","o":"Pl testing\n30 January2018 11:47\nDesciin: [Prmassurenent year malronanca |\nStats! Read ]\nDesenption\n‘Sent Date and Time\nExpration Date\nDeseristion:\n‘32.12.2017 00:36\n‘31.03.2018 2359\nVolker Gruben\nThe long-term approach will be decided at the beginning of next year on the basis of the recorded dato. We will inform you in a timely manner.\nPlease poss on this information to the field staff\nIfyou have questions, please contact 8j5m Hillers or Miriam Bruns.\nIn 2017, a large number of Pi measurements were carried out, so that our data base is almost sufficient. Thank you for your contribution! In the revision of the mointenance instruction, which will be published in spring 2018 (for most instructions this will be revision 8), the\nolarization index measurement is therefore taken out of the maintenance instructions. To fill the remaining gops in the database, but avoid mointenance delays, we therefore ask you to do the following:\n* Ifthe conditions for ¢ successful measurement are suitable (numidity and temperature within limits), the P! measurement must be performed unti the maintenance point is taken from the instructons and the protocol.\n‘Ifthe condifons for a successiul measurement are not suitable (numidty and temperature out of the limits), there is no need to caich up on the Pl measurement. The maintenance point is rated as “not required’ in the protocol.","im":["Shared_Info_206"],"k":""},{"i":474,"c":"General","s":"Ticket sys news articals","t":"Power cabinet Ark flash","d":"29 October 2017","f":"Shared Info.pdf","p":[207,208],"r":"","b":"Due to an arc-flash within the 300kW power cabinet during a test run, a near-accident was reported.\nThe closed cabinet-door flew up because of the arc-flash, and there was a spark over the control\ncabinet.\n\nThe following could be established by a research team:\n\nA heat-development was caused by a loose connection of the connections to the circuit breaker. The\nheat-development led to the melting of an insulating-cap on the rear-panel and the earth-fault could\noccur. The resulting arc-flash became larger and spread to all three phases.\n\nRear panel insulating-cap melted:\n\nDamage to the circuit breaker:\n\nThe loose connection of the circuit breaker already arose in the production by an obliquely inserted\n\nThe loose connection of the circuit breaker already arose in the production by an obliquely inserted\nscrew and was not discovered despite the test point in the commissioning instructions. The\ninvestigation team was able to find that shaking the connecting-cables and a torque control of the\nconnecting-screws could not recognize the bad contact. A minimal gap between the connecting -lug\nand the cable-lug can be seen only by visual inspection of the connection.\n\nMinimum gap due to obliquely screwed screw\n\nIt is not possible to trace this technical defect back in order to provide targeted processing of\naffected power cabinets.\n\nA visual check of the connections of the circuit breaker must also be carried out during\ncommissioning.","o":"Power cabinet Ark flash\n29 October 2017 11:08\nDescription: Arc-flash hazard in a 300kW power cabinet Sent Date and Time:\nStatus: |Read Expiration Date:\nDescription\nDue to an arc-flash within the 300kW power cabinet during a test run, a near-accident was reported.\nThe closed cabinet-door flew up because of the arc-flash, and there was a spark over the control\ncabinet.\nThe following could be established by a research team:\nA heat-development was caused by a loose connection of the connections to the circuit breaker. The\nheat-development led to the melting of an insulating-cap on the rear-panel and the earth-fault could\noccur. The resulting arc-flash became larger and spread to all three phases.\nRear panel insulating-cap melted:\nDamage to the circuit breaker:\n14.09.2017 13:27\n31.05.2018 23:59\nVolker Gruben\nThe loose connection of the circuit breaker already arose in the production by an obliquely inserted\nscrew and was not discovered despite the test point in the commissioning instructions. The\ninvestigation team was able to find that shaking the connecting-cables and a torque control of the\nconnecting-screws could not recognize the bad contact. A minimal gap between the connecting -lug\nand the cable-lug can be seen only by visual inspection of the connection.\nMinimum gap due to obliquely screwed screw\nIt is not possible to trace this technical defect back in order to provide targeted processing of\naffected power cabinets.\nAvisual check of the connections of the circuit breaker must also be carried out during\ncommissioning.","im":["Shared_Info_207","Shared_Info_208"],"k":""},{"i":475,"c":"General","s":"Ticket sys news articals","t":"Pitch motor incorrect wiring","d":"07 January 2022","f":"Shared Info.pdf","p":[209],"r":"","b":"Incorrect wiring on pitchmotors with SAP number 15741 EMOD® pitchmotor can cause damage to the blade relay cabinets and the battery/condensator cabinets.\n\nIn the last few weeks, several blade pitchmotors (SAP 15741) with incorrectly polarized compound windings (D1-D2) have come to light.\nTherefore, special care must be taken when replacing a defective SAP 15741 pitchmotor until further notice.\n\nIf a SAP 15741 pitchmotor is replaced on a plant, it is essential that chapter 3.3 Re-commissioning the blade control of the affected blade drive from\ninstruction TD-esc-07-de-en-20-014 Replacing the pitchmotor is observed before the plant is recommissioned.\n\nThe polarity reversal of the compound winding has only an influence on the \"emergency drive\" of the blade.\nTherefore, the emergency drive must be tested.\n\nObserve the direction of rotation (direction of the vane position). If the direction of rotation of the blade is not correct during subsequent tests of the\nemergency drive, first open the compact limit switch or the 60 V battery jumper on CS40 systems and then the motor connector again and eliminate the\ncause of the incorrect direction of rotation (polarity reversal of the compound winding, connections D1 & D2 in the terminal box).\n\nSAP number 15741 pitchmotor EMOD®                MK40033-1\n\nPicture 1 affected pitchmotor\n\nStocks of the affected pitchmotor will be checked as soon as possible and the manufacturer of the pitchmotor will be contacted.","o":"Pitch motor incorrect wiring\n07 January 2022 12:47\nIncorrect wiring on pitchmotors with SAP number 15741 EMOD® pitchmotor can cause damage to the blade relay cabinets and the battery/condensator cabinets.\nIn the last few weeks, several blade pitchmotors (SAP 15741) with incorrectly polarized compound windings (D1-D2) have come to light.\nTherefore, special care must be taken when replacing a defective SAP 15741 pitchmotor until further notice.\nIf a SAP 15741 pitchmotor is replaced on a plant, it is essential that chapter 3.3 Re-commissioning the blade control of the affected blade drive from\ninstruction TD-esc-07-de-en-20-014 Replacing the pitchmotor is observed before the plant is recommissioned.\nThe polarity reversal of the compound winding has only an influence on the \"emergency drive\" of the blade.\nTherefore, the emergency drive must be tested.\nObserve the direction of rotation (direction of the vane position). If the direction of rotation of the blade is not correct during subsequent tests of the\nemergency drive, first open the compact limit switch or the 60 V battery jumper on CS40 systems and then the motor connector again and eliminate the\ncause of the incorrect direction of rotation (polarity reversal of the compound winding, connections D1 & D2 in the terminal box).\nSAP number 15741 pitchmotor EMOD® MK40033-1\nPicture 1 affected pitchmotor\nStocks of the affected pitchmotor will be checked as soon as possible and the manufacturer of the pitchmotor will be contacted.","im":["Shared_Info_209"],"k":""},{"i":476,"c":"General","s":"Ticket sys news articals","t":"Transformer bushing","d":"20 December 2017","f":"Shared Info.pdf","p":[210],"r":"","b":"","o":"Transformer bushing\n20 December 2017 10:52\nUsing wrong torque at MV-Bushing\nRead\nDue to incorrect procedures or incorrect torque, 4 damage occurred within one week.\nAt 3 MV-bushings, the damage could be detected before the connection, but these must be exchanged costly.\nIn addition, it comes naturally to the delay of the commissioning.\nAt the 4th transformer, the crack was not noticed in advance, here it came to a breakdown in the course of the first energizing . The transformer must be replaced perhaps\n8.1.2 Drehmomente der Bolzenmutter der MS-Durchfiihrung\n‘Spannung [KV] bis 36 bis 36\n‘Schliisselweite [mm] [17 19\nDurchmesser des Bol- |\nzen [mm] 10 12\nDrehmoment [Nm] 15 25","im":["Shared_Info_210"],"k":""},{"i":477,"c":"General","s":"Ticket sys news articals","t":"Quality issue contact insert Harting HAN K 6/6","d":"07 February 2018","f":"Shared Info.pdf","p":[211,212,213],"r":"","b":"!!PRELIMINARY INFORMATION!!!\n\nExact action steps, measures and affected assemblies are announced in a technical instruction!\n\nThe company Harting Germany GmbH & Co. KG informed by a customer information about a quality issue at his produced contact inserts.\n\nThis quality issue also affects ENERCON wind turbines.\n\nAffected are the following contact inserts:\n\nThe last mentioned contact insert is also used in ENERCON wind turbines but so far no SAP number has been created for this.\n\nThis quality issue arises as follows:\n\nDuring a matting process, the fixing plate may come loose from the isolation unit, as shown in the following picture. This isnot visible during the matting process and can only recognize\nby removing the plug.\n\nBecause this quality issue entails an increased risk of error-free plant operation and also increases the risk of fire, it´s necessary to prevented further putting into circulation of these\ncontact inserts. This takes place by means of production changeover and inventory control in the central warehouses in Aurich, Gotha and Remels as well in the warehouses in countries\noutside Germany. Corresponding notice is distributed via the newsletter by the Stock Management department.\n\nIf a device has been tested, a note is visible on the device.\n\nOn the production side, the following sticker is placed on an unaffected device:\n\nDevices that have been checked in the central warehouse and identified as unaffected receive one of the following notes:\n\nThe label \"QA-check - approved\" additionally contains the text \"Plug checked ...\"\n\nDevices that have been tested in SEMO warehouses or in the warehouses in countries outside Germany receive the following information in the case there are no errors identified:\n\nThe label \"QS-check - rejected\" also contains the text \"Plug checked ...\" as shown.\n\nIt´s not allowed to use affected devices with a faulty contact insert as a spare part until replacement of the faulty contactinsert has been done.\n\nIf a supply bottleneck occurs, contact the Stock Management department and order the necessary device again. A new order is to be made only in a case of needs, disproportionate\nhoarding of material orders are to be avoided.\n\nAffected contact inserts were manufactured by Harting during the period from June 2017 to December 2017.\n\nUnfortunately it´s not possible to locate the affected devices over the production period, so faulty contact inserts must be identified via the production code.\n\nThe following production codes are affected and can be located on the contact inserts or outer packaging as shown:\n\nIf devices with potentially affected variants of the contact inserts are found that does not show any of the above notes (sticker QS control with text, sticker \"Plug checked ...\" missing), a\nqualified electrician must inspect the device before use and mark it as described above.\n\nAffected variants of the contact inserts are shown below and must be optically identified:\n\nFurther information follows in a technical instruction. An independent investigation of the contact inserts is not carried out at the WEC, because in a case of finding a faulty contact insert\nonly the exchange of them is possible.","o":"Quality issue contact insert Harting HAN K 6/6\n07 February 2018 08:20\nDescription: Quality issue contact insert Harting HAN K 6/6\nStatus: Read\n!IPRELIMINARY INFORMATION!!!\nExact action steps, measures and affected assemblies are announced in a technical instruction!\nThe company Harting Germany GmbH & Co. KG informed by a customer information about a quality issue at his produced contact irserts.\nThis quality issue also affects ENERCON wind turbines.\nAffected are the following contact inserts:\nDesignation Manufacturer ISAP No. |Designation SAP V2 material\nmanufacturer |partnumber \\database\nHan® K 6/6-M 100 109380122651 6747 Ipin insert 6p/6p screw term\n|AMP/16-35QMM.\nHan® K 6/6-F 100 109380122751 6749 socket insert 6p/6p screw term\n|AMP/16-35QMM.\nHan® K 6/6-M 100 109380122653\n|AMP/10-25QMM\nThe last mentioned contact insert is also used in ENERCON wind turbines but so far no SAP number has been created for this.\nThis quality issue arises as follows:\nDuring a matting process, the fixing plate may come loose from the isolation unit, as shown in the following picture. This isnot visible during the matting process and can only recognize\nYr XN\n——\nby removing the plug.\nBecause this quality issue entails an increased risk of error-free plant operation and also increases the risk of fire, it’s necessary to prevented further putting into circulation of thee\ncontact inserts. This takes place by means of production changeover and inventory control in the central warehouses in Aurich Gotha and Remels as well in the warehouses in countries\noutside Germany. Corresponding notice is distributed via the newsletter by the Stock Management department.\nIfa device has been tested, a note is visible on the device.\nOn the production side, the following sticker is placed on an unaffected device:\nDevices that have been checked in the central warehouse and identified as unaffected receive one of the following notes:\nPlug checked regarding\nTD-esc-01-de-xx-18-006\nThe label \"QA-check - approved\" additionally contains the text \"Plug checked\nPlug checked regarding\nTD-esc-01-cle-xx-18-006\nThe label \"QS-check - rejected\" also contains the text \"Plug checked ...\" as shown.\nSent Date and Time:\nExpiration Date:\nDescription:\n06.02.2018 14:56\n31.12.2019 23:59\nTimm Mross\nIt’s not allowed to use affected devices with a faulty contact insert as a spare part until replacement of the faulty contactinsert has been done.\nIf a supply bottleneck occurs, contact the Stock Management department and order the necessary device again. A new order is be made only in a case of needs, disproportionate\nhoarding of material orders are to be avoided.\nAffected contact inserts were manufactured by Harting during the period from June 2017 to December 2017.\nUnfortunately it’s not possible to locate the affected devices over the production period, so faulty contact inserts must beidentified via the production code.\nThe following production codes are affected and can be located on the contact inserts or outer packaging as shown:\n\"1\n13\n48\n62\n68\n7\nIf devices with potentially affected variants of the contact inserts are found that does not show any of the above notes (sticker QS control with text, sticker \"Plug checked\nqualified electrician must inspect the device before use and mark it as described above.\nAffected variants of the contact inserts are shown below and must be optically identified:\n|AMP/10-25QMM\nDesignation Manufacturer partnumber |SAP No. |Designation SAP V2 material\nmanufacturer database\n|Han® K 6/6-M 100 (09380122651 \\6747 pin insert 6p/6p screw term.\nJAMP/16-35QMM\n|Han® K 6/6-M 100 [09380122653 |Contact insert does not differ in\nshape and size from the contact\ninsert Han® K 6/6-M 100 AMP /\n16-35QMM. The contact insert is\nlonly designed for other wire cross\nsections.\nsignation (Manufacturer partnumber |SAP No. (Designation SAP V2 material\nImanufacturer \\databas:\n|Han® K 6/6-F 100 (09380122751 |6749 socket insert 6p/6p screw term.\n|AMP/16-35QMM\nca!\" missing), @\nFurther information follows in a technical instruction. An independent investigation of the contact inserts is not carried ou at the WEC, because in a case of finding a faulty contact insert\nonly the exchange of them is possible.","im":["Shared_Info_211","Shared_Info_212","Shared_Info_213"],"k":""},{"i":478,"c":"General","s":"Tool Hire","t":"Dehumidifier","d":"07 January 2020","f":"Shared Info.pdf","p":[214],"r":"","b":"","o":"Dehumidifier\n07 January 2020 09:11\nPump Dehumidifier (52 Ltr)\nYoure betler equinned\nSe Ltr Pump Dehumidifier\nPRODUCT CODE: 56734 NO REVIEWS YET\nNo more checking water levels and emptying water conta <script>
const IMG=k=>"img/"+k+".jpg";
const D=JSON.parse(document.getElementById('data').textContent);
const CATS=["All","Faults","Parts","Software","General"];
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>s.toLowerCase().replace(/\s*:\s*/g,":");
D.forEach(n=>{n._t=norm(n.t+" "+n.k);n._b=norm(n.b+" "+n.s+" "+n.r);n._o=norm(n.o);
  const m=n.k.match(/^(\d+):(\w+)/);n._sort=m?[+m[1],isNaN(+m[2])?9999:+m[2]]:[1e6,0];});
let st={cat:"All",sec:"",q:"",limit:60};
try{const s=JSON.parse(localStorage.getItem("tff")||"{}");if(CATS.includes(s.cat))st.cat=s.cat;}catch(e){}
const save=()=>{try{localStorage.setItem("tff",JSON.stringify({cat:st.cat}))}catch(e){}};

function renderCats(){
  const c={All:D.length};D.forEach(n=>c[n.c]=(c[n.c]||0)+1);
  $("cats").innerHTML=CATS.map(k=>`<button class="chip" aria-pressed="${st.cat===k}" data-c="${k}">${k}<b>${c[k]||0}</b></button>`).join("");
  const secs=[...new Set(D.filter(n=>st.cat==="All"||n.c===st.cat).map(n=>n.s))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
  if(!secs.includes(st.sec))st.sec="";
  $("sec").innerHTML=`<option value="">All sections</option>`+secs.map(s=>`<option ${s===st.sec?"selected":""}>${esc(s)}</option>`).join("");
}
$("cats").onclick=e=>{const b=e.target.closest(".chip");if(!b)return;st.cat=b.dataset.c;st.sec="";st.limit=60;save();renderCats();run();};
$("sec").onchange=e=>{st.sec=e.target.value;st.limit=60;run();};

function terms(q){return norm(q).split(/\s+/).filter(Boolean).map(t=>t.replace(/[.,;]+$/,""))}
function score(n,ts){
  let s=0;
  for(const t of ts){
    let h=0;
    if(n.k&&norm(n.k)===t)h+=60;
    if(n._t.startsWith(t))h+=25;
    if(n._t.includes(t))h+=12;
    if(n._b.includes(t))h+=4;
    if(n._o.includes(t))h+=1.5;
    if(!h)return 0;s+=h;
  }
  return s;
}
function snippet(n,ts){
  const src=[n.b,n.o].find(x=>ts.some(t=>norm(x).includes(t)))||n.b||n.o;
  const flat=src.replace(/\s+/g," ");const low=norm(flat);
  let at=-1;for(const t of ts){at=low.indexOf(t);if(at>=0)break}
  // positions in norm text approximate original because norm only collapses spaces around ':'
  let s=Math.max(0,at-50);let out=flat.slice(s,s+170);if(s>0)out="…"+out;
  return hl(out,ts);
}
function hl(text,ts){
  let h=esc(text);
  ts.filter(t=>t.length>1).forEach(t=>{const re=new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&").replace(/:/g,"\\s*:\\s*"),"gi");h=h.replace(re,m=>`<mark>${m}</mark>`)});
  return h;
}
function card(n,ts){
  const shots="";
  const title=n.k?n.t.replace(/^\d{1,3}\s?:\s?[\dxX]+\s*/,""):n.t;
  return `<li class="item"><a href="#n${n.i}">
    <span class="t">${n.k?`<span class="code">${esc(n.k)}</span>`:""}<span class="tt">${ts.length?hl(title||n.t,ts):esc(title||n.t)}</span></span>
    <span class="meta"><span>${n.c} › ${esc(n.s)}</span><span>· ${n.d}</span>${shots}</span>
    ${ts.length?`<span class="snip">${snippet(n,ts)}</span>`:""}</a></li>`;
}
let lastRes=[];
function run(){
  const ts=terms(st.q);
  let pool=D.filter(n=>(st.cat==="All"||n.c===st.cat)&&(!st.sec||n.s===st.sec));
  let html="";
  if(ts.length){
    pool=pool.map(n=>[score(n,ts),n]).filter(x=>x[0]>0).sort((a,b)=>b[0]-a[0]).map(x=>x[1]);
    lastRes=pool;
    html=pool.slice(0,st.limit).map(n=>card(n,ts)).join("");
    $("count").textContent=`${pool.length} match${pool.length===1?"":"es"}`;
  }else{
    pool.sort((a,b)=>a.c.localeCompare(b.c)||a.s.localeCompare(b.s,undefined,{numeric:true})||a._sort[0]-b._sort[0]||a._sort[1]-b._sort[1]||a.t.localeCompare(b.t));
    lastRes=pool;let g="";
    pool.slice(0,st.limit).forEach(n=>{const k=n.c+" › "+n.s;if(k!==g){g=k;html+=`<li class="group">${esc(k)}</li>`}html+=card(n,ts)});
    $("count").textContent=`${pool.length} notes`;
  }
  $("list").innerHTML=html||`<li class="empty">No notes match “${esc(st.q)}”. Try fewer words, or a code without the letter, e.g. 42: instead of 42:x05.</li>`;
  $("more").hidden=pool.length<=st.limit;
  $("more").textContent=`Show more (${pool.length-st.limit} left)`;
}
$("more").onclick=()=>{st.limit+=100;run()};
let tm;$("q").addEventListener("input",e=>{st.q=e.target.value;st.limit=60;$("clr").hidden=!st.q;clearTimeout(tm);tm=setTimeout(run,120)});
$("clr").onclick=()=>{$("q").value="";st.q="";$("clr").hidden=true;run();$("q").focus()};
$("q").addEventListener("keydown",e=>{if(e.key==="Enter")e.target.blur()});

let scrollY0=0;
function show(){
  const m=location.hash.match(/^#n(\d+)$/);
  if(!m){$("detail").hidden=true;$("listView").hidden=false;$("ctl").hidden=false;window.scrollTo(0,scrollY0);return}
  const n=D[+m[1]];if(!n)return;
  if(!$("listView").hidden)scrollY0=window.scrollY;
  const ts=terms(st.q);
  $("dtitle").innerHTML=`${n.k?`<span class="code">${esc(n.k)}</span>`:""}<h2>${esc(n.t)}</h2>`;
  $("dmeta").innerHTML=`<dt>Section</dt><dd>${n.c} › ${esc(n.s)}</dd><dt>Note date</dt><dd>${n.d}</dd><dt>Source</dt><dd>${esc(n.f)}, page${n.p.length>1?"s":""} ${n.p.length>1?n.p[0]+"–"+n.p[n.p.length-1]:n.p[0]}</dd>${n.r?`<dt>Ref. doc</dt><dd>${esc(n.r)}</dd>`:""}`;
  $("dbody").innerHTML=n.b.trim()?hl(n.b,ts):"";
  $("dshots").innerHTML="";
  $("docr").hidden=!n.o;$("docrt").innerHTML=n.o?hl(n.o,ts):"";$("docr").open=false;
  $("listView").hidden=true;$("ctl").hidden=true;$("detail").hidden=false;window.scrollTo(0,0);
}
let inApp=false;document.addEventListener("click",e=>{if(e.target.closest(".item a"))inApp=true});
$("back").onclick=()=>{if(inApp){inApp=false;history.back()}else location.hash=""};
addEventListener("hashchange",show);
renderCats();run();show();
</script>
