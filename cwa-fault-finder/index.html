a +—*= szors\n05 1 gz0r'st >= 3 bt weg\nEe | szorst = +—— €20°s\nas | ‘nels\nah ic i vz0r'st = a $= 720s\n2: i evor'st > re L = says\n= 2 | zzor'st So i 8 =\n\"zor\" = eC 7 bf\n| VZ0r'st a = 7\" 4 Ry\n\\ = z 3 3\n| | : ls] 3\ni H 4a. 2\n“ a | aS {\nCal ae\n—]- ' he 1OML =) = if\n° ® i 341005 4———=naiom'e g\nak ' St0r'st 1 ADLON'L 2 {\n! ;\n= @ { Thor'st H ELOM'L 3 -\nwa { eons A Wome 2 ’\n3 —H 1 Z10rst ' 8 “\n(s) | rior'st i mess 2\n| = 3 [\niH i 8 a Me\ng x tL ; 8 {\n5 5 2 ?\nr : if\n3) uaqababiesy 2 me\nFY\n~ )\n= ©) |\nsi |\nv|70248 patchcable dx ST-ST |-VH G50/125ym 5m ROH\nSAP no.| Quantity | Unit\nMaterial description\n‘Comments / Name / Enerce\n48205 2 st\njowg-breakoutcable 2x62,5/125ym I=2m\ntock & Wec 482140\n$3883} 2 st\njowg-breakoutcable MIL 2x62,5/125 I=13,5m_\ntock & Wee 482140\n2x 62,5/125ym FO-Duplex Coble Indoor\nKobellénge L /\nFH-ST\nKe\nC\n2%\n|\nJ\ncable length L\nFO?\n[202i 042 000rT 61 00 203 0004 2\n[Art Nummer | Lym\n=I ions Sa cee Rar acu Boas\nIO ttre\na\nteu [10, 02,05] Ste FO-Potchkabel\nm= aul Ix 62,5/125\noD mancewncmrcn gemelTB 20 24 042 00.1\"","im":["Shared_Parts_info_1_093","Shared_Parts_info_1_094"],"k":""},{"i":285,"c":"Parts","s":"Tower","t":"Water ingress An suidhe","d":"14 November 2019","f":"Shared Parts info 1.pdf","p":[95],"r":"","b":" RE Power\ncabinet w...\n\n                           Photos for\n                           water ing...\n\nQuotation\nfor works.\n\n RE Power\ncabinet w...","o":"","im":[],"k":""},{"i":286,"c":"Software","s":"Feeding","t":"62:9 Feeding fault: Difference P(converter)/ P(Measuring  transducer","d":"20 January 2019","f":"Shared Software Info.pdf","p":[1],"r":"TD-esc-06-de-en-17-009 Rev000 IO Board 1 Control Cabinet CS101a V5.75","b":"   We have a lot of issues on newly commissioned sites with this fault. It is 99% of the time CT’s wired\n   incorrectly…. Have the CT’s been disturbed during the transformer works\n\n5.33 Power measurement monitoring: Status 62:9, “Feeding fault: Difference P(converter)/ P(Measuring transducer” (V5.53 / V5.54):\nOn all wind energy converters equipped with a multi-transducer, power measurement will be monitored in future by comparing the DC link power\nmeasured with the power measured by the multi-transducer at the grid output within relatively strict limits. To enable this comparison to be made,\nthe DC link power measured must be corrected so that all losses e.g. due to a heightened reactive power or own consumption of various\ncomponents are taken into account. Depending on the operating state of the wind energy converter, all losses currently occurring are subtracted\nfrom the DC link power and a mean value is calculated over an hour.\nA mean value over an hour is likewise calculated from the power measured by the multi-transducer. The following menu under Feeding data shows\nthe mean values of the two powers for the last hour and the permissible tolerance:\n\nEvery few seconds the fourth line also shows the average reactive power over the last hour.\n\nThe following adjacent menu shows the relative deviation between multi-transducer DM5S and the DC link power for the last hour as well as for\nmean and maximum values:\n\nPositive values mean the measuring transducer has measured a higher power than the corrected DC link power. The value for the last hour always\ncorresponds to the current deviation from the Power-monitoring: menu.\nEvery few seconds the fourth line of the menu also shows the average reactive power over the last 10 hours.\n\nStatus 62:9 is generated if the deviation between the average, corrected DC link power for the last hour and the mean power of the multi-\ntransducer exceeds the permissible tolerance. Errors both in the area of the DC link-power measurement and in the power measurement by the\nmulti-transducer area are taken into account.\nUnder Feeding data there are two other menus with a similar structure for monitoring of the energy count. The deviation between the work\ncounted by the energy meter over the last hour and the average DC link power is displayed here (kWh-monitoring and kWh-deviation). Where\nsimilar deviations like with the power monitoring occur with a higher WEC power, either there is a common fault during voltage measurement or\ncurrent measurement at low voltage level or a problem actually exists with power measurement in one or more converters.\nFor checking the DM5S input variables, the Grid data menu level on I/O board 2 is available. These menus can reveal the cause of a measuring fault\nin the measuring transducer and energy meter area in many cases.","o":"62:9 Feeding fault: Difference P(converter)/ P(Measuring\ntransducer\n20 January 2019 13:59\nTD-esc-06-de-en-17-009 Rev000 IO Board 1 Control Cabinet CS101a V5.75.docx\nWe have a lot of issues on newly commissioned sites with this fault. It is 99% of the time CT’s wired\nincorrectly.... Have the CT’s been disturbed during the transformer works\n5.33 Power measurement monitoring: Status 62:9, “Feeding fault: Difference P(converter)/ P(Measuring transducer” (V5.53 / V5.54):\nOn all wind energy converters equipped with a multi-transducer, power measurement will be monitored in future by comparing the DC link power\nmeasured with the power measured by the multi-transducer at the grid output within relatively strict limits. To enable this comparison to be made,\nthe DC link power measured must be corrected so that all losses e.g. due to a heightened reactive power or own consumption of various\ncomponents are taken into account. Depending on the operating state of the wind energy converter, all losses currently occurring are subtracted\nfrom the DC link power and a mean value is calculated over an hour.\nA mean value over an hour is likewise calculated from the power measured by the multi-transducer. The following menu under Feeding data shows\nthe mean values of the two powers for the last hour and the permissible tolerance:\nEvery few seconds the fourth line also shows the average reactive power over the last hour.\nThe following adjacent menu shows the relative deviation between multi-transducer DMS5S and the DC link power for the last hour as well as for\nmean and maximum values:\nPositive values mean the measuring transducer has measured a higher power than the corrected DC link power. The value for the last hour always\ncorresponds to the current deviation from the Power-monitoring: menu.\nEvery few seconds the fourth line of the menu also shows the average reactive power over the last 10 hours.\nStatus 62:9 is generated if the deviation between the average, corrected DC link power for the last hour and the mean power of the multi-\ntransducer exceeds the permissible tolerance. Errors both in the area of the DC link-power measurement and in the power measurement by the\nmulti-transducer area are taken into account.\nUnder Feeding data there are two other menus with a similar structure for monitoring of the energy count. The deviation between the work\ncounted by the energy meter over the last hour and the average DC link power is displayed here (kWh-monitoring and kWh-deviation). Where\nsimilar deviations like with the power monitoring occur with a higher WEC power, either there is a common fault during voltage measurement or\ncurrent measurement at low voltage level or a problem actually exists with power measurement in one or more converters.\nFor checking the DMSS input variables, the Grid data menu level on I/O board 2 is available. These menus can reveal the cause of a measuring fault\nin the measuring transducer and energy meter area in many cases.\nFeeding Page |","im":["Shared_Software_Info_001"],"k":"62:9"},{"i":287,"c":"Software","s":"General","t":"60:3 Clearing status","d":"20 January 2019","f":"Shared Software Info.pdf","p":[2],"r":"TD-esc-06-de-en-17-009 Rev000 IO Board 1 Control Cabinet CS101a V5.75","b":"5.30 Clearing status 60:3 (V5.51):\nStatus 60:3, “Mains failure: Start-up blocking POC (SCADA)” was not cleared again in some\ncases. This always happened if no start delay (P1000) was set and the restart lock was\nreleased again by the grid operator while the Power-Control reported another grid fault.\nThis problem has been fixed initially for the I/O board.","o":"","im":[],"k":"60:3"},{"i":288,"c":"Software","s":"General","t":"60:4 Mains failure: Start-up blocking POC (VCS)","d":"20 January 2019","f":"Shared Software Info.pdf","p":[3],"r":"TD-esc-06-de-en-17-009 Rev000 IO Board 1 Control Cabinet CS101a V5.75","b":"5.44 Status 60:4, “Mains failure: Start-up blocking POC (VCS)” (V5.66):\nFor wind farms that are connected at the high-voltage level, grid operators typically demand a\nrestart lock if the high voltage is below a specified threshold. For this purpose, the VCS (FCU)\nsends a corresponding command to all wind energy converters via the Farm Control Interface\n(FCI). The wind energy converter generates the status 60:4 providing the system was switched\noff due to a grid fault and the Power Control or protective disconnection has detected a grid\nfault. The WEC will restart automatically once the restart lock is released. In cases where a\nstart delay is set (P1000), the wind energy converter will remain stopped with status 60:2 for\nthe time set after the restart lock has been released.","o":"","im":[],"k":"60:4"},{"i":289,"c":"Software","s":"General","t":"92: 10; “Low voltage earth fault detection: Earth fault control system","d":"20 January 2019","f":"Shared Software Info.pdf","p":[4],"r":"TD-esc-06-de-en-15-060 Rev001 IO Board 1 Controlcabinet CS101a V5.20","b":"Status 92: 10; “Low voltage earth fault detection: Earth fault control system” (V4.46):\nWhen the low voltage earth fault detection is triggered (LV earth fault monitoring sys-tem),\nuntil now only a load shedding has been performed. This means that the rectifi-ers and\ninverters are blocked and the line contactors of the inverters are deactivated as quickly as\npossible by opening the grid safety circuit. However a load shedding on-ly makes sense if there\nis an earth fault in the power feed area. An earth fault in the control system area, as can be\ncaused by a defective surge arrester, for example, has until now only been recorded and\ndisplayed with status 92:1. For this reason, in future the I/O board will detect whether the\nearth fault is in the power feed area or in the control system area, and will switch off the\nsupply to the WEC if applicable.\nWhen the maintenance switch is switched on, if there is a continuous earth fault in the control\nsystem, the power supply is only switched off after 5 s. If applicable, this ex-tended time is\nused to look for the error. However, even longer periods could lead to unforeseeable damage.\nDefective surge arresters in particular increase the risk of fire. For this reason, great care must\nbe taken when resetting the control system in the case of an earth fault in the control system\narea. Switching off the power supply via the power control is only possible from version V3.18\nonwards.","o":"","im":[],"k":"92:10"},{"i":290,"c":"Software","s":"General","t":"327:310 display parameters","d":"20 January 2019","f":"Shared Software Info.pdf","p":[5],"r":"TD-esc-06-de-en-17-009 Rev000 IO Board 1 Control Cabinet CS101a V5.75","b":"5.47 Monitoring of display parameters (V5.66 / V5.68):\nIn future the I/O-board will monitor whether undefined parameters in the range > 6000 are set by the display to values not\nequal to 0. In version 1.68 of the display, changes have been made so that undefined parameters are no longer transferred to\nthe I/O-board. In cases where undefined display parameters on existing wind energy converters are not equal to 0, these are\ndeleted by the I/O-board. To display this procedure, the I/O board generates the information 327:310, “Parameter out of\nrange: Display”. This information should therefore be generated once only at the most following the programme-update.\nIn cases where valid display parameters are outside of the valid range, the I/O-board generates a warning message 327:110,\n“Parameter out of range: Display”. Since these parameters are held in the display, the I/O-board cannot make a change here.\nThe warning message is therefore generated each day until a manual correction of the parameter is made on the display via CF\ncard. This warning message does not have a time out.","o":"","im":[],"k":"327:310"},{"i":291,"c":"Software","s":"General","t":"Deleting options","d":"20 January 2019","f":"Shared Software Info.pdf","p":[6],"r":"TD-esc-06-de-en-17-005 Rev000 IO Board 1 Controlcabinet CS82a V5.75","b":"5.3 Deleting options (V5.30):\nIf future it will only be possible to delete hardware-options that lead to status messages in the Act. I/O-status menu\nunder Special functions after inputting a service code. This is intended to prevent options detected once automatically\nsuch as an earth fault monitoring system or the second I/O-board in the control cabinet being disconnected and\ndeactivated by unauthorised persons.","o":"","im":[],"k":""},{"i":292,"c":"Software","s":"General","t":"Overspeed switch test","d":"20 January 2019","f":"Shared Software Info.pdf","p":[7],"r":"","b":"5.29 Overspeed switch test (V5.51):\nIn future the wind energy converter control will ensure an overspeed switch test is performed at regular intervals. To realise this, four\ntimers have been programmed in total. Three timers for the individual overspeed switches from blade A to C and a higher-level timer.\nAfter the software has been installed, the timers for the individual blades are set to 1825 days. This corresponds to a period of exactly 5\nyears. The higher-level timer is initialised to 485 days. This corresponds to a period of approx. 16 months. The current remaining time of\nthe timers is displayed in the menu for performing the overspeed-tests under Special functions:\n\nEssentially overspeed switch tests need to be performed once per year. As soon as one of the timers for the individual overspeed\nswitches for the blades or for the communal timer ABC has reached a remaining time of 120 days (4 months), a warning message 16:91,\n“Overspeed-switch test: Perform” is generated once. If one of the timers reaches a value of 30 days, warning message 16:91 will be\ngenerated from that point on each day.\nIf no overspeed switch test is performed in the remaining 30 days so that one of the timers reaches the value 0, the wind energy\nconverter will be stopped for safety reasons with the status 16:92, “Overspeed switch test: Timeout”.\nThe timers will not be counted down at 00:00 hrs when the day changes but at 06:00 hrs in the morning. As a result the warning\nmessages will be transferred prior to the start of work and can be taken into account accordingly during planning. This is not possible at\nweekends however.\nAs soon as the overspeed-switch test is performed and the overspeed switch responds within the valid range, the I/O-board will set the\ncommon timer for performing the test to 485 days again. The timer for the blade whose overspeed switch activated will also be\nincreased again to 1825 days. The timers of the other blades will remain unchanged as long as their overspeed switch has not been\ncorrectly tested. This prevents the same overspeed switch for a blade always being triggered during the annual test and the switches for\nthe other blades never being tested. Each overspeed switch must therefore be tested successfully at least once every five years so that\nthe relevant timer is incremented again.\nInfo:\nIn cases where a wind energy converter is difficult to access (e.g. in Canada in wintertime) so that the overspeed switch test cannot be\nconducted and the wind energy converter comes to a standstill once the deadline has passed, the timer can be increased to 30 days\nagain manually. To do this, press both grey keys simultaneously in the above menu. A prerequisite here however is that at least one\ntimer is below 30 and a developer-service code has been entered. Since wind energy converters are difficult to access in some\ncircumstances and only certain Service Dispatch-workers have a developer-service code, this can also be done via the SCADA remote\ndisplay.","o":"Overspeed switch test\n20 January 2019 12:51\n5.29 Overspeed switch test (V5.51):\nIn future the wind energy converter control will ensure an overspeed switch test is performed at regular intervals. To realise this, four\ntimers have been programmed in total. Three timers for the individual overspeed switches from blade A to C and a higher-level timer.\nAfter the software has been installed, the timers for the individual blades are set to 1825 days. This corresponds to a period of exactly 5\nyears. The higher-level timer is initialised to 485 days. This corresponds to a period of approx. 16 months. The current remaining time of\nthe timers is displayed in the menu for performing the overspeed-tests under Special functions:\nEssentially overspeed switch tests need to be performed once per year. As soon as one of the timers for the individual overspeed\nswitches for the blades or for the communal timer ABC has reached a remaining time of 120 days (4 months), a warning message 16:91,\n“Overspeed-switch test: Perform” is generated once. If one of the timers reaches a value of 30 days, warning message 16:91 will be\ngenerated from that point on each day.\nIf no overspeed switch test is performed in the remaining 30 days so that one of the timers reaches the value 0, the wind energy\nconverter will be stopped for safety reasons with the status 16:92, “Overspeed switch test: Timeout”.\nThe timers will not be counted down at 00:00 hrs when the day changes but at 06:00 hrs in the morning. As a result the warning\nmessages will be transferred prior to the start of work and can be taken into account accordingly during planning. This is not possible at\nweekends however.\nAs soon as the overspeed-switch test is performed and the overspeed switch responds within the valid range, the |/O-board will set the\ncommon timer for performing the test to 485 days again. The timer for the blade whose overspeed switch activated will also be\nincreased again to 1825 days. The timers of the other blades will remain unchanged as long as their overspeed switch has not been\ncorrectly tested. This prevents the same overspeed switch for a blade always being triggered during the annual test and the switches for\nthe other blades never being tested. Each overspeed switch must therefore be tested successfully at least once every five years so that\nthe relevant timer is incremented again.\nInfo:\nIn cases where a wind energy converter is difficult to access (e.g. in Canada in wintertime) so that the overspeed switch test cannot be\nconducted and the wind energy converter comes to a standstill once the deadline has passed, the timer can be increased to 30 days\nagain manually. To do this, press both grey keys simultaneously in the above menu. A prerequisite here however is that at least one\ntimer is below 30 and a developer-service code has been entered. Since wind energy converters are difficult to access in some\ncircumstances and only certain Service Dispatch-workers have a developer-service code, this can also be done via the SCADA remote\ndisplay.","im":["Shared_Software_Info_007"],"k":""},{"i":293,"c":"Software","s":"General","t":"Relay switching.","d":"20 January 2019","f":"Shared Software Info.pdf","p":[8],"r":"TD-esc-06-de-en-17-005 Rev000 IO Board 1 Control cabinet CS82a V5.75","b":"5.28 Manual switching of relays under special functions (V5.51):\nThe manual switching of the relays in the relevant menu under Special functions will in future only be possible using the\nremote display via SCADA after entering a Service code.\nIn order to enable maintenance to be carried out on the WEC without a Service code, manual switching of many non-\ncritical relays on the WEC has been permitted without a Service code. It will be possible to switch relays K2, K3 and K5 to\nK8 on I/O board 1 without entering a Service code. However, this is only possible if the WEC is stopped and the\nmaintenance switch is ON. This way, for example the main safety circuit, the cabinet heating and the cabinet fan can be\nswitched manu-ally. Some relays such as tower fan levels 1 and 2 are excepted because the immediate activation of the\nsecond fan level can trip the main fuses in the control cabinet. A special menu is available for ensuring that the fans are\nactivated in a time-staggered manner.","o":"","im":[],"k":""},{"i":294,"c":"Software","s":"General","t":"shadow stop light sensors","d":"20 January 2019","f":"Shared Software Info.pdf","p":[9],"r":"TD-esc-06-de-en-17-009 Rev000 IO Board 1 Control Cabinet CS101a V5.75","b":"5.4 Monitoring of shadow stop light sensors (V5.30):\nIn some cases shadow stops have been activated e.g. via CF card parameters but the bridges which short-circuit the light\nsensor-inputs have not been removed. For this reason a check will be made in future as to whether the shadow stop\nsensors are supplying plausible values as soon as shadow stop is activated on the display. Warning message 4:21,\n“Shadow stop: Light intensity too high sensor 1” is generated if parameter 6100 on the display is at 1 (shadow stop on)\nwhile the voltage measured at analogue input 1 is less than 0.5 V. A low voltage of this kind cannot occur even at\nmaximum incident solar radiation. The input has therefore presumably short-circuited or the pull-up-resistor is defective\nor not connected. For light sensors 2 and 3, warning messages 4:22 and 4:23 are generated accordingly in such cases.\nThis monitoring takes place by the minute so that the fault can be detected straight away.\n\n    Installing Shadow sensors at an extended height due to buildings. Please see TSI\n    TD-ESC-01-DE-EN-18-048. Installing shadow shutdown at forest\n\n    Note further advice exists in ticket: 70066814\n\n    Support regarding drilling new holes into the tower wall. There are some regulations\n    that you need to follow:\n\n    1. Use a magnet drill\n    2. Chose a drill as small as possible and take a new and sharp drill.\n    3. Keep a distance of min. 300 mm to all welding seams (horizontal and vertical)\n    4. Sink the new holes on both sides about 3 mm deep.","o":"","im":[],"k":""},{"i":295,"c":"Software","s":"General","t":"Software Update","d":"01 December 2016","f":"Shared Software Info.pdf","p":[10],"r":"","b":"The order that the software update is to be completed can be found it\nTD-esc-08-ger-xxx-10-054","o":"Software Update\n01 December 2016 10:26\nThe order that the software update is to be completed can be found it\nTD-esc-08-ger-xxx-10-054\nSoftware update m4 ENERCON\n\\/O board software update with “Testbox” software:\n* If boot block 2V3.16 is installed, the update is the same as with installed I/O board\nsoftware.\n* No further changes to the settings are necessary\n* If boot block <V3.16 is installed, an update of the I/O board software is still possible:\n> Switch off all DIP switches on the I/O board.\n> When selecting the I/O board software on the WEC screen, change the boot ID to 80.\n> Start the software update.\n* No EPROM is needed.\n* Donot return PCBs as defective material.","im":["Shared_Software_Info_010"],"k":""},{"i":296,"c":"Software","s":"General","t":"Software CS82B installed in error","d":"09 February 2020","f":"Shared Software Info.pdf","p":[11],"r":"","b":"   RE\nSoftware","o":"","im":[],"k":""},{"i":297,"c":"Software","s":"General","t":"total-phase current of converters","d":"20 January 2019","f":"Shared Software Info.pdf","p":[12],"r":"","b":"                                                                                                 TD-esc-06-de-en-17-009 Rev000 IO Board 1 Control Cabinet CS101a V5.75.docx\n\n5.27 Menu for total-phase current of converters (V5.51):\nUnder Converter data, a menu has been added that shows the total-phase current for the\nconverters.\n\nThese currents are initial current values of power units measured by the current transformers.\nCurrents that arise due to filter circuits and the wind energy converter’s own consumption are\nnot included in this data.","o":"total-phase current of converters\n20 January 2019 12:50\n5.27 Menu for total-phase current of converters (V5.51):\nUnder Converter data, a menu has been added that shows the total-phase current for the\nconverters.\nThese currents are initial current values of power units measured by the current transformers.\nCurrents that arise due to filter circuits and the wind energy converter’s own consumption are\nnot included in this data.\n‘TD-esc-06-de-en-17-009 Rev000 IO Board 1 Control Cabinet CS101a V5.75.docx","im":["Shared_Software_Info_012"],"k":""},{"i":298,"c":"Software","s":"Generator","t":"1:19 and 9:19 generator drying","d":"20 January 2019","f":"Shared Software Info.pdf","p":[13],"r":"","b":"Preventive generator drying (humidity control) (status 1:19 and 9:19) (V4.90):\nTo prevent damage to generators and rectifiers during a limitation to 0 kW by\nthe utili-ty company, preventive generator drying (humidity control) has been\nintroduced.\nWhen the control is activated, the WEC is alternately operated for two hours\nand then operated with generator drying for two hours. To indicate this, when\nthe humidity con-trol is activated the WEC generates status 1:19 “Turbine\nstopped: Power set point too low” (in operation) or 9:19 “Generator heating:\nPower set point too low” (generator drying).\nNOTICE:\nWe strongly advise against disabling humidity control permanently. Under\nadverse weather conditions, this can cause severe damage to the WEC!\nInfo:\nIf the maintenance switch is turned on or the Self Supply mode is activated, the\nabove function is not performed, even if the maximum","o":"","im":[],"k":"1:19"},{"i":299,"c":"Software","s":"Generator","t":"excitation current limitation","d":"20 January 2019","f":"Shared Software Info.pdf","p":[14],"r":"","b":"Excitation curve and excitation current limitation (V4.97):\nIn order to have a corresponding excitation current limitation in every operating point, in future excitation current curves will be\nrecorded for all five of the operating modes across the entire power range.\nThe following menus have been implemented under “Feeding data”:\n\nUse the grey keys to display the individual values of the characteristic curve. Press the Quit key to select the excitation current\ncurve for the four noise-optimised opera-tion modes.\n\nWhen the WEC is operating, a mean power and a mean excitation current are mapped for one minute each. This mean value is\napplied to the corresponding point of the excitation curve:\n\nShould the stored excitation curves be incorrect for unexplained reasons, there is an option to delete them. To do this, the service\ncode must first be entered. Then the grey keys are used to select the last value in the characteristic curve:\n\nPress both grey keys simultaneously to jump to the end of the characteristic curve. It may be necessary to repeat pressing both\nkeys simultaneously several times: Begin-ning à End à Middle à Beginning and so on. Pressing the Quit key clears all excita-tion\ncurves. However, this should only be used if it is certain that the characteristic curves are incorrect, or if changes have been made\nto the WEC that will definitely create an increased excitation current.","o":"excitation current limitation\n20 January 2019 14:18\nExcitation curve and excitation current limitation (V4.97):\nIn order to have a corresponding excitation current limitation in every operating point, in future excitation current curves will be\nrecorded for all five of the operating modes across the entire power range.\nThe following menus have been implemented under “Feeding data”:\nUse the grey keys to display the individual values of the characteristic curve. Press the Quit key to select the excitation current\ncurve for the four noise-optimised opera-tion modes.\nWhen the WEC is operating, a mean power and a mean excitation current are mapped for one minute each. This mean value is\napplied to the corresponding point of the excitation curve:\nShould the stored excitation curves be incorrect for unexplained reasons, there is an option to delete them. To do this, the service\ncode must first be entered. Then the grey keys are used to select the last value in the characteristic curve:\nPress both grey keys simultaneously to jump to the end of the characteristic curve. It may be necessary to repeat pressing both\nkeys simultaneously several times: Begin-ning a End a Middle a Beginning and so on. Pressing the Quit key clears all excita-tion\ncurves. However, this should only be used if it is certain that the characteristic curves are incorrect, or if changes have been made\nto the WEC that will definitely create an increased excitation current.","im":["Shared_Software_Info_014"],"k":""},{"i":300,"c":"Software","s":"Generator","t":"Rotor park heating","d":"20 January 2019","f":"Shared Software Info.pdf","p":[15],"r":"TD-esc-06-de-en-17-009 Rev000 IO Board 1 Control Cabinet CS101a V5.75","b":"5.15 Rotor park heating (V5.39 / V5.44 / V5.47 / V5.65):\nIn future the rotor park heating will be switched off for the sake of safety when the rotor monitoring system has activated. This will prevent\nan excitation current flowing in case of a defect to the pole shoe wiring, which might lead to a light arc with unforeseeableconsequences.\nThe rotor park heating will in future also be switched off as soon as the rotor lock is actuated. This measure is designed to reduce the\ndanger of electric shocks on contact with the rotor.\n\nThere are 10 levels to rotor park heating ( Parameter P1330) which Indicates the max level of the rotor\nheating-system of the generator. One level corresponds to:\n\nCS48: 1,0kW;\nCS82: 2,5kW;\nCS101: 2,5kW;\nCS126: 6,0kW","o":"","im":[],"k":""},{"i":301,"c":"Software","s":"Nacelle","t":"Angle monitoring at blade angle of 3°","d":"20 January 2019","f":"Shared Software Info.pdf","p":[16],"r":"TD-esc-06-de-en-15-060 Rev001 IO Board 1 Controlcabinet CS101a V5.20","b":"Angle monitoring at blade angle of 3° (V4.84):\nBy now, many WECs operate with continuous noise optimisation, whereby the mini-mum\nblade angle is often set to values greater than 3°. Additionally, the minimum blade angle is\noften temporarily increased in order to deactivate the angle monitoring in the case of a sensor\nfault. There is often the risk of forgetting to resolve the fault quickly and set the minimum\nblade angle correctly again.\nTo ensure regular monitoring of the blade angle in all WECs in future, at least once every 24\nhours the minimum blade angle is pitched forward to 2.3° and then back again immediately.\nThus, the transmitter for the angle monitoring is overridden at least once a day and the\ncorrect measurement of the blade angle is checked. For the majority of WECs, the minimum\nblade angle is 2.5° or less, and therefore this function has no effect.","o":"","im":[],"k":""},{"i":302,"c":"Software","s":"Nacelle","t":"42:4, “Pitch control error: Pitch speed too low during stop”","d":"20 January 2019","f":"Shared Software Info.pdf","p":[17],"r":"TD-esc-06-de-en-15-060 Rev001 IO Board 1 Controlcabinet CS101a V5.20","b":"Status 42:4, “Pitch control error: Pitch speed too low during stop” (V4.57):\nAfter a stop command has been transmitted to the pitch control system, I/O board 1 in the\ncontrol cabinet starts computing a target angle that must have been achieved by at least one\nrotor blade.\nIf this target angle is not achieved by at least one rotor blade during the stopping pro-cedure,\nstatus 42:4 (“Pitch control error: Pitch speed too low during stop”) is generat-ed and\nemergency pitching is activated by opening relay K3 on I/O board 1. There is no monitoring of\nblade angles during the stopping procedure if data transmission to the pitch control boxes is\ndisrupted and thus no updated blade angle can be received.\nAfter the stopping procedure is completed, Status 42:4 is first automatically cleared. Status 42\nturns into a fault message if it occurs more than seven times in 24 hours.","o":"","im":[],"k":"42:4"},{"i":303,"c":"Software","s":"Nacelle","t":"43:X MSC","d":"20 January 2019","f":"Shared Software Info.pdf","p":[18],"r":"TD-esc-06-de-en-15-060 Rev001 IO Board 1 Controlcabinet CS101a V5.20","b":"Monitoring the main safety circuit (V4.76):\nThe main safety circuit (MSC), is a safety circuit in which several assemblies, emer-gency switches and various sensors are looped in. Each of these\ncomponents is ca-pable of breaking the main safety circuit if required and thereby activate the emer-gency pitching system.\nWhen all contacts in the MSC are closed, the so-called main safety circuit tor -KF01 (-K01) in the rotor sub-distribution system closes and enables\npower supply of the blade safety circuit via the three main contacts. Auxiliary contact 21/22 of -KF01 connects input -X4.4 on the control board in\npitch control box A with +15 V sensor system. As long as the MSC is interrupted and -KF01 is open, input -X4.4 of Blade A is at 1 (H-level).\nThe following menu under “Sensor data” on the Blade A control board shows the cur-rent state of the digital inputs:\n\nThe main safety circuit (-X4.4) is in this case open. The current state of the MSC is transmitted via Bit 6 (7th bit from the right) in sensor bits 1 of\nBlade A to I/O board 1 in the control cabinet. The following menu under “General data” on I/O board 1 shows the current status of the pitch control\nbits:\n\nAfter resetting the control system, I/O board 1 in the control cabinet skips relay K3 and interrupts the MSC. Status 43:2, “Main safety circuit fault:\nError feedback” is gen-erated if bit 6 in sensor bits 1 of Blade A is not set within the first three seconds after the reset. This is provided that the data\ntransmission to Blade A is functioning. If bit 6 is not set, contactor -KF01 in the rotor sub-distribution system closes, even though the MSC is\ninterrupted or the opener on -KF01 (21/22) does not connect input -X4.4 of the Blade A control board with +15 V.\nSince this is a malfunction in the MSC or possibly even an error in the HSK wiring, Status 43:2 automatically becomes a fault message.\nTo differentiate it from status 43:2, the former status 43:0, “Fault main safety circuit” has been changed to status 43:1, “Fault main safety circuit:\nInterruption”. Status 43:1 indicates that the main safety circuit was interrupted accidentally, without any feed-back from the person who caused\nthis.","o":"43:X MSC TD-esc-06-de-en-15-060 Rev001 IO Board 1 Controlcabinet CS101a V5.20\n20 January 2019 14:48\nMonitoring the main safety circuit (V4.76):\nThe main safety circuit (MSC), is a safety circuit in which several assemblies, emer-gency switches and various sensors are looped in. Each of these\ncomponents is ca-pable of breaking the main safety circuit if required and thereby activate the emer-gency pitching system.\nWhen all contacts in the MSC are closed, the so-called main safety circuit tor -KFO1 (-KO1) in the rotor sub-distribution system closes and enables\npower supply of the blade safety circuit via the three main contacts. Auxiliary contact 21/22 of -KFO1 connects input -X4.4 on the control board in\npitch control box A with +15 V sensor system. As long as the MSC is interrupted and -KFO1 is open, input -X4.4 of Blade A is at 1 (H-level).\nThe following menu under “Sensor data” on the Blade A control board shows the cur-rent state of the digital inputs:\nThe main safety circuit (-X4.4) is in this case open. The current state of the MSC is transmitted via Bit 6 (7th bit from the right) in sensor bits 1 of\nBlade A to I/O board 1 in the control cabinet. The following menu under “General data” on I/O board 1 shows the current status of the pitch control\nbits:\nAfter resetting the control system, I/O board 1 in the control cabinet skips relay K3 and interrupts the MSC. Status 43:2, “Main safety circuit fault:\nError feedback” is gen-erated if bit 6 in sensor bits 1 of Blade A is not set within the first three seconds after the reset. This is provided that the data\ntransmission to Blade A is functioning. If bit 6 is not set, contactor -KFO1 in the rotor sub-distribution system closes, even though the MSC is\ninterrupted or the opener on -KFO1 (21/22) does not connect input -X4.4 of the Blade A control board with +15 V.\nSince this is a malfunction in the MSC or possibly even an error in the HSK wiring, Status 43:2 automatically becomes a fault message.\nTo differentiate it from status 43:2, the former status 43:0, “Fault main safety circuit” has been changed to status 43:1, “Fault main safety circuit:\nInterruption”. Status 43:1 indicates that the main safety circuit was interrupted accidentally, without any feed-back from the person who caused\nthis.","im":["Shared_Software_Info_018"],"k":"43:X"},{"i":304,"c":"Software","s":"Nacelle","t":"44 : x81 to 44:x83 emergency stop capacitors voltages","d":"20 January 2019","f":"Shared Software Info.pdf","p":[19],"r":"TD-esc-06-de-en-17-009 Rev000 IO Board 1 Control Cabinet CS101a V5.75","b":"5.35 Monitoring of emergency stop capacitors voltages: Status 44 : x81 to 44:x83 (V5.53):\nMeasurement and monitoring of the emergency stop capacitors voltages has been done until\nnow exclusively by the pitch control units. With this however there is a danger that the pitch\ncontrol system will be enabled although the emergency stop capacitors have not been charged\ncorrectly in some cases. Since the three pitch control units also transfer the capacitor voltages\nmeasured to I/O-board 1 in the control cabinet, additional monitoring of the capacitor\nvoltages is performed by the I/O-board.","o":"","im":[],"k":"44:x81"},{"i":305,"c":"Software","s":"Nacelle","t":"55:x31 Error Blade heating: No temperature rise blade","d":"20 January 2019","f":"Shared Software Info.pdf","p":[20],"r":"TD-esc-06-de-en-17-009 Rev000 IO Board 1 Control Cabinet CS101a V5.75","b":"5.34 Monitoring of the temperature increase in the rotor blades: Warning message 55:x31, “Error Bladeheating: No temperature rise blade x” (V5.53):\nIn the past it has happened time and time again that blade heating systems were switched on but did not heat because the heating element power supply was\ninterrupted somewhere. Until now this fault merely meant the blade heating system would not work. As a remedy for this, the power consumption of the blade\nheating system will be monitored indirectly in future.\nWarning message 55:31, “Error Bladeheating: No temperature rise blade A – C” is generated if a temperature rise of less than 5 °C is measured for all blades.\nWarning message 55:131 is generated if a temperature rise of less than 5 °C is measured for blade A. Accordingly warning messages 55:231 and 55:331 are\ngenerated for blade B and C. The blade heating system is deactivated in such cases for at least one hour.","o":"","im":[],"k":"55:x31"},{"i":306,"c":"Software","s":"Nacelle","t":"47:100, “Fault safety system: Emergency stop speed too low”","d":"20 January 2019","f":"Shared Software Info.pdf","p":[21],"r":"","b":"Status 47:100, “Fault safety system: Emergency stop speed too low” (V4.57):\nIf a specified target angle is not achieved by at least one rotor blade during the\nstop-ping procedure, the emergency pitching is activated by opening relay K3\non I/O board 1, as described under status 42:4. Now is the latest acceptable\npoint in time for the blade angles to change at the typical emergency pitching\nspeed. However, if the difference between the setpoint angle and the greatest\nblade angle of the three blades increases to more than 10°, this indicates\nfailure of the entire emergency pitching system. If the blade angles displayed\nby the pitch control system are correct, the WEC is in an extremely critical\ncondition.\nAn instruction to align the nacelle at right angles to the wind direction is\ntransmitted to I/O board 2 in the nacelle. This will take about 3 minutes;\nnevertheless, in a critical situation such as this it is the only remaining means\nto return the WEC to a non-critical condition.\nThe state machine for stopping the WEC switches to state 40.\nFault message 47:100 (Fault safety system: Emergency stop speed too low) is\ngen-erated. Due to its exceptionally high priority, fault message 47:100\noverwrites any fault message that may already be present. The reset lock on\nI/O board 1 in the na-celle is activated.\nNOTICE:\nIf, by the time technicians arrive at the WEC, all three blade angles are still in a\ncritical range of less than 50°, the rotor should be decelerated from the con-\ntrol cabinet by means of the rotor brake, provided that the speed is not excep-\ntionally high. Any other actions must be coordinated with Technical Service\nDispatch. The reset lock must not be cleared under any circumstances unless\nall three blades are in the 90° position. Clearing the reset lock also cancels the\ntransverse alignment instruction from I/O board 2 so that the WEC will align\nnormally with the wind direction. In any case, the root cause needs to be thor-\noughly investigated by appropriately trained personnel before the WEC may be\nput back into operation. If require","o":"","im":[],"k":"47:100"},{"i":307,"c":"Software","s":"Nacelle","t":"50:122/222/322 ‘Monitoring sensor: Bearing bolt connection blade A/B/C","d":"19 January 2022","f":"Shared Software Info.pdf","p":[22],"r":"","b":"TD-esc-06-de-en-20-067 Rev000 Pitch V6.69\n5.4 Monitoring of E-82 rotor blade bolts\nOn the E-82, an optional monitoring of the blade bearing bolts can be installed (see the program\ndescription TD-esc-06-de-xx-19-062, Pitch V6.58, section 5.5). When the monitoring is activated,\nstatus 50:122/222/322 ‘Monitoring sensor: Bearing bolt connection blade A/B/C’ is generated.\nThe status is generated with final shutdown and nacelle reset lock.","o":"","im":[],"k":"50:122"},{"i":308,"c":"Software","s":"Software related","t":"155:81, Wrong boot block address: I/O-board 1 control cabinet","d":"19 January 2022","f":"Shared Software Info.pdf","p":[23],"r":"","b":"TD-esc-06-de-en-20-043 Rev000 IO Board 1 Control Cabinet V6.85\n5.13 Status 155:81, Wrong boot block address: I/O-board 1 control cabinet (V6.80)\nThe boot block address is set on the I/O boards via DIP switches 1 to 4, binary coded. The individ-\nual address of the board, set by DIP switches, is added to base address 80. In the event the soft-\nware installed on the board does not match the set boot block address, status 155:81 will be gen-\nerated in future instead of a warning message.\n\n5.14 Disabling all outputs if the boot block address is set incorrectly (V6.80)\nIf I/O boards with installed software are interchanged within a wind energy converter, unforeseea-\nble malfunctions can occur, since all inputs and outputs are assigned completely different\nfunctions at the new position of the boards. For this reason, when inserting I/O boards of\nunknown origin and unknown, previously installed software or when exchanging I/O boards with\neach other, it is essen-tial to ensure that no malfunctions occur. This applies less to the inputs, but\nprimarily to the open collector and relay outputs. If control commands are transmitted from one\nboard to other assem-blies via digital inputs, malfunctions can also occur in this case, so that\ncorresponding control commands must not be transmitted either if the board is not located at the\nintended position in the control system.\n\nTo ensure that this is the case, in future the I/O board will evaluate the boot block address setting\nand check whether it matches the installed program. If the boot block address set by means of DIP\nswitches does not match the boot block address expected by the installed program, the program\nassumes that the board is located at a position within the control system not intended for the pro-\ngram. All open collector outputs and relays remain switched off in this case. In addition, the signals\nBlade in, Blade out, Yaw control left and Yaw control right are not forwarded to the pitch system\nor I/O board 2 in the nacelle, so that no incorrect control commands for adjusting the rotor blades\nor for manual yawing are transmitted.\n\nNOTICE\n1 Set DIP switches for the boot block address correctly after replacing a board\nAfter replacing a board and before switching on the power supply, it is essential to en-sure that\nthe boot block address is set according to the function of the board. Only if the boot block address\nis set correctly can an old program that is still installed (from V6.80) recognise that the board is in\na different position within the control system and ensure that no malfunctions with unforeseeable\nconsequences occur.\nFor the I/O board 1 in the nacelle, this means that, for DIP switches 1 to 4 (individual boot block\naddress), only DIP switch 1 must be switched on.","o":"","im":[],"k":"155:81"},{"i":309,"c":"Software","s":"Software related","t":"325:81 Checksum program memory check","d":"20 January 2019","f":"Shared Software Info.pdf","p":[24],"r":"TD-esc-06-de-en-17-009 Rev000 IO Board 1 Control Cabinet CS101a V5.75","b":"5.11 Checksum program memory check (Status 325:81) (V5.32):\nIn future a checksum program memory check will be made to check the program is working correctly.\nThe following menu under Special functions shows the setpoint, the reference-checksum and the program memory checksum currently\ncalculated:\n\nDepending on the runtime and length of the program, it may take several seconds after the I/O-board has been switched on until the actual\nchecksum is calculated the first time. Until then the actual value and the counters for the number of cycles are at 0:\n\nBy pressing the Quit-key, the actual-CRC32 and the two counters for OK and error can be reset at any time.\nIn cases where the setpoint and actual value of the checksum differ, the I/O-board will generate fault message 325:81, “Checksum error flash:\nI/O-board 1 control cabinet”. The error counter Err = in the menu will now be greater than zero:\n\nIn this case the I/O-board should first be rebooted. If the error occurs again, the program will need to be recopied to the I/O-board flash. If the\nerror keeps occurring, either the flash memory of the I/O-board is defective or the program was damaged during transfer. Once it is certain that\nthe program is OK e.g. it was able to be installed without any problems on other wind energy converters, the I/O-board will need to be replaced.","o":"325:81 Checksum program memory check TD-esc-06-de-en-17-009 Rev000 IO Board 1 Control Cabinet CS101a VS5.75.docx\n20 January 2019 12:43\n5.11 Checksum program memory check (Status 325:81) (V5.32):\nIn future a checksum program memory check will be made to check the program is working correctly.\nThe following menu under Special functions shows the setpoint, the reference-checksum and the program memory checksum currently\ncalculated:\nDepending on the runtime and length of the program, it may take several seconds after the I/O-board has been switched on until the actual\nchecksum is calculated the first time. Until then the actual value and the counters for the number of cycles are at 0:\nBy pressing the Quit-key, the actual-CRC32 and the two counters for OK and error can be reset at any time.\nIn cases where the setpoint and actual value of the checksum differ, the |/O-board will generate fault message 325:81, “Checksum error flash:\n1/0-board 1 control cabinet”. The error counter Err = in the menu will now be greater than zero:\nIn this case the I/O-board should first be rebooted. If the error occurs again, the program will need to be recopied to the I/O-board flash. If the\nerror keeps occurring, either the flash memory of the I/O-board is defective or the program was damaged during transfer. Once it is certain that\nthe program is OK e.g. it was able to be installed without any problems on other wind energy converters, the |/O-board will need to be replaced.","im":["Shared_Software_Info_024"],"k":"325:81"},{"i":310,"c":"Software","s":"Software related","t":"305:83 “No data from I/O Board control cabinet: I/O board 1  nacelle”","d":"20 January 2019","f":"Shared Software Info.pdf","p":[25],"r":"TD-esc-06-de-en-17-009 Rev000 IO Board 1 Control Cabinet CS101a V5.75","b":"5.12 Status 305:83, “No data from I/O Board control cabinet: I/O board 1 nacelle” (V5.32):\nBy modifying the data transfer between I/O-board 1 in the control cabinet and I/O-board 1 in\nthe nacelle, instances of status message 305:83 “No data from I/O-board 1: I/O-board 1\nnacelle” are to be reduced.","o":"","im":[],"k":"305:83"},{"i":311,"c":"Software","s":"Software related","t":"42:5 Pitch control error: Blade angle > 100°","d":"19 January 2022","f":"Shared Software Info.pdf","p":[26],"r":"","b":"TD-esc-06-de-en-20-043 Rev000 IO Board 1 Control Cabinet V6.85\n5.15 Monitoring overly large blade angles (V6.80)\nIf the blade angle values adopted are too high for unknown reasons and there is a risk that the\nemergency pitching limit switches will be overrun backwards, this can severely damage a wind\nenergy converter. For this reason, the three blade angles will now be additionally monitored by the\nI/O board 1 in the control cabinet. As soon as a blade angle exceeds 100° when the rotor lock is not\nset, the I/O board opens the main safety circuits and thus prevents the rotor blades from being\npitched to even greater angles. In this case status 42:5, Pitch control error: Blade angle > 100° is\ngenerated. As soon as all three blade angles are back within the permissible range, status 42:5 is\nautomatically cleared again after 10 s and the safety circuits are closed. This ensures that blade\nangles cannot exceed 100°, but also that individual blade angle measurement or transmission er-rors\ndo not directly result in a fault message.\nA prerequisite for this monitoring to work is that the blade angles are properly measured and\ntransmitted from the pitch control boxes to the I/O board.","o":"","im":[],"k":"42:5"},{"i":312,"c":"Software","s":"Temperatures","t":"Control cabinet fan","d":"20 January 2019","f":"Shared Software Info.pdf","p":[27],"r":"","b":"Control cabinet fan (V4.79):\nIn future, all WECs are equipped with a fan in the control cabinet.\nI/O board 1 switches on relay K7, and thus the control cabinet fan, when the\ncontrol cabinet temperature reaches 40 °C. At a temperature below 35 °C, the\nfan is switched off again after 10 s at the earliest.","o":"","im":[],"k":""},{"i":313,"c":"Software","s":"Temperatures","t":"Pitch motor heating.","d":"06 January 2022","f":"Shared Software Info.pdf","p":[28],"r":"","b":"SW-description TD-esc-06-de-en-17-037 Rev000 Pitch V5.98:\n\nThe heating will be activated if the spinner temp is < 5°C and the motor temp is < 50°C.\nThe heating will be deactivated if the spinner temp is > 10°C and the motor temp is > 50°C.","o":"Pitch motor heating.\n06 January 2022 16:06\nSW-description TD-esc-06-de-en-17-037 Rev000 Pitch V5.98:\nrs ENERCON Software Description\nWA ENERGY FOR THE WORLD Pitch V5.98\n5.6 Pitch motor heating\nThe motor heating is programmed to prevent the pitch motors or the motor brakes icing up at low\ntemperatures and malfunctions thus occurring. Heating up the gear is also achieved when the mo-\ntor is heated and the gear oil's viscosity thus reduced.\nThe motor heating status and the motor temperature can be called up in the “Motor menu” menu\nunder the “Motor heating:\" submenu:\nThe heating will be activated if the spinner temp is < 5°C and the motor temp is < 50°C.\nThe heating will be deactivated if the spinner temp is > 10°C and the motor temp is > 50°C.","im":["Shared_Software_Info_028"],"k":""},{"i":314,"c":"Software","s":"Temperatures","t":"Rectifier temperature","d":"20 January 2019","f":"Shared Software Info.pdf","p":[29],"r":"TD-esc-06-de-en-17-005 Rev000 IO Board 1 Controlcabinet CS82a V5.75","b":"5.47 Control temperature for rectifier (V5.68):\nDue to an increasing number of cases where power limitation was caused by an excessive rectifier temperature, the\npower limitation temperature limit of the heat sink has been increased from 82 °C to 91 °C for WEC types E-82 E2,\nE3, E4 and E-92. For WEC types E-70 E4 and E-82 with 2 MW and 3 MW, the old limit of 82 °C has been retained\nbecause they are equipped with rectifiers that do not allow an increase of the control temperature.","o":"","im":[],"k":""},{"i":315,"c":"Software","s":"Temperatures","t":"Stator control temperature","d":"20 January 2019","f":"Shared Software Info.pdf","p":[30],"r":"TD-esc-06-de-en-15-056 Rev000 IO Board 1 Controlcabinet CS82a V5.20","b":"Stator control temperature (Only WECs with water cooling system) (V4.63):\nFor safety reasons, the stator control temperature is limited to 114 °C if the coolant pump of\nthe water cooling system of the stator has not been switched on yet at this stator\ntemperature.","o":"","im":[],"k":""},{"i":316,"c":"Software","s":"Temperatures","t":"Transformer room temperature","d":"20 January 2019","f":"Shared Software Info.pdf","p":[31],"r":"","b":"                                                              TD-esc-06-de-en-15-056 Rev000 IO Board 1 Controlcabinet CS82a V5.20\n\nTransformer room temperature (V4.76):\nWECs can be equipped with an optional temperature sensor for measuring the trans-former room temperature.\nThe temperature sensor is detected automatically by control cabinet I/O board 1 when the temperature at input X3.5B (PT100 5)\nremains under 80 °C for more than 10 s. The I/O board stores this information permanently. The corresponding menu under\n“Sensor data” shows the current temperature in the transformer room:\n\nMonitoring the sensor:\nWarning message 95:804 (Fault temperature measurement : Transformer room) is generated when the temperature at input X3.5B\ndrops below -41 °C or rises above 100 °C for at least 5 seconds.\nInfo:\nIn the event that a temperature sensor in the transformer room has been detected er-roneously even though it not installed,\nautomatic detection of the sensor can be reset by pressing both grey buttons simultaneously in the “Curr. I/O warnings” menu\nunder “Special functions”. As a prerequisite, however, this must display warning message 95:804.\nPower limitation when transformer room temperature is too high:\nIf the temperature in the transformer room reaches a value above 44 °C, the tower fans are initially switched to level 1. At\ntemperatures below 40 °C, level 1 is switched off again. If the temperature rises above 48 °C, level 2 of the tower fans is activated. It\nis deactivated again at temperatures below 45 °C. If the temperature rises above 52 °C, the optional exhaust air valves in the tower\nopen up. They close again at tem-peratures below 48 °C.\nThe following menu under “Feeding data” indicates the current reason for a power limitation:\n\nNext to the maximum power based on transformer room temperature, the third line indicates the current temperature.\nWarning message 230:110 (Power limitation (10h) : Transformer room temperature) is generated each time a WEC has been limited\nfor","o":"Transformer room temperature\n20 January 2019 14:19 TD-esc-06-de-en-15-056 Rev000 IO Board 1 Controlcabinet CS82a V5.20\nTransformer room temperature (V4.76):\nWECs can be equipped with an optional temperature sensor for measuring the trans-former room temperature.\nThe temperature sensor is detected automatically by control cabinet I/O board 1 when the temperature at input X3.5B (PT100 5)\nremains under 80 °C for more than 10 s. The I/O board stores this information permanently. The corresponding menu under\n“Sensor data” shows the current temperature in the transformer room:\nMonitoring the sensor:\nWarning message 95:804 (Fault temperature measurement : Transformer room) is generated when the temperature at input X3.5B\ndrops below -41 °C or rises above 100 °C for at least 5 seconds.\nInfo:\nIn the event that a temperature sensor in the transformer room has been detected er-roneously even though it not installed,\nautomatic detection of the sensor can be reset by pressing both grey buttons simultaneously in the “Curr. I/O warnings” menu\nunder “Special functions”. As a prerequisite, however, this must display warning message 95:804.\nPower limitation when transformer room temperature is too high:\nIf the temperature in the transformer room reaches a value above 44 °C, the tower fans are initially switched to level 1. At\ntemperatures below 40 °C, level 1 is switched off again. If the temperature rises above 48 °C, level 2 of the tower fans is activated. It\nis deactivated again at temperatures below 45 °C. If the temperature rises above 52 °C, the optional exhaust air valves in the tower\nopen up. They close again at tem-peratures below 48 °C.\nThe following menu under “Feeding data” indicates the current reason for a power limitation:\nNext to the maximum power based on transformer room temperature, the third line indicates the current temperature.\nWarning message 230:110 (Power limitation (10h) : Transformer room temperature) is generated each time a WEC has been limited\nfor","im":["Shared_Software_Info_031"],"k":""},{"i":317,"c":"Software","s":"Tower","t":"192:201 three-phase UPS operation and faults","d":"20 January 2019","f":"Shared Software Info.pdf","p":[32],"r":"TD-esc-06-de-en-15-060 Rev001 IO Board 1 Controlcabinet CS101a V5.20","b":"Monitoring the three-phase UPS operation and faults in the UPS output voltage (status\n192:201 and 192:202) (V4.83):\nIn the event of a grid fault the Power Control board activates the UPS in order to maintain the\nthree-phase supply to the components in the tower and the nacelle for the duration of the\ngrid fault.\nThe following menu under “General data” on control cabinet I/O board 1 shows the so-called\nsensor bits of the Power Control board; these are the bits received from the Power Control\nboard for controlling various functions:\n\nBit 1 (second bit from the right) in Sensor bits 2 (SB2) is on 1 for as long as the Power Control\nboard detects a grid fault. Because this activates the UPS, Bit 2 in SB2 also equals 1 as shown\nhere. This means that the UPS supplies the WEC control system with three-phase current. Bit 3\n(fourth bit from the right) is on 1 if the UPS output volt-age is below the permitted limit for a\ncertain time period. This can be the result of overload. It can also indicate a fault in the UPS.\nStatus 192:201 (Fault UPS: Timeout three-phase operation) is generated if the UPS remains\nactivated for more than 60 seconds while the WEC is running. If the UPS remains in three-\nphase operation for more than 10 minutes while the WEC is stopped, status 192:201 turns into\na fault message. Status 192 turns into a fault mes-sage if it occurs five times within 24 hours.\nStatus 192:202 (Fault UPS: Timeout fault output voltage) is generated if the UPS re-ports an\noutput voltage fault for more than 60 seconds while the WEC is running. If the output voltage\nfault is present for more than 10 minutes while the WEC is stopped, status 192:202 turns into\na fault message. Status 192 turns into a fault mes-sage if it occurs five times within 24 hours.","o":"192:201 three-phase UPS operation and faults TD-esc-06-de-en-15-060 Rev001 IO Board 1 Controlcabinet CS101a V5.20\n20 January 2019 14:50\nMonitoring the three-phase UPS operation and faults in the UPS output voltage (status\n192:201 and 192:202) (V4.83):\nIn the event of a grid fault the Power Control board activates the UPS in order to maintain the\nthree-phase supply to the components in the tower and the nacelle for the duration of the\ngrid fault.\nThe following menu under “General data” on control cabinet I/O board 1 shows the so-called\nsensor bits of the Power Control board; these are the bits received from the Power Control\nboard for controlling various functions:\nBit 1 (second bit from the right) in Sensor bits 2 (SB2) is on 1 for as long as the Power Control\nboard detects a grid fault. Because this activates the UPS, Bit 2 in SB2 also equals 1 as shown\nhere. This means that the UPS supplies the WEC control system with three-phase current. Bit 3\n(fourth bit from the right) is on 1 if the UPS output volt-age is below the permitted limit for a\ncertain time period. This can be the result of overload. It can also indicate a fault in the UPS.\nStatus 192:201 (Fault UPS: Timeout three-phase operation) is generated if the UPS remains\nactivated for more than 60 seconds while the WEC is running. If the UPS remains in three-\nphase operation for more than 10 minutes while the WEC is stopped, status 192:201 turns into\na fault message. Status 192 turns into a fault mes-sage if it occurs five times within 24 hours.\nStatus 192:202 (Fault UPS: Timeout fault output voltage) is generated if the UPS re-ports an\noutput voltage fault for more than 60 seconds while the WEC is running. If the output voltage\nfault is present for more than 10 minutes while the WEC is stopped, status 192:202 turns into\na fault message. Status 192 turns into a fault mes-sage if it occurs five times within 24 hours.","im":["Shared_Software_Info_032"],"k":"192:201"},{"i":318,"c":"Software","s":"Tower","t":"Automatic detection of access control (door switch) (V4.86):","d":"20 January 2019","f":"Shared Software Info.pdf","p":[33],"r":"TD-esc-06-de-en-15-060 Rev001 IO Board 1 Controlcabinet CS101a V5.20","b":"Automatic detection of access control (door switch) (V4.86):\nAfter a reset of the control system, many WECs generate warning message 235:1, “Access\ncontrol: Tower door open” one time. This is because the bridge that connects input X8.6A with\n+20 V in WECs without a door switch was not installed during pro-duction. Because this\nwarning message is usually not noticed, the bridges are also not retrofitted. To prevent the\ncorresponding WECs from continuing to generate these warning messages, an automatic\ndetection of the door switch has been programmed. Only when input X8.6A is connected for at\nleast 1 s with +20 V does the I/O board de-tect that a door switch is installed. This applies to all\nWECs that have either a bridge or a door switch. In the WECs in which input X8.6A was never\nconnected with +20 V, no monitoring of the input is performed. Thus, no warning message\n235:1 will be generated here in future.\nShould a door switch be detected erroneously even though none is installed, a bridge must be\ninstalled in the relevant WEC that connects input X8.6A with +20 V perma-nently.","o":"","im":[],"k":""},{"i":319,"c":"Software","s":"Tower","t":"Low voltage earth fault.","d":"20 January 2019","f":"Shared Software Info.pdf","p":[34],"r":"TD-esc-06-de-en-15-060 Rev001 IO Board 1 Controlcabinet CS101a V5.20","b":"LV earth fault detection system (V3.68):\nAll CS101a systems are equipped with an LV earth fault detection system. As with a CS82a\nsystem, DIP switch 5 must be switched on on the earth fault sensor. Thus, the current limit\nis approx. 20 A. (see also the program description for the CS82a I/O control cab. V3.60,\nsection 4).\n\n    See\n    TD-esc-06-ger-eng-13-040 Rev001 Control cabinet IO Board V4.35\n    15.) New current sensor for LV earth fault monitoring","o":"","im":[],"k":""},{"i":320,"c":"Software","s":"EP3","t":"Roller bearing lubrication","d":"19 January 2022","f":"Shared Software Info.pdf","p":[35],"r":"","b":"TD-esc-06-de-en-20-067 Rev000 Pitch V6.69\n5.3 Roller bearing lubrication\nIn the E-115 EP3 VT, blade flange bearings with roller bearings (instead of ball bearings) have\nbeen installed for testing purposes. These bearings require hourly lubrication by moving the\nblade by at least 6°. This hourly lubrication is carried out automatically by this software. If the\nsystem has already been moved by 6° or more within the last hour due to regular system\noperation (start, stop; blade control), the hourly lubrication is not carried out additionally. The\nnext lubrication is then car-ried out after one hour.","o":"","im":[],"k":""},{"i":321,"c":"Software","s":"EP3","t":"42:160/260/360 Current monitoring of the motor field","d":"19 January 2022","f":"Shared Software Info.pdf","p":[36],"r":"","b":"TD-esc-06-de-en-20-067 Rev000 Pitch V6.69\n5.8 Current monitoring of the motor field (status 42:160/260/360 and 42:161/261/361)\nIn all CS101 (E-101; E-115; E-126 EP3), the field current of the pitch motors is monitored. How-ever,\nthere have been frequent cases of false alarms. The monitoring has been optimised to avoid false\nalarms. In the ‘Motor menu’, the current field current can be read:\nThe field current in pitch operation is approx.:\n• E-101 with one pitch motor per blade 1.0 A\n• E-101 with two pitch motors per blade 1.4 A\n• E-115 with two pitch motors per blade 1.4 A\n• E-115 VT with one pitch motor per blade 1.0 A\n• E-126 EP3 with two pitch motors per blade 1.1 A","o":"","im":[],"k":"42:160"},{"i":322,"c":"Software","s":"EP3","t":"42:161/261/361 Current monitoring of the motor field","d":"19 January 2022","f":"Shared Software Info.pdf","p":[37],"r":"","b":"TD-esc-06-de-en-20-067 Rev000 Pitch V6.69\n5.8 Current monitoring of the motor field (status 42:160/260/360 and 42:161/261/361)\nIn all CS101 (E-101; E-115; E-126 EP3), the field current of the pitch motors is monitored. How-ever,\nthere have been frequent cases of false alarms. The monitoring has been optimised to avoid false\nalarms. In the ‘Motor menu’, the current field current can be read:\nThe field current in pitch operation is approx.:\n• E-101 with one pitch motor per blade 1.0 A\n• E-101 with two pitch motors per blade 1.4 A\n• E-115 with two pitch motors per blade 1.4 A\n• E-115 VT with one pitch motor per blade 1.0 A\n• E-126 EP3 with two pitch motors per blade 1.1 A","o":"","im":[],"k":"4 ec ^\n% Password expiration warning.\n--------------------------------------------------------------\n---------\n\nCisco Configuration Professional (Cisco CP) is installed on\nthis device\nand it provides the default username \"cisco\" for one-time\nuse. If you have\nalready used the username \"cisco\" to login to the router and\nyour IOS image\nsupports the \"one-time\" user option, then this username has\nalready expired.\nYou will not be able to login to the router with this username\nafter you exit\nthis session.\n\nIt is strongly suggested that you create a new username with a\nprivilege level\nof 15 using the following command.\n\nusername <myuser> privilege 15 secret 0 <mypassword>\n\nReplace <myuser> and <mypassword> with the username and\npassword you\n\npassword you\nwant to use.\n\n--------------------------------------------------------------\n---------\n^\nbanner login ^\n--------------------------------------------------------------\n---------\nCisco Configuration Professional (Cisco CP) is installed on\nthis device.\n\nThis feature requires the one-time use of the username \"cisco\"\nwith the\npassword \"cisco\". These default credentials have a privilege\nlevel of 15.\n\nYOU MUST USE CISCO CP or the CISCO IOS CLI TO CHANGE THESE\nPUBLICLY-KNOWN CREDENTIALS\n\nHere are the Cisco IOS commands.\n\nusername <myuser>   privilege 15 secret 0 <mypassword>\nno username cisco\n\nReplace <myuser> and <mypassword> with the username and\npassword you want\nto use.\n\nIF YOU DO NOT CHANGE THE PUBLICLY-KNOWN CREDENTIALS, YOU WILL\nNOT BE ABLE TO LOG INTO THE DEVICE AGAIN AFTER YOU HAVE LOGGED\nOFF.\n\nFor more information about Cisco CP please follow the\ninstructions in the\nQUICK START GUIDE for your router or go to\nhttp://www.cisco.com/go/ciscocp\n--------------------------------------------------------------\n---------\n^\n!\nno cdp run\n!\n!\nline con 0\n  login local\nline vty 0 4\n  access-class 23 in\n  privilege level 15\n  login local\n  transport input "Weston Power","d":"23 July 2020","f":"Shared Info.pdf","p":[70],"r":"","b":"","o":"Weston Power\n23 July2020 09:36\nFor day to day outage queries or issues of a non urgent or general enquiry, please contact the WPD nominated person detailed on the 4 week generator report or via the following e-mail\nin boxes.\n* WPD South Wales and South West area: wpdswestwalesgen@westernpower.co.uk\n© WPD East Midlands area : wpdeastmidgen@westernpower.co.uk\n© WPD West Midlands area: wpdwestmidgen@westernpower.co.uk\nAlternatively, please contact Stephen Ransome directly via 029 20 535701 or sransome @westernpower.co.uk Monday to Friday. Please also “copy in” include the appropriate e-mail\naddress for the area in which the generator site is located.\nFor any out of hours enquiries, system faults or should the enquiry be urgent in nature please contact our Control Rooms directly via :\nCardiff Control Centre\n* South Wales connected generation 02920 332843\n* South West connected generation 02920 332863\nPegasus Control Centre\n* East Midlands connected generation 0845 2661722\n* West Midlands connected generation 0845 266 1688\nIn addition, access to the Western Power Distribution generator portal is available via our website, for visibility for future outages/export constraints and general background information\nfor each generator site. This information is generally focussed at the moment for generator connections at 33kV, 66kV and 132kV.\nPlease visit www.generation.westernpower.co.uk for more information.\nShould you have not yet signed up to access the generator portal, or if any contact details, gate access codes etc. have changed for a generator site within our area please contact Neil\nMansell on 02920 535706 or nmansell@westernpower.co.uk Monday to Friday. Please also “copy in” include the appropriate e-mail address for the area in which the generator site is\nlocated.\nTo obtain access to the Generator Portal, please provide a unique e-mail account for your business which has to be available for all appropriate staff within your business to use and again\nplease liaise with Neil Mansell on 02920 535706 or nmansell@westernpower.co.uk Monday to Friday.\nWe hope this is helpful.\nRegards,\nStephen Ransome,\nOperations Support Engineer,","im":["Shared_Info_070"],"k":""},{"i":353,"c":"General","s":"Forms","t":"Major Damage reporting","d":"24 December 2020","f":"Shared Info.pdf","p":[71],"r":"","b":"  Damage            ESC_TP_Inv\nreprot 8D...        estigation...\n\nThese two forms will require completing and submitting to Germany though ticketing system.\n\n    ESC_PI_Wo\n    rkflow in ...","o":"","im":[],"k":""},{"i":354,"c":"General","s":"Forms","t":"Overtime claim form","d":"02 August 2021","f":"Shared Info.pdf","p":[72],"r":"","b":" overtime\nclaim for...","o":"","im":[],"k":""},{"i":355,"c":"General","s":"IPAD","t":"Ipad info.","d":"19 January 2021","f":"Shared Info.pdf","p":[73],"r":"","b":"   EMC_Traini         iPad_Basic\n   ng-presen...       s_Trainin...\n\nReinstalling      EMC_User\n the EMC           _Guide","o":"","im":[],"k":""},{"i":356,"c":"General","s":"IPAD","t":"Missing function on IPAD","d":"19 January 2021","f":"Shared Info.pdf","p":[74],"r":"","b":"  I-PAD -\nEMC Miss...","o":"","im":[],"k":""},{"i":357,"c":"General","s":"IPAD","t":"Parameters from IPAD","d":"02 September 2021","f":"Shared Info.pdf","p":[75],"r":"","b":"When attempting a parameter update from the Ipad, should you receive the following message:\n\nThe Lightning to USB 3 Camera Adapter must be used!\n\nYou need to plug in the ipad power supply, but it must be the ipad power supply as it has a higher\ncharge than a phone charger.","o":"Parameters from IPAD\n02 September 2021 07:57\nWhen attempting a parameter update from the Ipad, should you receive the following message:\nCannot Use Accessory\nThe Lightning to USB 3 Camera Adapter must be used!\nYou need to plug in the ipad power supply, but it must be the ipad power supply as it has a higher\nc nge button)\nHello everyone\nBefore you use a day code please double-check that the date and time in “general data” of the I/O\nboard is right.\nIn case the date is wrong the day code will be refused by the turbine with the message “wrong\ncode”. That happens because the code is valid only for the 24 hours of today!\nThank you!\nB 432056\nENERCON\nDreekamp 5\n26605 Aurich\n11:32\n4 » Fille Enter","im":["Shared_Info_085"],"k":""},{"i":368,"c":"General","s":"Other","t":"ESA - ENERCON Service Assistant","d":"23 December 2020","f":"Shared Info.pdf","p":[86],"r":"","b":"  RE ESA\nUpdate & ...","o":"","im":[],"k":""},{"i":369,"c":"General","s":"Other","t":"FSM - Field service management","d":"18 November 2021","f":"Shared Info.pdf","p":[87],"r":"","b":"   Best\nPractice_EN\n\n    FSM\ntraining p...\n\n   FSM\nproject pl...","o":"","im":[],"k":""},{"i":370,"c":"General","s":"Other","t":"Generator hire","d":"24 November 2020","f":"Shared Info.pdf","p":[88],"r":"","b":"Hiring of Generator for long term outages","o":"","im":[],"k":""},{"i":371,"c":"General","s":"Other","t":"h&S doc's","d":"21 January 2021","f":"Shared Info.pdf","p":[89],"r":"","b":"basic guidance in the BA_bl 1001","o":"","im":[],"k":""},{"i":372,"c":"General","s":"Other","t":"Heater purchase in UK","d":"14 December 2020","f":"Shared Info.pdf","p":[90],"r":"","b":"","o":"Heater purchase in UK\n14 December 2020\n€ c\n13:39\n@ puravent.co.uk/b\npuravent\nHome / BX 9SE electric fan heater 9kw\nDouble click on above image to view full picture\n= {e—_- ©\nMORE VIEWS\n¥ — Enter your search\nBX 9SE electric fan heater 9kw\nSKU: BX 9SE\nEnquire For Price\nQuick Overview\nBX 9SE electric tan heater 9ky,","im":["Shared_Info_090"],"k":""},{"i":373,"c":"General","s":"Other","t":"Hot works.","d":"26 August 2020","f":"Shared Info.pdf","p":[91],"r":"","b":"    RE\ncorriegart...","o":"","im":[],"k":""},{"i":374,"c":"General","s":"Other","t":"HV Additional checks","d":"18 December 2019","f":"Shared Info.pdf","p":[92],"r":"","b":"    hv\nmaintena...","o":"","im":[],"k":""},{"i":375,"c":"General","s":"Other","t":"Ice on blades","d":"17 December 2019","f":"Shared Info.pdf","p":[93],"r":"","b":"                                                                                         Ice on\n                                                                                         Blades\n\nAfter discussing the issue regarding ice on blades with H&S yesterday the following has been put forward:\n\nIf ice is suspected on blades with the WEC stopped in fault we can attend, however we must yaw the WEC so that the blades areaway from the tower entrance door to minimize the risk of ice falling on persons\nduring access & egress.\n\nFrom this point on regarding restart of turbines, we must seek permission from the customer/OC as the higher risk of ice throw will be during the operation of the WEC once the WEC is back in their control. This will\nneed to be obtained in writing, which can be done by contacting the office. If permission is not granted the WEC will not be restarted.\n\nIf permission is granted the process would be to request a SCADA stop of the WEC in question from the office, once this stop is confirmed the technician can remove the maintenance switch and set the WEC to start\n(The WEC will not start at this point with our SCADA stop in place). The turbine will also likely have a 14:16 – Ice detection preventative warning that will need to be cleared from the I/O board before leaving the\nWEC. The technicians will then leave to a safe distance. Once clear of the WEC they will then call the IHT to start the turbine. This obviously makes test running WEC’s a difficult process, however it is one we will\nneed to follow. From the office we can inform you of any further fault messages we receive via SCADA.","o":"","im":[],"k":""},{"i":376,"c":"General","s":"Other","t":"Ice throw in dangerous locations","d":"23 December 2020","f":"Shared Info.pdf","p":[94],"r":"","b":"An issue occurred at War
