 gold LA\n412319 slip ring unit COBHAM V5 E48\n511360 sensor current KS30Q150KN-L\n514290 PCB facts-power control V1.3 )\n1|SCADA S:92/1\nusedin% Quantity\n18%\n16%\n8%\n5%\n5%\n5%\n5%\n5%\n3%\n3%\n3%\n3%\n3%\n3%\n3%\n3%\n3%\n3%\n3%\n3%\nSO BOO SSD SOOO MMNMNWOS","im":["shared_fault_info_1_102","shared_fault_info_1_103","shared_fault_info_1_104"],"k":"92:XX"},{"i":68,"c":"Faults","s":"50-99","t":"92:10 Low voltage earth fault.","d":"27 February 2018","f":"shared fault info 1.pdf","p":[105],"r":"","b":"                                                                                                                 On Moss Morran it was a case that when the 92:10 fault occurred connection to the turbine would be                                                 92: 10; “Low voltage earth fault detection: Earth fault control system\n                                                                                                                 lost. This was because of a faulty FACTS power PCB preventing the energisation of the rest of the control\n                                                                                                                 system.                                                                                                                                            Low voltage earth fault.\n\nTD-esc-01-ger-xxx-12-010\n\nTicket 70027030 has good breakdown of points to look into\n\nSubject          Mossmorran 92:10\nFrom             Benjamin Arndt\nTo               Team16 Service-UK\nCc               Christopher Hughes; Marc Dewing\nSent             17 September 2018 12:49\nAttachments\n                                                                                                                                                                             Cause service:\n                                                                                                                                                                             - Defective surge (in the cabinet)\n                                                                                                                                                                             - Earth Fault blade heating\n                     92_10                                                                                                                                                   - Lighting (defective ballasts)\n                                                                                                                                                                             - Heaters, fan\n                                                                                                                                                                             - Circuit board power supplies\n                                                                                                                                                                             - Wiring sensor\n                                                                                                                                                                             - Possible components to electrical outlets\n                  CT settings\n                   for Barra                                                                                                                                                 From <https://srv-p-masterdata01.enercon.de/status/statusdescription/92:10/id/10417>\n\nHello\n\nI have attached some details about Low voltage earth faults.\n\n     1. It can be an issue with the N and PE separation in the turbine. If that has not been assembled\n        properly that can be the problem. Please see 92:10 document for the explanation how to test it.\n\n     2. It can that the LV fault measurement does not work properly. That could be a broken CT or IO\n        board. For some CT settings I have attached an old email.\n\n     3. If the two things above are both not the cause there needs to be full investigation of the turbine.\n        Maybe check the book first about other issues in the past and see since when the fault is on the\n        turbine (the first time). I have attached the file 92_1 as well. It shows some causes that we have\n        had on other turbines. So the fault then can be for example on the SRU, in the pitch box, one of\n        the heaters inside an inverter a motor/or fan ... please have a look at the attached.\n\nWith regards / Mit freundlichen Grüßen\nBen Arndt, M.Eng.\nIn-House Technical Support\n\n------------------------------------------------------------\nENERCON Services UK Ltd.\nMace House, 3 Sovereign Court,\nErmine Business Park, Huntingdon PE29 6XU\n01480 415852\ntechnical-uk@enercon.de\nwww.enercon.de\n------------------------------------------------------------\nENERCON Services UK Ltd. ∙ Registered Place of Business: Companies House Cardiff ∙ Commercial Registration No. 05634531 ∙ Managing\nDirector: Julian Martin\nThis e-mail message together with its attachments, if any, is confidential and may contain information subject to legal privilege (e.g. attorney-\nclient-privilege). If you are not the intended recipient or have received this e-mail in error, please inform us immediately and delete this\nmessage. Any unauthorised copying of this message (and attachments) or unauthorised distribution of the information contained herein is\nprohibited.","o":"","im":[],"k":"92:10"},{"i":69,"c":"Faults","s":"50-99","t":"95:XX Fault temperature measurement","d":"18 September 2020","f":"shared fault info 1.pdf","p":[106],"r":"","b":"Warning message for stator temperature below -350C or exceeds +1560C\nDifferent between the temperatures bigger than 15 oc\nStop with several defect sensors\n\nPossible cause\nDefect temperature sensor (PTI OO/PTC)\nLoose connection within sensor cable\n\nPossible repair method\nConnect back-up sensor\nChange sensor cable\nStick in new sensor (consultation with ESC EE before)","o":"95:XX Fault temperature measurement\n18 September 2020 13:49\nWarning message for stator temperature below -350C or exceeds +1560C\nDifferent between the temperatures bigger than 15 oc\nStop with several defect sensors\nPossible cause\nDefect temperature sensor (PTI OO/PTC)\nLoose connection within sensor cable\nPossible repair method\nConnect back-up sensor\nChange sensor cable\nStick in new sensor (consultation with ESC EE before)","im":["shared_fault_info_1_106"],"k":"95:XX"},{"i":70,"c":"Faults","s":"50-99","t":"95:1 Spinner temp measurment.","d":"08 March 2017","f":"shared fault info 1.pdf","p":[107],"r":"","b":"One issue causing the Bearing overtemp faults are the 95:1 Error measurement. If there is\nno plausible fault with the Bearing temp sensors then investigate the spinner. Please see TSI\n01 - 04-027 for incorrect installation of this.","o":"95:1 Spinner temp measurment.\n08 March 2017\n11:30\n17:37:14\n17:31:09\n17:30:05 |\n17:27:42\n17:21:33\n17:21:33\n12:59:58\n12:59:58\nBearing temperature\nTurbine in operation\nTurbine starting\nTurbine operational\nBearing temperature\nBearing temperature\nOvertemp. rear bearing\n: Overtemp. rear bearing\n: Overtemp. front bearing\nDAM MED\n16:01:17\n00:06:05\n00:01:04\n00:02:23\n00:06:09\n00:00:00\n:10\nInformation / Warnings\nOne issue causing the Bearing overtemp faults are the 95:1 Error measurement. If there is\nno plausible fault with the Bearing temp sensors then investigate the spinner. Please see TSI\n01 - 04-027 for incorrect installation of this.","im":["shared_fault_info_1_107"],"k":"95:1"},{"i":71,"c":"Faults","s":"50-99","t":"95:241 , 251 , 261","d":"29 October 2018","f":"shared fault info 1.pdf","p":[108],"r":"","b":"Subject      fault 95:241 - how to fix the fault\nFrom         Benjamin Arndt                                                                                                                                                  Problem description.\n                                                                                                                                                                             After software update too Pitch V5.86 the status 95:241/251/261 appeard.\nTo           Team41 Service-UK\nCc           &UK-Technical                                                                                                                                                   Possible solution.\nSent         29 October 2018 13:28                                                                                                                                           There is implemented a monitoring of the emergency-capacitor of all three\n                                                                                                                                                                             blades in software V5.86.\n                                                                                                                                                                             If this status will appear after software update, the wiring must be checked.\nHello                                                                                                                                                                        The resistor of the sensor (between X6:1 and X6:3 on the Control Board\n                                                                                                                                                                             Pitch) must be approx 960 Ohm.\nsorry... this time in English...\n\nThe fault 95:241 error temp measurement – capacitor box which can occur after a software update has been answered\nin a ticket. See below.\nThis might help so that you do not need to put the old software back on.\n\nESC Ticket: 70002610, STATUS 95:241-251-261\n28. November 2017 | 15:55 | PANAGIOTIS DRAKOPOULOS | Info by First-Level\nProblem solved.Wiring was wrong on the control board pitch\n\n24. November 2017 | 09:37 | Stanley Huang | Info by First-Level\nWe have a same problem in E44 CS48a turbine.\nOur technicians swap the pin of capacitor box plug from 5 to 4 for both box B and C\n\n18. October 2017 | 10:39 | Matthias Waitz | Info by First-Level\nIn the plug at the capacitor box (wiring WG01) the cores 1 and 4 are swapped.\nSo the temperature of the heating resistors is getting measured against N-potetial and not against GND of control pcb\npitch..\nThe incorrect wiring has not been detected until now because the temperature of the capacitors has not been watched till\nnow. This has been activated since IO software control cab. V5.20.\nSo if you get this type of fault please check the wiring. When measuring the resistance between X6:1 and X6:3 on the\nControl Board Pitch, there should be a value of about 960 Ohm.\n\nWith regards / Mit freundlichen Grüßen\nBen Arndt, M.Eng.\nIn-House Technical Support\n\n------------------------------------------------------------\nENERCON Services UK Ltd.\nMace House, 3 Sovereign Court,\nErmine Business Park, Huntingdon PE29 6XU\n01480 415852\ntechnical-uk@enercon.de\nwww.enercon.de\n------------------------------------------------------------\nENERCON Services UK Ltd. ∙ Registered Place of Business: Companies House Cardiff ∙ Commercial Registration No. 05634531 ∙ Managing Director: Julian Martin\nThis e-mail message together with its attachments, if any, is confidential and may contain information subject to legal privilege (e.g. attorney-client-privilege). If you\nare not the intended recipient or have received this e-mail in error, please inform us immediately and delete this message. Any unauthorised copying of this message\n(and attachments) or unauthorised distribution of the information contained herein is prohibited.","o":"95:241, 251, 261\n29 October 2018 13:29\nSubject | fault 95:241 - how to fix the fault\nFrom | Benjamin Arndt\nTo Teamdi Service-UK\ncc &UK-Technical\nSent | 29 October 2018 13:28\nHello\nsorry... this time in English...\nThe fault 95:241 error temp measurement — capacitor box which can occur after a software update has been answered\nina ticket. See below.\nThis might help so that you do not need to put the old software back on.\n28. November 2017 | 15:55 | PANAGIOTIS DRAKOPOULOS | Info by First-Level\nProblem solved. Wiring was wrong on the control board pitch\n24. November 2017 | 09:37 | Stanley Huang | Info by First-Level\nWe have a same problem in £44 CS48a turbine.\nOur technicians swap the pin of capacitor box plug from 5 to 4 for both box B and C\n48. October 2017 | 10:39 | Matthias Waitz | Info by First-Level\nIn the plug at the capacitor box (wiring WG01) the cores 1 and 4 are swapped.\nSo the temperature of the heating resistors is getting measured against N-potetial and not against GND of control peb\npitch..\nThe incorrect wiring has not been detected until now because the temperature of the capacitors has not been watched till\nnow. This has been activated since 1O software control cab. V5.20.\nSo if you get this type of fault please check the wiring. When measuring the resistance between X6:1 and X6:3 on the\nControl Board Pitch, there should be a value of about 960 Ohm.\nWith regards / Mit freundlichen GriiBen\nBen Arndt, M.Eng.\nIn-House Technical Support\nENERGY FOR THE WORLD\nii ENERCON\nENERCON Services UK Ltd.\nMace House, 3 Sovereign Court,\nErmine Business Park, Huntingdon PE29 6XU\n01480 415852\ntechnical-uk@enercon.de\nwww.enercon.de\nLENERCON Services UK Lt. Place of Busines: House Cordff-C ‘No, 05634531 - Managing Director: Julian Martin\n‘This e-mail message together with ts attachments, if any is confidential and may contain information subject to legal privilege (eg. attorney-client-pivilege. f you\n‘are not the intended recipient or have received this e-mailin error, please inform us immediately and delete this message. Any unauthorised copying ofthis message\nfend ) oF distribution ofthe contained herein is pr\nProblem description.\nAfter software update too Pitch V5.86 the status 95:241/251/261 appeard.\nPossible solution.\nThere is implemented a monitoring of the emergency-capacitor of all three\nblades in software V5.86.\nIf this status will appear after software update, the wiring must be checked.\nThe resistor of the sensor (between X6:1 and X6:3 on the Control Board\nPitch) must be approx 960 Ohm.\nBi 50017 eer]\npitch temperatures:\ncapacitor A:\nT(act) = +128°C\nT(max) = +129°C","im":["shared_fault_info_1_108"],"k":"95:241"},{"i":72,"c":"Faults","s":"50-99","t":"95:804","d":"27 February 2018","f":"shared fault info 1.pdf","p":[109],"r":"","b":"Transformer room temperature","o":"","im":[],"k":"95:804"},{"i":73,"c":"Faults","s":"50-99","t":"95:911","d":"25 November 2019","f":"shared fault info 1.pdf","p":[110],"r":"","b":"The transformer should not have two sensors installed. If the team have not identified which sensor\nshould be installed request that they send a picture to Grid operations for the top of the transformer\n\nPlease see the far left port. This is a PT100 sensor (Its big and bulky) The KTY sensor is a wire\ndropped through the bung.\n\nOnce we have worked out what sensor should be installed we may need to work out where the\nother sensor goes to.","o":"95:911\n25 November 2019 15:27\n[095 | |Error temperature-measurement\n{911 | |Transformer: PT100 and KTY connected\nThe transformer should not have two sensors installed. If the team have not identified which sensor\nshould be installed request that they send a picture to Grid operations for the top of the transformer\nPlease see the far left port. This is a PT100 sensor (Its big and bulky) The KTY sensor is a wire\ndropped through the bung.\nOnce we have worked out what sensor should be installed we may need to work out where the\nother sensor goes to.","im":["shared_fault_info_1_110"],"k":"95:911"},{"i":74,"c":"Faults","s":"100-199","t":"101 Water cooling","d":"02 March 2017","f":"shared fault info 1.pdf","p":[111],"r":"","b":"TD-esc-07-de-en-16-007 Rev001\n\n    W101.1\n   Fault wat...","o":"","im":[],"k":""},{"i":75,"c":"Faults","s":"100-199","t":"100:11 Air cooling","d":"31 March 2020","f":"shared fault info 1.pdf","p":[112],"r":"","b":".\n Internal nacelle pressure (E-82 3MW):\nThe threshold for warning message 100:10 \"Internal nacelle pressure too low\" has\nbeen raised from 375Pa to 390Pa for the E-82 3MW.\n\nGenerator pressure (E82 E2 only):\nInstead of the internal nacelle pressure, the E-82 E2 measures the pressure in the\ngenerator. With the ventilation fans operating at 100%, the pressure difference\nbetween nacelle and generator shield is >600Pa. Since the measuring range of\nthe E-82 pressure sensor only went to 500Pa, a pressure sensor with a measuring\nrange of 0 – 10mbar (1000Pa) is used for E-82 E2. While the negative input of the\nsensor remains open and measures the pressure inside the nacelle, the positive\ninput is connected to the generator shield via a tube.\nTo distinguish the two ventilation variants, warning message 100:11 \"generator\npressure too low\" has been introduced. Warning message 100:11 is generated if\nat maximum fan setpoint, the generator pressure is below 580Pa.","o":"","im":[],"k":"100:11"},{"i":76,"c":"Faults","s":"100-199","t":"101:7 Fault water cooling - filling level too low","d":"18 September 2020","f":"shared fault info 1.pdf","p":[113],"r":"","b":"Warning status after at least 30 liter Glycosol leakage within the expansion tank\nAfter 7 days the warning creates WEC stop\nReset via SCADA possible\n\nPossible cause\nSensor error\nLeakage of cooling liquid\nExpansion tank\nPump\nGenerator\nAir vent\n\nPossible impact\nContamination of the generator winding\nInsulations damage of the generator\nGenerator Update\n\nPossible repair method\nCleaning directly after the leakage should be possible (long term damage cannot be cleaned)","o":"101:7 Fault water cooling - filling level too low\n18 September 2020 13:52\nWarning status after at least 30 liter Glycosol leakage within the expansion tank\nAfter 7 days the warning creates WEC stop\nReset via SCADA possible\nPossible cause\nSensor error\nLeakage of cooling liquid\nExpansion tank\nPump\nGenerator\nAir vent\nPossible impact\nContamination of the generator winding\nInsulations damage of the generator\nGenerator Update\nPossible repair method\nCleaning directly after the leakage should be possible (long term damage cannot be cleaned)","im":["shared_fault_info_1_113"],"k":"101:7"},{"i":77,"c":"Faults","s":"100-199","t":"112:XX Some detector","d":"18 September 2020","f":"shared fault info 1.pdf","p":[114,115,116],"r":"","b":"Smoke detection monitoring .\n\nDamage exists as per the above?\nA Near miss is required, escalation through the ticketing system to Germany also required.\n\n122:103Transformer oil pressure\nTuesday, April 26, 2016   3:51 PM\n\n    . Reset lock on the I/O board.\n    .Drawing - 005-550216-v600. page 56\n    Check weather links are/are not installed - XD02 26A/26B 27A/27B 28A/28B.\n      - with regards to the fault on the turbine dealing with on this occasion, carrying out replacement of\n    the I/O Board and installing missing jumbers to the switches - overpressure and oil temp cured the\n    issue. The transformer in question was - \"CG POWER SYSTEMS TRANSFORMER, S/N 10211600183,\n    MANUFACTURE 2016, STANDARD, IEC 60078/16.\n\n    NOTE other transformers may or may not require the above jumpers.\n\n    Sorting this issue cleared the reset lock and cleared other issues within the turbine.\n\n122:115 Fault transformer, over temp cooling pump.\nThursday, June 02, 2016   9:36 AM\n\nAll the new E82 turbines coming into the UK have the KNAF transformer option activated in I/O board 2. Up to now the only way of deactivating is to remove the\ncooling pump sensor and the check back relay from the I/O board.\nThere is a way of permanently deactivating this option.\n 1. Remove the sensor (X7.1B) and relay plug (X8.4B) from the I/O board 2.\n 2. Restart the WEC. The turbine should start.\n 3. Stop the WEC and reinsert the plugs into the I/O board\n 4. Reboot the I/O board by removing power and applying power to the board.\n\nYou may have to play around with the above steps but both Ronnie Bonds and Lee Armstrong have commissioned a few turbines with this fault.","o":"112:XX Some detector\n18 September 2020 13:54\nSmoke detection monitoring .\nDamage exists as per the above?\nA Near miss is required, escalation through the ticketing system to Germany also required.\n122:103Transformer oil pressure\nTuesday, April 26, 2016 3:51 PM\n. Reset lock on the I/O board.\n.Drawing - 005-550216-v600. page 56\nCheck weather links are/are not installed - XDO2 26A/26B 27A/27B 28A/28B.\n- with regards to the fault on the turbine dealing with on this occasion, carrying out replacement of\nthe |/O Board and installing missing jumbers to the switches - overpressure and oil temp cured the\nissue. The transformer in question was - \"CG POWER SYSTEMS TRANSFORMER, S/N 10211600183,\nMANUFACTURE 2016, STANDARD, IEC 60078/16.\nNOTE other transformers may or may not require the above jumpers.\nSorting this issue cleared the reset lock and cleared other issues within the turbine.\n122:115 Fault transformer, over temp cooling pump.\nThursday, June 02,2016 9:36 AM\nAll the new E82 turbines coming into the UK have the KNAF transformer option activated in I/O board 2. Up to now the only way of deactivating is to remove the\ncooling pump sensor and the check back relay from the I/O board.\nThere is a way of permanently deactivating this option.\n1. Remove the sensor (X7.1B) and relay plug (X8.4B) from the I/O board 2.\n2. Restart the WEC. The turbine should start.\n3. Stop the WEC and reinsert the plugs into the I/O board\n4. Reboot the I/O board by removing power and applying power to the board.\nYou may have to play around with the above steps but both Ronnie Bonds and Lee Armstrong have commissioned a few turbines with this fault.","im":["shared_fault_info_1_114","shared_fault_info_1_115","shared_fault_info_1_116"],"k":"112:XX"},{"i":78,"c":"Faults","s":"100-199","t":"130:12 Fault Charge Circuit","d":"15 August 2021","f":"shared fault info 1.pdf","p":[117],"r":"","b":"Happens after a Parameter update.\nP1200 should be off if no STATCOM is physically fitted to WEC.\nOccasionally this Parameter gets changed to on when it shouldn't.\nLocated in Reactive power menu I/O 1 Control Cabinet","o":"","im":[],"k":"130:12"},{"i":79,"c":"Faults","s":"100-199","t":"140:103 Multi-transducer DM5S Not configurable.","d":"14 January 2022","f":"shared fault info 1.pdf","p":[118,119],"r":"","b":"Multi-transducer DM5S connects via the RS485 OWG converter to serial interface ASC1\n(W5 / W6) of control cabinet I/O board 2. Communication with the DM5S is via a so-called\nModbus protocol, which is common in power plant environments. As soon as the measuring\ntransducer responds to the request for the firmware version, the I/O board recognises that\nthe multi-transducer is installed. It stores the information permanently and also transmits it to\nother bus nodes such as control cabinet I/O board 1. Then, I/O board 2 checks the\nconfiguration of the multi-transducer and corrects it automatically if it differs from the WEC\nconfiguration.\nThe following menu under \"Measuring transducer DM5S\" describes the communication with\nthe multi-transducer:\n\nFig.: 09_MEN_DM5S_KOMM_01\nThe configuration and the cyclical retrieval of grid data are performed by the I/O board using\na so-called state machine. If the state is smaller than 100, type and firmware version of the\nDM5S are retrieved and if necessary, the configuration is performed. If the state is in the\nrange 100 to 106, the cyclical retrieval of grid data is performed.\nIf the DM5S fails to respond to a request within a pre-defined time period, for example 100\nms, the counter \"error(curr)\" increases by 1. Status 140:103, \"Multi-transducer :\nConfiguration not possible\" is generated if the counter \"error(curr)\" has reached a limit of 20\nwhile the state is still smaller than 100, meaning it is still in the range of configuration. If the\ndata communication with the DM5S is working again, the error counter counts down by 1 per\nsecond. Status 140:103 is cleared automatically as soon as the error counter is below 10.\nStatus 140 turns into a fault message if it occurs 5 times in 24 hours.\nLine 4 shows the highest reading of the error counter as value \"error(max)\". Press the Quit\nkey to zero both the current and the maximum error counter value.\nThe following menu under \"Measuring transducer DM5S\" can help identify the type of\ncommunication error:\n\nFig.: 10_MEN_ASC1_ERROR_01\nIf there is a CRC16 checksum error, the CRC Error value increases by 1. If there is a data\nformat error, the Framing Error value counts up. If I/O board 2 does not read the data from\nthe serial interface fast enough, the Overrun Error counts up.\nUnder normal circumstances, all counters should remain at 0 for a long period of time. If\nnecessary, they can be reset at any time by pressing the Quit key. These counters do not\nhave any direct effect on status or warning messages.\nInfo:\nIn the event that I/O board 2 detects a multi-transducer erroneously even though none is\ninstalled, a data communication error with status 140:103 occurs in state 6 already. In this\ncase, the information that a multi-transducer is present can be deleted by pressing the Quit\nkey in the following menu under Special Functions:\n\nFig.: 03_IO_STATUS_140_103\nCauses – Developer:\n\nCauses – Developer:\n- A data communication error occurred during the configuration of the multi-transducer.\n\nFrom <https://srv-p-masterdata01.enercon.de/status/statusdescription/140:103/id/4864>","o":"140:103 Multi-transducer DM5S Not configurable.\n14 January 2022 06:52\nMulti-transducer DM5S connects via the RS485 OWG converter to serial interface ASC1\n(W5/ W6) of control cabinet I/O board 2. Communication with the DM5S is via a so-called\nModbus protocol, which is common in power plant environments. As soon as the measuring\ntransducer responds to the request for the firmware version, the I/O board recognises that\nthe multi-transducer is installed. It stores the information permanently and also transmits it to\nother bus nodes such as control cabinet I/O board 1. Then, I/O board 2 checks the\nconfiguration of the multi-transducer and corrects it automatically if it differs from the WEC\nconfiguration.\nThe following menu under \"Measuring transducer DM5S\" describes the communication with\nthe multi-transducer:\nFig.: 09_MEN_DM5S_KOMM_01\nThe configuration and the cyclical retrieval of grid data are performed by the I/O board using\na so-called state machine. If the state is smaller than 100, type and firmware version of the\nDM65S are retrieved and if necessary, the configuration is performed. If the state is in the\nrange 100 to 106, the cyclical retrieval of grid data is performed.\nIf the DM5S fails to respond to a request within a pre-defined time period, for example 100\nms, the counter \"error(curr)\" increases by 1. Status 140:103, \"Multi-transducer :\nConfiguration not possible\" is generated if the counter \"error(curr)\" has reached a limit of 20\nwhile the state is still smaller than 100, meaning it is still in the range of configuration. If the\ndata communication with the DM5S is working again, the error counter counts down by 1 per\nsecond. Status 140:103 is cleared automatically as soon as the error counter is below 10.\nStatus 140 turns into a fault message if it occurs 5 times in 24 hours.\nLine 4 shows the highest reading of the error counter as value \"error(max)\". Press the Quit\nkey to zero both the current and the maximum error counter value.\nThe following menu under \"Measuring transducer DM5S\" can help identify the type of\ncommunication error:\nFig.: 10_MEN_ASC1_ERROR_01\nIf there is a CRC16 checksum error, the CRC Error value increases by 1. If there is a data\nformat error, the Framing Error value counts up. If I/O board 2 does not read the data from\nthe serial interface fast enough, the Overrun Error counts up.\nUnder normal circumstances, all counters should remain at 0 for a long period of time. If\nnecessary, they can be reset at any time by pressing the Quit key. These counters do not\nhave any direct effect on status or warning messages.\nInfo:\nIn the event that I/O board 2 detects a multi-transducer erroneously even though none is\ninstalled, a data communication error with status 140:103 occurs in state 6 already. In this\ncase, the information that a multi-transducer is present can be deleted by pressing the Quit\nkey in the following menu under Special Functions:\nFig.:03 IO STATUS 140 103\nCauses — Developer:\n- A data communication error occurred during the configuration of the multi-transducer.\nFrom <https://srv-p-masterdata01.enercon.de/status/statusdescription/140:103/id/4864>","im":["shared_fault_info_1_118","shared_fault_info_1_119"],"k":"140:103"},{"i":80,"c":"Faults","s":"100-199","t":"150:4","d":"03 February 2017","f":"shared fault info 1.pdf","p":[120],"r":"","b":"Special functions\nPower control\nMains data settings\nInitialize Mains Parameter\n\nSelect 50hz without Transformer.","o":"150:4\n03 February 2017 10:27\ninitialize\nmains parameter\nstartyv\nSGiesedes\nfet)\nuaieeabeeetenmntens\nSpecial functions\nPower control\nMains data settings\nInitialize Mains Parameter\nSelect 50hz without Transformer.","im":["shared_fault_info_1_120"],"k":"150:4"},{"i":81,"c":"Faults","s":"100-199","t":"152:xx","d":"11 August 2021","f":"shared fault info 1.pdf","p":[121],"r":"","b":"Change of parameters after initialization of the EEPROM\n\nAfter a software update, an initialization of the EEPROM often takes place unnecessarily. This is really necessary only in ra re cases.\n\nBy initializing, system-specific parameters in the background depend on the basic settings, such as turbine version / blade version set to correct va lues that are safe\nfor the wind turbine. The power optimized maximum power (P2100) is also set to default values as a function of the rated acti ve power (P2003).\n\nIf dependent parameters (e.g. set rotation speed (power optimized), depending on the turbine version / blade version) have been changed after a last initialization,\nthey are thus reset again on reinitialization.\n\nIf these parameters have been set in the SAP system as desired values, a comparison error can still occur with the subsequent YP message in the SAP system.\n\nInitialization is required only if the software prompts you with status 152: xxx. This can be done automatically after a soft ware update or when changing\nthe parameters in basic settings such as the nominal active power. An initialization without request from the software is to be avoided and to be carried\nout only with separate instruction (among other things by software description, ESC-Electrical Engineering, developer).\n\nAfter every initialization of the EEPROM, a parameter update must always be carried out for the reasons mentioned above. This is to ensure that the parameters\nwith different setpoint specifications are again set to the default settings of the software in the wind turbine.","o":"","im":[],"k":"152:xx"},{"i":82,"c":"Faults","s":"100-199","t":"158:82 Serial number","d":"23 February 2018","f":"shared fault info 1.pdf","p":[122,123],"r":"","b":"192:1\nTuesday, June 14, 2016   9:08 AM\n                                                                            How to remotely reset a 192:1\n                                                                            Resettig of 192-1\n                                                                                                                                                               S192.1 UPS\n                                                                                                                                                              fault. UPS ...\nIf the UPS is fine it might be a broken IO board.\nYou can make the board forget everything and put new software and parameters on with this manual (instead of using a new board):\n\nThe IO board can be reset with the battery jumper:\njumper is on IO board 1 nacelle. On top of the board next to the display.\nMove jumper to the right.\nwait 5 minutes\nmove jumper to the left again\nDo a software and parameter adjustment to the board.\n\nSometimes the fault can be triggered by a wrong FACTS software. Which software are you using? ->I think it is rather not the problem probably as you should\nstill be able to start the WEC. And it then would fault every now and again. But worth double-checking.\n\nFault description:","o":"158:82 Serial number\n23 February 2018 14:05\n1.) Serial number entry (starting with V1.43; 11/2005):\nA menu for entering the serial number of the WEC has been included under\n“Basic settings”. Press both grey keys to make an approximate preselection of the\nserial number. Once the exit key is pressed, the program sends the entered serial\nnumber to I/O board 1 in the nacelle, which then returns the serial number after\nsaving it. This number will not be sent to any other contro! board in the WEC until\nboth serial numbers are identical. This will ensure that “new” serial numbers are\nnot erroneously communicated to all bus sharing units when replacing an |/O\nboard. This might result in undesired reinitialisation of these units’ memories,\nwhich in turn might lead to loss of important data and parameters}\nStatus 158:1 (“Serial number: Invalid”) will be generated if an invalid serial\nnumber for this control system has been entered.\nIf a valid serial number has been entered that does not match the serial number\nof nacelle I/O board 1, status 158:3 (“I/O contr. cab. and nacelle 1 different”) will\nbe generated. In this event, check and once more confirm the serial number.\nAll I/O boards display the current serial number following the CS type in the main\nmenu.\nIMPORTANT:\nEntering the correct WEC serial numbers is essential since control of\nnumerous options and special functions depends on these serial numbers.\n192:1\nTuesday, June 14,2016 9:08 AM How to remotely reset a 492: to remotely reset a 192:1 q\nResettig of 192-1 $192.1 UPS\nfault. UPS ...\nIf the UPS is fine it might be a broken IO board.\nYou can make the board forget everything and put new software and parameters on with this manual (instead of using a new board):\nThe 10 board can be reset with the battery jumper:\njumper is on 1O board 1 nacelle. On top of the board next to the display.\nMove jumper to the right.\nwait 5 minutes\nmove jumper to the left again\n‘Sometimes the fault can be triggered by a wrong FACTS software. Which software are you using? ->I think it is rather not the problem probably as you should\nstill be able to start the WEC. And it then would fault every now and again. But worth double-checking.\nFault description:\nIn order to promote and support the use of wind energy, wind energy converters should have power plant properties.\nENERCON integrates these properties in its wind turbines with the so-called transmission option and thus supports and\nstabilises the gnd in normal operation and in the event of grid faults. To meet the grid operators' grid code requirements\nand provide the WEC properties necessary for the grid, new turbine components and control system types were\ndeveloped in the last years.\nTo keep the control system operational during grid undervoltage (FRT), the UPS (Uninterruptible Power Supply) supplies\nthe electrical hardware components with power. In the event of a grid fault, the PCBs and the power components of the\ncontrol system are supplied with power by the three output voltages of the UPS. A DC link generates the supply voltage\nfor the PCBs and the electrical power components; it is connected to the grid during the starting phase and to the DC link\nof converters 1 and 2 in normal WEC operation. The control system is permanently supplied with power by the UPS via\nphase L1 control, i.e. the PCBs, control relays and small contactors that ensure WEC operation. Even temporary voltage\ndrops while the UPS bypass is being switched over could cause the control software controllers to fail and small relays to\nopen\nThe power supply of the power units for the yaw inverter, pitch control, the fan converter, etc. is only switched over in the\nevent of a grid fault\nif the wind energy converter has to be meet FRT requirements and is parameterised with the transmission option, an\nactivated and functional UPS is required.\nGrid parameter [1030] Grid connection Transmission/Distribution\nStatus message 192:1 (UPS not activated) is generated if\n@ the UPS has been manually deactivated,\n@ the UPS type has not been set to ENERCON UPS,\n@ the UPS needs more than 60 seconds after the start to reach operating state \"UPS online\" ,\n© a UPS error message is active for more than 60 seconds.\nCc\nDev\nQF\n@ The UPS has been manually deactivated.\n@ The UPS type has been incorrectly set.\n@ AUPS error message is displayed ( UPS status description).\nRev,\nAurich, 2012-06-28 A Beekmann\nYeasons\nVO board\nups","im":["shared_fault_info_1_122","shared_fault_info_1_123"],"k":"158:82"},{"i":83,"c":"Faults","s":"100-199","t":"192:11 Fault UPS : Error supply voltage","d":"05 January 2021","f":"shared fault info 1.pdf","p":[124,125],"r":"","b":"Problem description.\nOn a CS82 we have had status 192:11 \"Fault UPS : Error supply voltage\".\nAfter troubleshooting and replacement of a few PCBs the fault couldn´t be found.\n\nPossible solution.\nDuring further troubleshooting a defective of the current sensor L2, which is connected\non the UPS control, could be located.\nFor troubleshooting the following menu (PCB Power Control -> UPS data) have been\nused.\nAfter The WEC wasn´t in operation and the team noticed a fluctuating of the current\nmeasurement between 6A and 32A.\n\nAfter the current sensors were disconnected step by step, the team noticed that after\ndisconnecting of current sensor L2 the current of L1 and L3 dropped down too 0A .\nAfter change of current sensor L2 this problem have been solved.\n\n192:12 fault UPS\nThursday, June 16, 2016   7:44 AM\n\nroute cause 192:12\nFault cause after replacement of all Heatsinks investigated to find loose connections between ups\nboard and IGBT driver boards.","o":"192:11 Fault UPS : Error supply voltage\n05 January 2021 11:52\nProblem description.\nOn a CS82 we have had status 192:11 \"Fault UPS : Error supply voltage\".\nAfter troubleshooting and replacement of a few PCBs the fault couldn ‘t be found.\nPossible solution.\nDuring further troubleshooting a defective of the current sensor L2, which is connected\non the UPS control, could be located.\nFor troubleshooting the following menu (PCB Power Control -> UPS data) have been\nused.\nAfter The WEC wasn’t in operation and the team noticed a fluctuating of the current\nmeasurement between 6A and 32A.\nAfter the current sensors were disconnected step by step, the team noticed that after\ndisconnecting of current sensor L2 the current of L1 and L3 dropped down too 0A.\nAfter change of current sensor L2 this problem have been solved.\nInverter supply V1.5\nJ\nHi x2 N\nwT\nHi xt\n192:12 fault UPS\nThursday, June 16, 2016 7:44 AM\nroute cause 192:12\nFault cause after replacement of all Heatsinks investigated to find loose connections between ups\nboard and IGBT driver boards.","im":["shared_fault_info_1_124","shared_fault_info_1_125"],"k":"192:11"},{"i":84,"c":"Faults","s":"100-199","t":"192:40 UPS overvoltage of DC-Link","d":"17 November 2017","f":"shared fault info 1.pdf","p":[126],"r":"","b":"Cable had become detached from IGBT.\nCable was difficult to identify as is hidden behind Fibre cables. This cable then routes to the DC -link.","o":"","im":[],"k":"192:40"},{"i":85,"c":"Faults","s":"100-199","t":"192:074 ups NO DATA","d":"10 April 2018","f":"shared fault info 1.pdf","p":[127],"r":"","b":"When a turbine is displaying this fault and the turbine does not have a UPS installed. Please check\nthe settings within the FACTS pcb. On the FACTS pcb go to UPS DATA, scroll through to UPS type and\nmake sure this is selected to NO - UPS.","o":"192:074 ups NO DATA\n10 April 2018 15:28\nWhen a turbine is displaying this fault and the turbine does not have a UPS installed. Please check\nthe settings within the FACTS pcb. On the FACTS pcb go to UPS DATA, scroll through to UPS type and\nmake sure this is selected to NO - UPS.\ndefine UPS typ RM\nno UPS\n< > v A Enter\n< > v A\n< > v A","im":["shared_fault_info_1_127"],"k":"192:074"},{"i":86,"c":"Faults","s":"100-199","t":"192:80 Fault UPS DC link blown.","d":"02 November 2018","f":"shared fault info 1.pdf","p":[128],"r":"","b":"","o":"192:80 Fault UPS DC link blown.\n02 November 2018 09:33\nFuse F15, F16 or F17 is defective. The purpose of these fuses is to link the DC links of converters 1 and 2. During\nWEC operation the UPS is supplied with power by the converter DC links. Only during start-up and in the event of lack\nof wind, it is supplied with power from the grid. If one of these fuses is defective, the WEC is not supplied with power in\ncase of a grid fault.\nAetrsthunte\nrH contactor\nhoe\noe\ntid\nro\n7G -FS FT\nma “|\n3\nExample of V1 UPS circuit diagram. The fuses to be installed depend on the UPS version.","im":["shared_fault_info_1_128"],"k":"192:80"},{"i":87,"c":"Faults","s":"100-199","t":"192:92 Ups supply after bypass fault","d":"05 February 2018","f":"shared fault info 1.pdf","p":[129,130],"r":"","b":"192:201 Fault UPS-Timeout three-phase operation\nThursday, May 12, 2016   9:38 AM\n\n.Further details to 192 faults can be found - s-e-02-ger-eng-04-007 Rev002","o":"192:92 Ups supply after bypass fault\n05 February 2018 13:47\nturbine type |status type defect type ISCADA status\nE-82 E4 192 92|SCADA S:192/92\nMaterial Material description\nused in % of orders\n193883 fuse link NH SOV NH000/ 634 100%\nml pono anno - == Ea spon nnn nnn aT\nNetzschuetz t a an f\ngrid contactor tH - | | ' H\nARR i | ! | |\n-K06 iq 14 i \\\non i |! —.— |! |\nain if 1 I ain, if\n> ' ' ' !\n1 1 1 1\n-KO7 -001 AKKE } 4 ! 4 ! 4 }\n+} i I t i\na 1— t—* 1—* i\n1 L-------} —---~-. L-------}-----. L-------}----~ al\nLade-\nschuetz co to\ncharging ' '\ncontactor\n101} 3\n-V04,054 ¥ *® -vo6 mM\n1\n{|\n1\n-F15;-F16 “FIT tf\nen -\nzz =\nia Fs\ns8 8\nLeistungsschrank 1 Leistungsschrank 2 c\npowercabinet 1 power cabinet 2 \"\nFO -F10\n-KOt -K08\nrd a\n0258 an ae 5 D25A\nBypass Steverung — =005 | 1 Ausgangsschuetz\nbass control | -so1 | output contactor\n| f\n1 on I\niS\n| Steuerschrank |\n| control cabinet |\n-Loz bo - 4\nu\neer\n3\nNenana nee\nBypass\nLelsung\n192:201 Fault UPS-Timeout three-phase operation\nThursday, May 12, 2016 9:38 AM\n1.9 Status message 192:201 (Fault UPS: Timeout three-phase operation) after\nsoftware update\nThe new software (I/O Board 1 Control Cabinet CS82a V5.20) implements monitoring of three-\nphase UPS operation (see also TD-esc-06-de-xx-15-060, Point 86). The old software version\n(I/O Board 1 Control Cabinet CS82a V4.35) for the CS82a controller did not monitor this and it is\ntherefore possible that the status message 192:201 is generated after updating to a new version\nof the software, since the three-phase UPS operation is incorrectly permanently activated.\nThe most frequent cause in this case is incorrect connection of the two fibre-optic cables W3 and\nW4 to the UPS Bypass PCB (Fig. 9).\n.Further details to 192 faults can be found - s-e-02-ger-eng-04-007 Rev002","im":["shared_fault_info_1_129","shared_fault_info_1_130"],"k":"192:92"},{"i":88,"c":"Faults","s":"100-199","t":"192:201 & 202","d":"20 January 2019","f":"shared fault info 1.pdf","p":[131,132],"r":"","b":"192:201 three-phase UPS operation and faults\n\n206\"119 No data from power control - Several inverter control\nCPU1 CAN1\nWednesday, April 27, 2016   2:10 PM\n\n* Possable FACTS board fail. Please make sure you take one before going to site.\n* Also please check the fibre links from the inverter cabinets to the power board.\n* Causes - developer:\n* Check data connection from PowerControl board via optical distribution\n* board to InverterControl board.\n* (Verify correct assignment of CAN1 / CAN2.)\n* Potential additional CAN bus error messages on LCD display.\n* ERR: Can:unknown Err\"\n* ERR: CAN: Stuff Err\n* ERR: CAN: Form Err\n* ERR: CAN: Ack Err\n* ERR: CAN: Bit 1 Err\n* ERR: CAN: Bit 0 Err\n* ERR: CAN: CRC Err\n* The issue is almost always a fundamental problem with the fibre-optic\n* cables.\n* Background information: Each PCB must be able to receive the data it has\n* sent. - Otherwise, one of the CAN bus errors occurs.\n* General note:\n* Make sure the FO cables are properly installed. The cables must NOT be\n* bent or kinked. (Check in particular the FO cables inside the cable\n* ducts - bending radius too small?)\n* Any excess cable lengths should be trimmed.\n*","o":"","im":[],"k":"192:201"},{"i":89,"c":"Faults","s":"200-299","t":"200/2 E33.","d":"14 May 2018","f":"shared fault info 1.pdf","p":[133],"r":"","b":"Often this fault can be caused because the resistor wire (7364) within the relay box is defective. This\nresistor is used during the capacitor test as a load to discharge them. Often a sign that this is the\nissue when the test fails but the capacitors are holding their charge.","o":"","im":[],"k":""},{"i":90,"c":"Faults","s":"200-299","t":"200/4 Databus E33.","d":"21 August 2017","f":"shared fault info 1.pdf","p":[134],"r":"","b":"Faulty rectifier/excitation PCB found. Turbine appears to be still        The most common issue is the pitch control PCB,\nfunctioning. Replacement PCB requested from Stores, ETA 19th, Ferry       The second most common issue is Chaffed through cables in the spinner when F02 is tripped\nBooked to fit new PCB, 20th July. Sap 82321 and 11374.                    Relay box or Capacitor box\n                                                                          Rectifier and excitation PCB.\n94034519/0010\nPitch control PCB found to be faulty, replaced with new, tested pitch     Status 200:4 : synchronisation\nsystem, started WEC, all ok.                                              The electrical/optical function is as follows:\n93906030/0010-0002                                                        The first 45-odd E-40s were fitted with thyristor inverters. The so-called digital synchronisation\nchanged relay box as suggested buy in-house techs, started WEC all ak.    generates the firing pulses for the 12-pulse inverter. The synchronisation is connected to connections 9\n93906480/0010-0001                                                        and 10 on the optical distribution board. The synchronisation is powered by terminals -05X02.4 (L2)\nChanged Relay box and Capacitor box. 46:1 fault cleared. Test run then    and -05X02.18 (N).\nanother fault came 20mins later. 162:4 so we changed nacelle I/O board    Possible causes for this status are:\nand fault cleared. Turbine running.                                       · Synchronisation\n                                                                          · Optical distribution board control cabinet\n93901589/0010                                                             · Optical waveguide between optical distribution board 9, 10 and synchronisation\nFault 200:4 was a tripped circuit breaker in the nacelle control          · Power supply failure\ncabinet FO2. After resetting FO2 the turbine ran fine the only issues I\nfound were in the spinner as some of the cabling is badly chaffing\n\n                                                                          Often this fault can be caused because the resistor wire (7364) within the relay box is defective. This\n                                                                          resistor is used during the capacitor test as a load to discharge them. Often a sign that this is the issue\n                                                                          when the test fails but the capacitors are holding their charge.","o":"200/4 Databus E33.\n21 Augus 10:\nFaulty rectifier/excitation PCB found. Turbine appears to be still The most common issue is the pitch control PCB,\nfunctioning. Replacement PCB requested from Stores, ETA 19th, Ferry The second most common issue is Chaffed through cables in the spinner when F02 is tripped\nBooked to fit new PCB, 20th July. Sap 82321 and 11374. Relay box or Capacitor box\nRectifier and excitation PCB.\n94034519/0010\nPitch control PCB found to be faulty, replaced with new, tested pitch Status 200:4 : synchronisation\nsystem, started WEC, all ok. The electrical/optical function is as follows:\n93906030/0010-0002 The first 45-odd E-40s were fitted with thyristor inverters. The so-called digital synchronisation\nchanged relay box as suggested buy in-house techs, started WEC all ak generates the firing pulses for the 12-pulse inverter. The synchronisation is connected to connections 9\n93906480/0010-0001 and 10 on the optical distribution board. The synchronisation is powered by terminals -05X02.4 (L2)\nChanged Relay box and Capacitor box. 46:1 fault cleared. Test run then and -05x02.18 (N).\nanother fault came 20mins later. 162:4 so we changed nacelle I/O board Possible causes for this status are:\nand fault cleared. Turbine running, Synchronisation\nOptical distribution board control cabinet\n93901589/0010 Optical waveguide between optical distribution board 9, 10 and synchronisation\nFault 200:4 was a tripped circuit breaker in the nacelle control Power supply failure\ncabinet FO2. After resetting FO2 the turbine ran fine the only issues |\nfound were in the spinner as some of the cabling is badly chaffing\nOften this fault can be caused because the resistor wire (7364) within the relay box is defective. This\nresistor is used during the capacitor test as a load to discharge them. Often a sign that this is the issue\nwhen the test fails but the capacitors are holding their charge.\n14, August 2018 | 09:47 | Udo Dittmer | Info by Second-Level\nHello Trevor,\nyou find the counter in \"gemeral data” -> data bus errors. You can reset all errors of all boards by pushing enter button and check litle bit later which board is counting very quick. You can compare data bus errors with neighbour turbines to get a feeling what is normal.\n14, August 2018 | 08:31 | Trevor Dunlea | Info by First-Level\nHi Udo,\nAll have been checked but | will ask the team to check again.\nJust one question, where do | check the databus counter to see which boards have the most errors?\n13, August 2018 | 15:30 | Udo Dittmer | Info by Second-Level\nHello Trevor,\ndid your team\n- checked optical distribution peb in nacelle ?\n- check / change optical cable /O board <-> optical distribution nacelle cabinet\n- check J change optical cable Pitch board A <-> optical distribution rotor\n~ are slip rings for databus clean and in good condition ?\nDid you check the databus error counter ? Which boards have the most errors ?\n09. August 2018 | 09:24 | Trevor Dunlea | Problem Description\nHill\nWe have are having trouble with an intermittent faults the last number of weeks status 200: 4 Data bus error: Blade A and status 200:2 Data bus error: /O board\nThe service teams have replaced MPU board, optical distribution in the rotor sub-distribution box pitch card\nThe team have also replaced the signal contact fingers in the slip ring. They have checked all cabling and all is okay.\nThey also replaced the cable from the slip ring to the rotor sub-distribution just to rule out but the fault appeared again\nIs there any information that ye may have to get to the root cause of this fault.\nRegards,\nTrevor\nserialnumber|turbine type [status type defect type |SCADA status\n33129|E-33 200 A\\SCADA S:200/4\nMater Material description |usedin% |Quantity\n3211 PCB control pitch board V1.2 E 43% 2\n112315 slip ring unit COBHAM V5 E44 8% 4\n7264 resistor wire 68R S50W RB5O al 4% 2\n7590 PCB IO board V1.3 A% 2\n30388 relay box V1.0ass.E A% 2\n30391 pitch box ass. E31 A% 2\n35461 PCB optical distrib.nacelle V2. A% 2\n71695 slip ring unit LABEL V2 £44 no A% 2\n2294 transf.auto- 3ph. 400/115V 2,5k 2% 1\n10184 PCB MPU V1.3 £30 E66 2% 1\n11374 PCB opt.distri.contr.cabinet V2 2% 1\n11957 PCB yaw monitoring V1.0a EX 2% 1\n14473 PCB power board pitch +GBT 2% 1\n45610 pcb battery charger V2.4 2% 1\n67741 emergen.stop beatle key buttor 2% 1\n75161 IGBT-module 1200V 145A S 2% 1\n82321 PCB Controlbo. Rectifier/Excite 2% 1\n100056 sru brush holder comp. gold LA 2% 1\n105033 slip ring unit LABEL V3 E44 no 2% 1\n132395 overvoltage protection Helios D 2% 1","im":["shared_fault_info_1_134"],"k":""},{"i":91,"c":"Faults","s":"200-299","t":"221:82","d":"08 February 2018","f":"shared fault info 1.pdf","p":[135],"r":"","b":"221:82 Is the watchdog system resetting on the IO board in the control cabinet.\n\nThe watchdog system monitors the CPU on the IO board. If the expected processes have not\nbeen completed then this error is issued.\nThis is usually experienced during grid blips where the processer losses power suddenly. It can\nalso be an early sign of the IO board failing.","o":"","im":[],"k":"221:82"},{"i":92,"c":"Faults","s":"200-299","t":"232:xx","d":"15 August 2018","f":"shared fault info 1.pdf","p":[136],"r":"","b":"April 09, 2018 | 11:49 | Julian Bohlen | Solution Description\n\nHello Christoph,\n\nThis is a pure information message for the developer. These messages are mainly a signal for storing\npower and blade angle characteristics. These warnings are informal in nature and do not matter.\nThe exact text is:\n\nmain warning\n232 = General information\n\nadditional warning\n: 80 = performance curves saved\n: 90 = blade angle characteristics (I-opt.1) saved\n: 91 = blade angle characteristics (s-opt.1) saved\n\nI hope this helps you.","o":"","im":[],"k":"232:xx"},{"i":93,"c":"Faults","s":"200-299","t":"233:101 Precipitation sensor","d":"21 December 2018","f":"shared fault info 1.pdf","p":[137],"r":"","b":"In the event that a precipitation sensor has been detected erroneously even though the feature is not installed, the automatic\ndetection can be reset by simultaneously pressing both grey buttons in menu \"Special Functions\" --> \"Curr. I/O warnings\"","o":"","im":[],"k":"233:101"},{"i":94,"c":"Faults","s":"200-299","t":"233:103 Precipitation sensor","d":"21 December 2018","f":"shared fault info 1.pdf","p":[138,139],"r":"","b":"In the event that a precipitation sensor has been detected erroneously even though the feature is not installed, the automatic\ndetection can be reset by simultaneously pressing both grey buttons in menu \"Special Functions\" --> \"Curr. I/O warnings\"\n\n235.0/01/02 Access control\nThursday, June 02, 2016   9:42 AM\n\nIt is possible that these are not seen by the energy company because a timer could be set within the\nsystem for when the messages will be notified and not.","o":"233:103 Precipitation sensor\n21 December 2018 11:45\nIn the event that a precipitation sensor has been detected erroneously even though the feature is not installed, the automatic\ndetection can be reset by simultaneously pressing both grey buttons in menu \"Special Functions\" --> \"Curr. I/O warnings\"\n235.0/01/02 Access control\nThursday, June 02, 2016 9:42 AM\nAccess control : Tower door closed\ni)\nWw\nwn\n°\n0:0\nIt is possible that these are not seen by the energy company because a timer could be set within the\nsystem for when the messages will be notified and not.","im":["shared_fault_info_1_138","shared_fault_info_1_139"],"k":"233:103"},{"i":95,"c":"Faults","s":"200-299","t":"290:XXX","d":"24 October 2016","f":"shared fault info 1.pdf","p":[140,141,142,143],"r":"","b":"300\nTuesday, June 14, 2016    9:05 AM\n\nS300 . 17 or\n18 or 19 T...\n\nRef: Berry burn WEC.3.\nThe faults on berry burn WEC 3 currently are:\n300/61 Turbine control bus Anemometer interface\n300/83 Turbine control bus I/O board 1 Nacelle\n300/84 Turbine control bus I/O board 2 Nacelle\n\nThe reason for the three faults is because the ‘CAN’ bus has been disturbed and either one of the three PCB’s have stopped re ceiving and or transmitting data.\nCAN bus works by using the same cables in a loop but the different PCB’s have separate addresses so the main PCB knows where to send data to.\nIf you have a fault where CAN bus data has been lost it can be one of the following:\n    • Loose cables or plugs (This means light can enter the fibre plugs and send nuisance data)\n    • Damaged PCB’s (This means that incorrect data can be sent so the Optical distribution board may think it’s taking to a I/O bo ard but in fact is talking to the Anemometer board)\n    • Missing blanking plugs (This means light can enter the fibre plugs and send nuisance data)\n    • Nav light PLC (These can be terminated into the anemometer ports. Also a failure of the PLC can cause the above faults)\n\nIf you can check the below arears highlighted in red. If you still have a problem we will have to return with replacement PCB ’s.\n\n301:33 Feeding control Bus Error\nTuesday, June 14, 2016    9:25 AM\n\n                                                                                                                               Ref east Gowkhill - 301:33 Databus error.\nRef East Gowkhill Data bus errors.                                                                                             This issue has been on going now for some time and it looks like on several\n301:33 Feeding control bus error (Bus-off): Power control                                                                      occasions we have changed the FACTS board, Op ault. We checked the\nrotor sub box first and found it to be dead. We then looked inside the\nNCC and found FC02 to be tripped. Before resetting the breaker, I\nlooked inside the SRU and found all brushes and conductive parts to be\nserviceable. Once the CB was reset and power was restored, the rotor\nsub box came online and a 45:310 fault appeared which led us to look\ninside pitch box C. Upon opening the box, we immediately noticed that\nR1 on the batt chg. PCB (SAP No. 7076) was blown (pictures sent to M.\nDewing and C. Miller) so we replaced the board and the WEC is now\nserviceable.\n\nDetails from Tony Waslin\nPCB Bat charger - 7076 is problematic. Majority of the time there is physically nothing wrong with it, but induces\ntrickle charge faults and occasionally trips the CB in the pitch box.\n\nDO NOT ORDER. Instead install SAP 553098\n\nNot a problem at all Marc, just for added info for yourself, the issue occurs randomly, only on CS82, majority of the time\nafter a HV outage, either planned or through power cut. There is usually no damage to PCB but it brings up trickle charge\nfaults. There is a way to fudge the PCB into working when at the WEC to get it running but this usually only delays the\nreplacement.\n\nTo get the PCB working temporarily if you have no spare PCBs (7076 or 553098)\nThe blade is looking for the capacitor charge to hit the 175V threshold, when the battery charge PCB is at fault it only\ncharges for 30 seconds or so before faulting as the trickle charge on the PCB does not work, if the techs at the WEC hit\nerror reset, this will initiate fast charge again, again lasting for 30 seconds or so, if the techs repeat this process of hitting\nreset then they can get the capacitor charge to above 175V without the trickle charge system being required. This works\n90% of the time, and will usually allow the WEC to run overnight until the PCB can be replaced the following day. The\nother 10% of the time the PCB is just genuinely defect and no amount of resets will get the capacitors charged.\n\nHope you find this info useful Marc, and just give me a call or an e-mail if you need anything in future.","o":"","im":[],"k":"303:02X"},{"i":98,"c":"Faults","s":"300-399","t":"304:56 Fan inverter bus time out","d":"04 July 2019","f":"shared fault info 1.pdf","p":[147],"r":"","b":"CS82: Avoid error message at software\nupdate Fan Inverter V1.96\nFor wind turbines with control type CS82 it must be\nensured before the software Fan Inverter V1.96 is\nupdated that the installed BootBlock version is at\nleast 3.12.\nReason: With BootBlock versions ≤ 3.11 the\nsoftware update Fan Inverter V1.96 causes a\ntimeout and the error message 304:56\n\"Turbine control bus error (Timeout) : Fan inverter\"\nis generated.\nWhich BootBlock version is currently installed can\nbe found in the main menu of the PB-Gateway V1.x\nboard.","o":"304:56 Fan inverter bus time out\n04 July 2019 09:44\nCS82: Avoid error message at software\nupdate Fan Inverter V1.96\nFor wind turbines with control type CS82 it must be | ___go9rTgLock--------\nensured before the software Fan Inverter V1.96 is\nupdated that the installed BootBlock version is at 03:08 __Komp::.:00\nleast 3.12.\nReason: With BootBlock versions < 3.11 the\nsoftware update Fan Inverter V1.96 causes a\ntimeout and the error message 304:56\n\"Turbine control bus error (Timeout) : Fan inverter\"\nis generated.\nWhich BootBlock version is currently installed can\nbe found in the main menu of the PB-Gateway V1.x\nboard.","im":["shared_fault_info_1_147"],"k":"304:56"},{"i":99,"c":"Faults","s":"300-399","t":"304:117 Bus time out - Smart energise.","d":"30 September 2020","f":"shared fault info 1.pdf","p":[148],"r":"","b":"In later software the turbine may inadvertently register the presence of Smart energise.\n\nIf this system is not installed on the turbine.\n    • Go to Special functions in the I/O Display.\n    • Go to status messages\n    • With 304:117 selected, hold both grey keys for 5 seconds\nThe fault should clear from the display and they system has been forgotten from the I/O memory.\n\nAlternatively. You may need to role the software back and then re-load the up-to-date version.","o":"","im":[],"k":"304:117"},{"i":100,"c":"Faults","s":"300-399","t":"306:30 No data from: VCS for FCI.","d":"05 January 2021","f":"shared fault info 1.pdf","p":[149,150],"r":"","b":"Problem description.\nWEC stops with Status 306:30.\nAfter an communnication fault between FCU E2 and FCI in the WEC, the FCI sends\nthe warning 306:351 to the wec control system.\nThen a Timer starts to stop the WEC.\nSo after 4 days, the wec will be stopped. One after the other -> so there are an\noffset of 1hour * wec-number.\nSo each FCI has an timeout of 4 days + 1hour * wec-number.\n\nPossible solution.\nCheck the communication in the Wind farm:\nIs the FCU E2 in operation and able to communicate?\nCheck the wiring, the PCB and components regarding respective communication\nissues.\nStatus explanation:\nWEC stops with Status 306:30.\nAfter an communnication fault between FCU E2 and FCI in the WEC, the FCI sends\nthe warning 306:351 to the wec control system.\nThen a Timer starts to stop the WEC.\nSo after 4 days, the wec will be stopped. One after the other -> so there are an\noffset of 1hour * wec-number.\nSo each FCI has an timeout of 4 days + 1hour * wec-number.\n\n327:xxx\nTuesday, August 30, 2016    3:54 PM\n                                                                                                            327:310 display parameters\n\nAfter completing a software and parameter update.\nShould you generate a 327:xxx fault that you cannot see the parameter for\nWithin the Mains parameters there is a function to restore all defaults.\n\nThis could cure a error you are currently unable to rectify.\n\nTab once left.\n\nParameter out of range 327:110\nHello all\n\nJust to let you know. I dialled into Edinbane 9 and checked the 327:110 Parameter out of range message\nfound it and cleared it.\nThe reason for the fault was P6047 was wrong.\nThat the parameter for the min wind speed (3) when the third noise opt. curve is activated. It was set to\n921.7 m/s but the maximum value is 500m/s. Noise opt. 3 is not active anyway but the turbine\ncomplained about it. Just thought I let you know in case you come to the same issue. I have changed it\non the display.\n\nWith regards / Mit freundlichen Grüßen\nBen Arndt, M.Eng.\nIn-House Technical Support","o":"306:30 No data from: VCS for FCI.\n05 January 2021 11:32\nProblem description.\nWEC stops with Status 306:30.\nAfter an communnication fault between FCU E2 and FCI in the WEC, the FCI sends\nthe warning 306:351 to the wec control system.\nThen a Timer starts to stop the WEC.\nSo after 4 days, the wec will be stopped. One after the other -> so there are an\noffset of 1hour * wec-number.\nSo each FCI has an timeout of 4 days + 1hour * wec-number.\nPossible solution.\nCheck the communication in the Wind farm:\nIs the FCU E2 in operation and able to communicate?\nCheck the wiring, the PCB and components regarding respective communication\nissues.\nStatus explanation:\nWEC stops with Status 306:30.\nAfter an communnication fault between FCU E2 and FCI in the WEC, the FCI sends\nthe warning 306:351 to the wec control system.\nThen a Timer starts to stop the WEC.\nSo after 4 days, the wec will be stopped. One after the other -> so there are an\noffset of 1hour * wec-number.\nSo each FCI has an timeout of 4 days + 1hour * wec-number.\n327:Xxx\nTuesday, August 30, 2016 3:54 PM\nAfter completing a software and parameter update.\nShould you generate a 327:xxx fault that you cannot see the parameter for\nWithin the Mains parameters there is a function to restore all defaults.\nThis could cure a error you are currently unable to rectify.\nmenu select: 4\nspecial functions\n=> mains parameters\nreactive power\neta be bled\naa\n(uadansnntasnenitensmntan\nTab once left.\nrestore mains\nparameters to\ndefault
